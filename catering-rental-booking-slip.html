<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catering, Tent & Event Rental Booking Slip - KaamKaj Bills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --primary: #d97706;
    --primary-dark: #b45309;
    --primary-soft: #fef3c7;
    --ink: #0f172a;
    --ink-muted: #475569;
    --border: #cbd5e1;
    --bg: #f1f5f9;
    --danger: #dc2626;
  }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }

  /* Top Navigation Bar */
  .top-nav {
    background: var(--ink);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid var(--primary);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .btn-home {
    background: rgba(255,255,255,0.12);
    color: #fff;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.2s;
  }
  .btn-home:hover { background: var(--primary); border-color: var(--primary); }
  .nav-title { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }

  /* PC Full-Wide Split Grid Layout */
  .kb-wrapper {
    width: 100%;
    max-width: 100%;
    padding: 18px 24px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 24px;
    align-items: start;
  }

  /* Left Control Box */
  .control-box {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  label { font-size: 11px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.4px; }

  input, select {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13.5px;
    outline: none;
    color: var(--ink);
    background: #f8fafc;
    transition: all 0.2s;
  }
  input:focus, select:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.14);
  }

  .section-badge {
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 11.5px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 16px 0 12px 0;
    text-transform: uppercase;
    border-left: 4px solid var(--primary);
  }
  .section-badge:first-of-type { margin-top: 0; }

  .toggle-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
    background: #f1f5f9;
    border: 1px solid var(--border);
    padding: 5px;
    border-radius: 10px;
  }
  .toggle-btn {
    padding: 10px;
    border: none;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--ink-muted);
    transition: 0.2s;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 3px 8px rgba(217, 119, 6, 0.28);
  }

  /* Quick Chips */
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px 0; }
  .chip-btn {
    background: #ffffff;
    border: 1px solid #fbbf24;
    color: var(--primary-dark);
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
  }
  .chip-btn:hover { background: var(--primary-soft); }

  /* Table Controls */
  .items-input-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
  .items-input-table th {
    text-align: left;
    padding: 8px 6px;
    color: var(--ink-muted);
    font-weight: 800;
    background: #fffbeb;
    border-bottom: 2px solid var(--border);
  }
  .items-input-table td { padding: 6px 4px; }
  .btn-del-row {
    background: #fee2e2;
    color: var(--danger);
    border: 1px solid #fca5a5;
    border-radius: 6px;
    width: 32px;
    height: 36px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-del-row:hover { background: var(--danger); color: #fff; }
  .btn-add-row {
    background: var(--primary-soft);
    color: var(--primary-dark);
    border: 1.5px dashed #f59e0b;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }

  /* Actions */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
  .btn {
    flex: 1;
    min-width: 140px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    transition: 0.2s;
  }
  .btn:hover { opacity: 0.93; transform: translateY(-1px); }
  .btn-pdf { background: linear-gradient(135deg, #d97706, #b45309); }
  .btn-print { background: linear-gradient(135deg, #1e293b, #0f172a); }
  .btn-wa { background: linear-gradient(135deg, #16a34a, #15803d); }

  /* Right Sticky Preview Panel */
  .preview-panel {
    position: sticky;
    top: 72px;
    width: 100%;
  }
  .preview-label {
    text-align: center;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  #a4DocSheet {
    background: #ffffff;
    width: 100%;
    padding: 20px 18px;
    border: 1.5px solid #cbd5e1;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    border-radius: 8px;
    box-sizing: border-box;
  }

  .slip-box {
    border: 1.5px solid #0f172a;
    border-radius: 8px;
    padding: 14px;
    background: #ffffff;
  }

  .slip-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--primary);
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .slip-header h2 { margin: 0; font-size: 16px; font-weight: 800; color: #0f172a; text-transform: uppercase; }
  .slip-header p { margin: 2px 0 0; font-size: 10px; color: #64748b; }
  .slip-badge {
    background: var(--primary);
    color: #ffffff;
    padding: 3px 9px;
    font-size: 10px;
    font-weight: 800;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .slip-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 11px; }
  .slip-table td { padding: 3.5px 3px; vertical-align: top; }
  .slip-table td.lbl { font-weight: 700; color: #475569; width: 25%; }
  .slip-table td.val { border-bottom: 1px dotted #94a3b8; font-weight: 600; color: #0f172a; }

  .doc-items-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 10.5px; }
  .doc-items-table th { background: #fef3c7; color: #92400e; padding: 5px; text-align: left; font-weight: 800; border: 1px solid #fcd34d; }
  .doc-items-table td { padding: 4.5px 5px; border: 1px solid #e2e8f0; font-weight: 600; }
  .t-right { text-align: right; }
  .t-center { text-align: center; }

  .amount-highlight {
    background: #fffbeb;
    border: 1.2px solid #fcd34d;
    padding: 6px 10px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
    font-size: 11px;
  }
  .notes-box { background: #f8fafc; border-left: 3px solid var(--primary); padding: 5px 8px; font-size: 10px; color: #334155; margin: 6px 0; }
  .footer-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; font-size: 10px; }
  .sig-card { width: 44%; text-align: center; border-top: 1.5px dashed #475569; padding-top: 4px; font-weight: 700; color: #334155; }

  .cut-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin: 16px 0;
    border-top: 2px dashed #94a3b8;
  }
  .cut-tag { position: absolute; top: -10px; background: #fff; padding: 0 8px; font-size: 10px; font-weight: 700; color: #64748b; }

  @media (max-width: 960px) {
    .kb-wrapper { grid-template-columns: 1fr; padding: 12px 8px; gap: 16px; }
    .preview-panel { position: static; }
    .top-nav { padding: 10px 12px; }
  }
  @media (max-width: 600px) {
    .toggle-bar, .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html" target="_self" class="btn-home">← All Tools</a>
  <span class="nav-title">KaamKaj Bills • Catering & Tent Rental Slip</span>
  <span style="width: 60px;"></span>
</div>

<div class="kb-wrapper">
  <!-- LEFT: FORM CONTROLS -->
  <div class="control-box">
    <div style="margin-bottom: 10px;">
      <label>1. Print Slip Copies (A4 पर कितनी प्रतियां?):</label>
      <div class="toggle-bar">
        <button type="button" class="toggle-btn active" id="btnOne" onclick="setCopies(1)">📄 1 Copy (Client Booking Slip)</button>
        <button type="button" class="toggle-btn" id="btnTwo" onclick="setCopies(2)">📑 2 Copies (Client + Store/Godown)</button>
      </div>
    </div>

    <div class="section-badge">1. Tent House / Catering Agency Details</div>
    <div class="grid-2">
      <div class="field"><label>Agency / Caterer Name</label><input type="text" id="in_biz" placeholder="उदा. Mangal Murti Tent, Sound & Caterers" oninput="renderDoc()"></div>
      <div class="field"><label>Office Address & Mobile</label><input type="text" id="in_addr" placeholder="उदा. Station Road, City | Mob: 98XXXXXXXX" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge">2. Event & Customer Booking Details</div>
    <div class="grid-3">
      <div class="field"><label>Booking No. (Auto)</label><input type="text" id="in_bk_no" oninput="renderDoc()"></div>
      <div class="field"><label>Booking Date</label><input type="date" id="in_bk_date" oninput="renderDoc()"></div>
      <div class="field"><label>Event / Function Date</label><input type="date" id="in_ev_date" oninput="renderDoc()"></div>
    </div>

    <div class="grid-2">
      <div class="field"><label>Customer / Host Name</label><input type="text" id="in_cust" placeholder="उदा. Rajeshwar Sharma" oninput="renderDoc()"></div>
      <div class="field"><label>Customer Mobile / WhatsApp</label><input type="text" id="in_phone" placeholder="उदा. 9876543210" oninput="renderDoc()"></div>
    </div>

    <div class="grid-2">
      <div class="field"><label>Event Venue / Hall Address</label><input type="text" id="in_venue" placeholder="उदा. Shubham Lawns / Plot No. 12" oninput="renderDoc()"></div>
      <div class="field"><label>Function Type & Timing</label><input type="text" id="in_func" placeholder="उदा. Marriage Reception (Evening 7 PM)" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge">3. Rental Items / Catering Menu Packages</div>
    <div class="chip-group">
      <button type="button" class="chip-btn" onclick="quickAdd('Waterproof Mandap / Pandal Setup', 1, 'Set', 12000)">+ Mandap Set</button>
      <button type="button" class="chip-btn" onclick="quickAdd('Plastic / Banquet Chairs with Cover', 100, 'Nos', 15)">+ 100 Chairs</button>
      <button type="button" class="chip-btn" onclick="quickAdd('Round / Buffet Serving Tables', 10, 'Nos', 150)">+ Tables</button>
      <button type="button" class="chip-btn" onclick="quickAdd('DJ Sound System & LED Stage Lights', 1, 'Set', 6500)">+ DJ & Lights</button>
      <button type="button" class="chip-btn" onclick="quickAdd('Silent Diesel Generator (15 KVA)', 1, 'Day', 3500)">+ Generator</button>
      <button type="button" class="chip-btn" onclick="quickAdd('Full Veg Catering Thali Package', 150, 'Plates', 280)">+ Catering Thali</button>
      <button type="button" class="chip-btn" onclick="quickAdd('Halwai & Serving Staff Charges', 1, 'Team', 4500)">+ Halwai Staff</button>
    </div>

    <div style="overflow-x: auto;">
      <table class="items-input-table">
        <thead>
          <tr>
            <th style="width: 44%;">Item / Menu Package</th>
            <th style="width: 16%;">Qty / Plates</th>
            <th style="width: 16%;">Unit / Days</th>
            <th style="width: 18%;">Rate (₹)</th>
            <th style="width: 6%;"></th>
          </tr>
        </thead>
        <tbody id="itemsInputsBody"></tbody>
      </table>
    </div>
    <button type="button" class="btn-add-row" onclick="addItemRow()">+ Naya Item / Package Jodein</button>

    <div class="section-badge">4. Advance, Balance & Terms</div>
    <div class="grid-3">
      <div class="field"><label>Discount (₹)</label><input type="number" id="in_disc" placeholder="0" oninput="calcTotals()"></div>
      <div class="field"><label>Advance Deposit (₹)</label><input type="number" id="in_adv" placeholder="5000" oninput="calcTotals()"></div>
      <div class="field">
        <label>Payment Mode</label>
        <select id="in_mode" onchange="renderDoc()">
          <option value="UPI / Online">UPI / Bank Transfer</option>
          <option value="CASH (नकद)">CASH (नकद)</option>
          <option value="Cheque">Cheque</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Booking Terms & Damage Policy</label><input type="text" id="in_notes" placeholder="उदा. किराये के सामान की टूट-फूट की जिम्मेदारी ग्राहक की होगी। शेष राशि कार्यक्रम से पूर्व देय है।" oninput="renderDoc()"></div>

    <div class="actions">
      <button type="button" class="btn btn-pdf" onclick="downloadA4PDF()">📥 Download A4 PDF</button>
      <button type="button" class="btn btn-print" onclick="printDocDirect()">🖨️ Direct Print</button>
      <button type="button" class="btn btn-wa" onclick="shareWhatsApp()">📲 WhatsApp Slip</button>
    </div>
  </div>

  <!-- RIGHT: LIVE PREVIEW -->
  <div class="preview-panel">
    <div class="preview-label">Live Booking Slip Preview</div>
    <div id="a4DocSheet">
      <div id="slipsContainer"></div>
    </div>
  </div>
</div>

<script>
  let copyCount = 1;
  let items = [
    { desc: 'Waterproof Mandap & Stage Decoration', qty: 1, unit: 'Set', rate: 12000 },
    { desc: 'Banquet Chairs with Ribbon Cover', qty: 100, unit: 'Nos', rate: 15 }
  ];

  function setCopies(n) {
    copyCount = n;
    document.getElementById('btnOne').classList.toggle('active', n === 1);
    document.getElementById('btnTwo').classList.toggle('active', n === 2);
    renderDoc();
  }

  function quickAdd(desc, qty, unit, rate) { items.push({ desc, qty, unit, rate }); renderInputRows(); calcTotals(); }
  function renderInputRows() {
    document.getElementById('itemsInputsBody').innerHTML = items.map((it, i) => `
      <tr>
        <td><input value="${it.desc}" oninput="items[${i}].desc=this.value;renderDoc()"></td>
        <td><input type="number" step="any" value="${it.qty}" oninput="items[${i}].qty=parseFloat(this.value)||0;calcTotals()"></td>
        <td><input value="${it.unit}" oninput="items[${i}].unit=this.value;renderDoc()"></td>
        <td><input type="number" step="any" value="${it.rate}" oninput="items[${i}].rate=parseFloat(this.value)||0;calcTotals()"></td>
        <td class="t-center"><button type="button" class="btn-del-row" onclick="delRow(${i})">✕</button></td>
      </tr>
    `).join('');
  }
  function addItemRow() { items.push({ desc: '', qty: 1, unit: 'Nos', rate: 0 }); renderInputRows(); calcTotals(); }
  function delRow(i) { if (items.length > 1) { items.splice(i, 1); renderInputRows(); calcTotals(); } }
  function calcTotals() { renderDoc(); }

  function renderDoc() {
    const biz = document.getElementById('in_biz').value.trim() || 'MANGAL MURTI TENT & CATERERS';
    const addr = document.getElementById('in_addr').value.trim() || 'Station Road, City | Mob: 98XXXXXXXX';
    const bkNo = document.getElementById('in_bk_no').value.trim() || '-';
    const bkDt = document.getElementById('in_bk_date').value || '-';
    const evDt = document.getElementById('in_ev_date').value || '-';
    const cust = document.getElementById('in_cust').value.trim() || '-';
    const ph = document.getElementById('in_phone').value.trim();
    const venue = document.getElementById('in_venue').value.trim() || '-';
    const func = document.getElementById('in_func').value.trim() || '-';
    const mode = document.getElementById('in_mode').value;
    const notes = document.getElementById('in_notes').value.trim() || 'किराये के सामान की सुरक्षा व समय पर वापसी की जिम्मेदारी ग्राहक की होगी।';

    const sub = items.reduce((s, it) => s + (it.qty * it.rate), 0);
    const disc = parseFloat(document.getElementById('in_disc').value) || 0;
    const tot = Math.max(0, sub - disc);
    const adv = parseFloat(document.getElementById('in_adv').value) || 0;
    const bal = Math.max(0, tot - adv);

    const rowsHtml = items.map((it, i) => `
      <tr>
        <td class="t-center">${i+1}</td>
        <td>${it.desc || '-'}</td>
        <td class="t-center">${it.qty} ${it.unit}</td>
        <td class="t-right">₹${it.rate.toLocaleString('en-IN')}</td>
        <td class="t-right">₹${(it.qty * it.rate).toLocaleString('en-IN')}</td>
      </tr>
    `).join('');

    const buildSlip = (badge) => `
      <div class="slip-box">
        <div class="slip-header">
          <div>
            <h2>${biz}</h2>
            <p>${addr}</p>
          </div>
          <div class="slip-badge">${badge}</div>
        </div>

        <table class="slip-table">
          <tr>
            <td class="lbl">Booking No:</td><td class="val"><b>${bkNo}</b> (Dt: ${bkDt})</td>
            <td class="lbl" style="width:22%;">Event Date:</td><td class="val" style="color:#b45309;font-weight:800;">${evDt}</td>
          </tr>
          <tr>
            <td class="lbl">Customer:</td><td class="val">${ph ? `${cust} (${ph})` : cust}</td>
            <td class="lbl" style="width:22%;">Function:</td><td class="val">${func}</td>
          </tr>
          <tr>
            <td class="lbl">Venue:</td><td class="val" colspan="3">${venue}</td>
          </tr>
        </table>

        <table class="doc-items-table">
          <thead>
            <tr>
              <th class="t-center" style="width:7%">#</th>
              <th style="width:47%">Rental Item / Menu Package</th>
              <th class="t-center" style="width:16%">Qty</th>
              <th class="t-right" style="width:14%">Rate</th>
              <th class="t-right" style="width:16%">Amount</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>

        <div class="amount-highlight">
          <div><b>NET TOTAL:</b> ₹${tot.toLocaleString('en-IN')} | <b>ADVANCE (${mode}):</b> ₹${adv.toLocaleString('en-IN')}</div>
          <div style="color:#dc2626;font-weight:800;font-size:12.5px;">BALANCE DUE: ₹${bal.toLocaleString('en-IN')}</div>
        </div>

        <div class="notes-box"><b>Terms:</b> ${notes}</div>

        <div class="footer-row">
          <div style="font-size:9.5px;color:#64748b;">Customer Signature</div>
          <div class="sig-card">Authorized Signatory (${biz})</div>
        </div>
      </div>
    `;

    let html = buildSlip('CUSTOMER BOOKING SLIP');
    if (copyCount === 2) {
      html += `<div class="cut-divider"><span class="cut-tag">✂️ CUT HERE (GODOWN / STORE COPY)</span></div>` + buildSlip('STORE / GODOWN COPY');
    }
    document.getElementById('slipsContainer').innerHTML = html;
  }

  function downloadA4PDF() {
    const clone = document.getElementById('a4DocSheet').cloneNode(true);
    clone.style.cssText = 'width:700px;margin:0 auto;padding:16px;background:#fff;border:none;box-shadow:none;';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;top:0;left:0;width:740px;z-index:999999;background:#fff;';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);
    html2pdf().set({
      margin: [6, 6, 6, 6],
      filename: `BookingSlip_${document.getElementById('in_bk_no').value || 'Event'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, width: 740, windowWidth: 740 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(clone).save().then(() => wrap.remove()).catch(() => wrap.remove());
  }

  function printDocDirect() {
    const w = window.open('', '_blank', 'width=850,height=900');
    w.document.write(`<!DOCTYPE html><html><head><title>Print Booking Slip</title><style>
      *{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;padding:8mm}
      .slip-box{border:1.5px solid #0f172a;border-radius:8px;padding:14px;margin-bottom:8px}

  function shareWhatsApp() {
    const biz = document.getElementById('in_biz').value.trim() || 'Tent & Caterers';
    const cust = document.getElementById('in_cust').value.trim() || 'Customer';
    const evDt = document.getElementById('in_ev_date').value || '-';
    const sub = items.reduce((s, it) => s + (it.qty * it.rate), 0);
    const disc = parseFloat(document.getElementById('in_disc').value) || 0;
    const adv = parseFloat(document.getElementById('in_adv').value) || 0;
    const bal = Math.max(0, (sub - disc) - adv);
    const ph = document.getElementById('in_phone').value.trim().replace(/[^0-9]/g, '');
    const msg = `*🎪 EVENT / CATERING BOOKING (${document.getElementById('in_bk_no').value})*\n*Agency:* ${biz}\n*Client:* ${cust}\n*Event Date:* ${evDt}\n*Total:* ₹${sub - disc} | *Advance:* ₹${adv}\n*Balance Due:* ₹${bal}\n\n_Generated via KaamKaj Bills._`;
    window.open(ph ? `https://wa.me/91${ph}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }

  window.onload = () => {
    const d = new Date();
    document.getElementById('in_bk_date').value = d.toISOString().split('T')[0];
    d.setDate(d.getDate() + 10);
    document.getElementById('in_ev_date').value = d.toISOString().split('T')[0];
    document.getElementById('in_bk_no').value = 'BKG-' + Math.floor(100000 + Math.random() * 899990);
    renderInputRows();
    renderDoc();
  };
