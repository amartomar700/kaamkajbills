select { border: 0; border-radius: 8px; padding: 6px 8px; font-size: 12.5px; background: #fff; color: var(--ink); max-width: 130px; outline: none; }

.hl { margin: 6px 0 0; color: var(--ink2); font-size: 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

form {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #fff;
  border-top: 1px solid var(--line);
  flex-shrink: 0;

input { flex: 1; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13.5px; outline: none; min-width: 0; }
input:focus { border-color: var(--gold); }
form button { background: var(--gold); border: 0; border-radius: 8px; padding: 0 16px; font-weight: 800; color: #2a1d00; cursor: pointer; font-size: 13px; }

function openToolUrl(url){
  try{
    if(window.top && window.top.location){

    }
  }catch(e){

}

}
function answerHTML(i){
  const [slug, hn, en, ha, ea] = T[i];
  const body = lang === 'hi' ? esc(ha) : lang === 'en' ? esc(ea) : `${esc(ha)}<p class="hl">${esc(ea)}</p>`;
  const targetUrl = `${BASE}${slug}?authuser=0`;
  return `<b>${esc(lang === 'en' ? en : hn)}</b><br>${body}<br><button type="button" class="go" onclick="openToolUrl('${targetUrl}')">${esc(ui()[5])} ↗</button><p class="hl">${mail()}</p>`;
}
function match(q){
  q = q.toLowerCase(); let best = -1, score = 0;
  T.forEach((t, i) => {
    const s = t[5].split(',').reduce((a, k) => a + (q.includes(k.toLowerCase()) ? k.length : 0), 0);
    if (s > score){ score = s; best = i; }
  });
  return best;
}
async function ask(i){ say(esc(T[i][1] + ' / ' + T[i][2]), 'me'); say(answerHTML(i), 'bot'); }

async function reply(q){
  if (AI_ENDPOINT){
    const wait = say('…', 'bot');
    try {
      const r = await fetch(AI_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({question:q, lang, topics:T.map(t => ({slug:t[0], name:t[2], info:t[4]}))})});
      const j = await r.json();
      wait.innerHTML = esc(j.answer || '') + `<p class="hl">${mail()}</p>`;
      return;
    } catch(e){ wait.remove(); }
  }
  const i = match(q);
  if (i >= 0) say(answerHTML(i), 'bot');
  else say(`${mail()}${chips([10, 17, 18, 14, 15, 0, 6])}`, 'bot');
}

$('f').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  say(esc(q), 'me'); $('q').value = ''; reply(q);
});

function setLang(l){
  lang = l; const u = ui();
  document.documentElement.lang = l; document.documentElement.dir = l === 'ur' ? 'rtl' : 'ltr';
  $('q').placeholder = u[2]; $('send').textContent = u[3]; $('sub').textContent = EMAIL;
  $('log').innerHTML = '';
  say(`${esc(u[1])}<p class="hl">${esc(u[6])}:</p>${chips([10, 17, 18, 14, 15, 19])}`, 'bot');
}
$('lang').innerHTML = Object.keys(S).map(k => `<option value="${k}">${S[k][0]}</option>`).join('');
$('lang').addEventListener('change', e => setLang(e.target.value));
const nav = (navigator.language || 'hi').slice(0, 2);
$('lang').value = S[nav] ? nav : 'hi';
setLang($('lang').value);
</script>
