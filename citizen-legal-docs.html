<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>

  <style>
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --emerald: #10b981;
      --bg: #f1f5f9;
      --card: #ffffff;
      --input-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --badge-bg: #e0f2fe;
      --badge-text: #0369a1;
    }

    body.dark-mode {
      --bg: #0b1120;
      --card: #1e293b;
      --input-bg: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --badge-bg: rgba(2, 132, 199, 0.22);
      --badge-text: #38bdf8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Bengali', 'Noto Sans Gujarati',
                   'Noto Sans Gurmukhi', 'Noto Sans Tamil', 'Noto Sans Telugu', 'Noto Sans Kannada',
                   'Noto Sans Malayalam', 'Noto Sans Oriya', 'Noto Nastaliq Urdu', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: background 0.25s, color 0.25s;
      -webkit-font-smoothing: antialiased;
    }

    /* Top App Navigation Bar */
    .app-navbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.2);
    }
    .nav-inner {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.2px;
    }
    .brand-tag {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .theme-btn, .nav-home-link {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: background 0.2s;
    }
    .theme-btn:hover, .nav-home-link:hover { background: rgba(255, 255, 255, 0.18); }

    .lang-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .lang-picker span { font-size: 0.84rem; color: #0f172a; font-weight: 700; }
    .lang-picker select {
      border: none;
      background: transparent;
      color: #0f172a;
      font-size: 0.84rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      padding: 3px 2px;
    }

    /* Main Workspace Layout */
    .kb-workspace {
      max-width: 1300px;
      margin: 20px auto;
      padding: 0 14px 40px;
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: 22px;
      align-items: start;
    }

    .ctrl-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
    }

    /* Tool Selector Grid (5 Tools) */
    .tool-selector-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .tool-btn {
      padding: 11px 8px;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      text-align: center;
      line-height: 1.35;
      transition: all 0.18s ease;
    }
    .tool-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .tool-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.28);
    }

    .sec-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
      margin: 4px 0 12px;
      letter-spacing: 0.2px;
    }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .fld label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .fld input, .fld select, .fld textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fld input:focus, .fld select:focus, .fld textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
    }
    .fld textarea { min-height: 75px; resize: vertical; }

    .form-footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .save-status {
      font-size: 0.76rem;
      color: var(--emerald);
      font-weight: 700;
    }
    .btn-reset {
      padding: 9px 14px;
      background: var(--input-bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-reset:hover { border-color: #ef4444; color: #ef4444; }

    /* ==================== PREVIEW CARD & TOOLBAR ==================== */
    .preview-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
    }

    .preview-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1.5px solid var(--border);
    }
    .preview-toolbar-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-action {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-pdf { background: var(--emerald); box-shadow: 0 3px 10px rgba(16, 185, 129, 0.25); }
    .btn-print { background: var(--accent); box-shadow: 0 3px 10px rgba(2, 132, 199, 0.25); }
    .btn-action:hover { opacity: 0.93; }

    /* ==================== A4 DOCUMENT PAPER (ALWAYS WHITE FOR PRINT/PDF) ==================== */
    .preview-scroll-box {
      width: 100%;
      background: #cbd5e1;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
    }

    #a4DocSheet {
      background: #ffffff;
      width: 100%;
      max-width: 794px;
      margin: 0 auto;
      padding: 34px 30px;
      border: 2px solid #0f172a;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      border-radius: 2px;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 980px;
    }

    .doc-hdr {
      text-align: center;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .doc-org {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .doc-sub {
      margin: 4px 0 10px;
      font-size: 11.5px;
      color: #475569;
      font-weight: 600;
    }
    .doc-title-badge {
      display: inline-block;
      background: #0f172a;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 800;
      padding: 5px 16px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .meta-tbl {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 12px;
    }
    .meta-tbl td {
      padding: 7px 6px;
      vertical-align: top;
      border-bottom: 1px dashed #cbd5e1;
      word-break: break-word;
    }
    .meta-tbl td.lbl {
      font-weight: 700;
      color: #334155;
      width: 36%;
    }
    .meta-tbl td.val {
      color: #0f172a;
      font-weight: 600;
      width: 64%;
    }

    .doc-body-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 16px;
      margin: 14px 0;
      font-size: 12.5px;
      line-height: 1.7;
      color: #0f172a;
      white-space: pre-line;
      word-break: break-word;
    }

    .decl-box {
      background: #f0fdf4;
      border-left: 4px solid #16a34a;
      padding: 10px 14px;
      font-size: 11.5px;
      color: #166534;
      line-height: 1.6;
      margin: 14px 0;
    }

    .sig-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 56px;
      padding-top: 10px;
      font-size: 11.5px;
      gap: 20px;
    }
    .sig-card {
      width: 44%;
      text-align: center;
      border-top: 1.5px solid #334155;
      padding-top: 6px;
      font-weight: 700;
      color: #0f172a;
    }

    @media (max-width: 980px) {
      .kb-workspace { grid-template-columns: 1fr; margin-top: 14px; }
    }

    @media (max-width: 640px) {
      .app-navbar { padding: 12px 14px; }
      .brand-title h1 { font-size: 1rem; }
      .tool-selector-grid { grid-template-columns: 1fr 1fr; }
      .g2, .g3 { grid-template-columns: 1fr; }
      .preview-scroll-box { padding: 6px; }
      #a4DocSheet { padding: 18px 14px; min-height: auto; }
      .doc-org { font-size: 16px; }
      .meta-tbl td.lbl { width: 42%; font-size: 11px; }
      .meta-tbl td.val { width: 58%; font-size: 11.5px; }
      .sig-grid { margin-top: 40px; font-size: 10.5px; }
      .actions { width: 100%; }
      .actions .btn-action { flex: 1; justify-content: center; }
    }

    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      html, body { background: #ffffff !important; margin: 0 !important; padding: 0 !important; }
      body * { visibility: hidden !important; }
      #a4DocSheet, #a4DocSheet * { visibility: visible !important; }
      #a4DocSheet {
        position: fixed !important; left: 0 !important; top: 0 !important;
        width: 100% !important; max-width: 100% !important; min-height: 270mm !important;
        margin: 0 !important; padding: 12mm !important;
        border: 2px solid #0f172a !important; box-shadow: none !important;
      }
    }
  </style>
</head>

    <section class="preview-card">

        <div class="actions">

  function t(key) {
    const obj = I18N[curLang] || I18N['hi'];
    return obj[key] || I18N['hi'][key] || '';
  }

  function getL() {
    return I18N[curLang] || I18N['hi'];
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    $('btn_theme').innerText = isDark ? '☀️ Light' : '🌙 Dark';
    localStorage.setItem('kb_theme', isDark ? 'dark' : 'light');
  }

  function switchTool(tool, btn) {
    currentTool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    buildFormFields();
    loadSavedData();
    renderDocument();
  }

  function changeLanguage(lang) {
    curLang = lang;
    document.documentElement.dir = (lang === 'ur') ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;

    const l = getL();
    $('ui_lang_label').innerText = l.langLabel;
    $('btn_ui_pdf').innerText = l.pdfBtn;
    $('btn_ui_print').innerText = l.printBtn;

    $('btn_t_VEHICLE').innerText = l.t1;
    $('btn_t_AFFIDAVIT').innerText = l.t2;
    $('btn_t_EXPERIENCE').innerText = l.t3;
    $('btn_t_BILTY').innerText = l.t4;
    $('btn_t_MEDICAL').innerText = l.t5;

    const snapshot = captureFormValues();
    buildFormFields();
    restoreFormValues(snapshot);
    renderDocument();
  }

  function captureFormValues() {
    const data = {};
    document.querySelectorAll('#dynamic_form_fields input, #dynamic_form_fields textarea').forEach(el => {
      if (el.id) data[el.id] = el.value;
    });
    return data;
  }

  function restoreFormValues(data) {
    Object.keys(data).forEach(id => {
      const el = $(id);
      if (el && data[id] !== undefined) el.value = data[id];
    });
  }

  function saveDataLocally() {
    try {
      const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const current = captureFormValues();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...existing, ...current }));
      const ind = $('save_indicator');
      if (ind) {
        ind.innerText = '✓ Saved';
        setTimeout(() => { ind.innerText = '✓ Auto-saved locally'; }, 1000);
      }
    } catch (e) {}
  }

  function loadSavedData() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      restoreFormValues(saved);
    } catch (e) {}
  }

  function resetCurrentForm() {
    const today = new Date().toISOString().split('T')[0];
    document.querySelectorAll('#dynamic_form_fields input, #dynamic_form_fields textarea').forEach(el => {
      el.value = (el.type === 'date') ? today : '';
    });
    localStorage.removeItem(STORAGE_KEY);
    renderDocument();
  }

  /* ==================== PROVEN A4 PDF EXPORT (VISIBLE OVERLAY + RELATIVE STAGING) ==================== */
  async function downloadA4PDF() {
    const btn = document.querySelector('.actions .btn-pdf');
    const originalButtonText = btn ? btn.textContent : '';
    const source = $('a4DocSheet');

    if (!source || !$('docContentContainer').innerHTML.trim()) {
      alert(t('enterDetails') || 'Please enter the details before downloading the PDF.');
      return;
    }

    if (typeof html2pdf === 'undefined') {
      alert('PDF library is unavailable. Please check your internet connection and try again.');
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.textContent = '⏳ Generating PDF...';
    }

    const PDF_WIDTH = 680;
    const clone = source.cloneNode(true);
    clone.removeAttribute('id');
    clone.dir = document.documentElement.dir || 'ltr';

    // Remove all duplicate IDs inside clone to prevent DOM conflicts
    clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));

    clone.style.cssText = [
      `width:${PDF_WIDTH}px`,
      `max-width:${PDF_WIDTH}px`,
      `min-width:${PDF_WIDTH}px`,
      'min-height:960px',
      'margin:0',
      'padding:26px 28px',
      'background:#ffffff',
      'color:#0f172a',
      'border:2px solid #0f172a',
      'border-radius:2px',
      'box-shadow:none',
      'box-sizing:border-box',
      'overflow:visible',
      'display:flex',
      'flex-direction:column',
      'justify-content:space-between'
    ].join(';');

    const exportStyle = document.createElement('style');
    exportStyle.textContent = `
      .pdf-export-sheet, .pdf-export-sheet * { box-sizing:border-box !important; }
      .pdf-export-sheet .doc-hdr { text-align:center !important; border-bottom:2px solid #0f172a !important; padding-bottom:10px !important; margin-bottom:14px !important; }
      .pdf-export-sheet .doc-org { margin:0 !important; font-size:18px !important; font-weight:800 !important; color:#0f172a !important; }
      .pdf-export-sheet .doc-sub { margin:4px 0 8px !important; font-size:11px !important; color:#475569 !important; }
      .pdf-export-sheet .doc-title-badge { font-size:11px !important; padding:4px 14px !important; background:#0f172a !important; color:#ffffff !important; }
      .pdf-export-sheet .meta-tbl { width:100% !important; table-layout:fixed !important; font-size:11.5px !important; border-collapse:collapse !important; }
      .pdf-export-sheet .meta-tbl td { padding:6px 5px !important; font-size:11.5px !important; word-break:break-word !important; }
      .pdf-export-sheet .meta-tbl td.lbl { width:36% !important; font-weight:700 !important; color:#334155 !important; }
      .pdf-export-sheet .meta-tbl td.val { width:64% !important; font-weight:600 !important; color:#0f172a !important; }
      .pdf-export-sheet .doc-body-box { font-size:12px !important; line-height:1.65 !important; padding:14px !important; background:#f8fafc !important; border:1px solid #cbd5e1 !important; color:#0f172a !important; }
      .pdf-export-sheet .decl-box { font-size:11px !important; padding:9px 12px !important; background:#f0fdf4 !important; color:#166534 !important; }
      .pdf-export-sheet .sig-grid { display:flex !important; justify-content:space-between !important; margin-top:48px !important; font-size:11px !important; }
      .pdf-export-sheet .sig-card { width:44% !important; text-align:center !important; border-top:1.5px solid #334155 !important; padding-top:5px !important; }
    `;
    clone.classList.add('pdf-export-sheet');

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#ffffff;z-index:999999;overflow:auto;margin:0;padding:0;';

    const staging = document.createElement('div');
    staging.style.cssText = `position:relative;top:0;left:0;width:${PDF_WIDTH}px;min-width:${PDF_WIDTH}px;margin:0;padding:0;background:#ffffff;color:#0f172a;`;
    staging.appendChild(clone);
    overlay.appendChild(staging);
    document.head.appendChild(exportStyle);
    document.body.appendChild(overlay);

    const filename = `KaamKaj_${currentTool}.pdf`;

    try {
      await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 150)));

      await html2pdf().set({
        margin: [10, 12, 12, 12],
        filename,
        image: { type: 'png', quality: 1.0 },
        html2canvas: {
          scale: 3,
          useCORS: true,
          letterRendering: true,
          scrollX: 0,
          scrollY: 0,
          x: 0,
          y: 0,
          width: PDF_WIDTH,
          windowWidth: PDF_WIDTH,
          backgroundColor: '#ffffff'
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
      }).from(staging).save();
    } catch (error) {
      console.error('Legal Document PDF export failed:', error);
      alert('PDF generate नहीं हो पाया। कृपया दोबारा प्रयास करें या Direct Print में Save as PDF चुनें।');
    } finally {
      overlay.remove();
      exportStyle.remove();
      if (btn) {
        btn.disabled = false;
        btn.textContent = originalButtonText || t('pdfBtn');
      }
    }
  }

  function printDocDirect() {
    window.focus();
    window.print();
  }

  window.onload = function() {
    if (localStorage.getItem('kb_theme') === 'dark') {
      document.body.classList.add('dark-mode');
      $('btn_theme').innerText = '☀️ Light';
    }
    buildFormFields();
    loadSavedData();
    renderDocument();
  };
