function applyLanguage(){const L=T();document.documentElement.lang=curLang;document.body.classList.toggle('rtl',curLang==='ur');document.body.dir=curLang==='ur'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(L[k])el.textContent=L[k]});document.querySelectorAll('[data-ph]').forEach(el=>{const k=el.dataset.ph;if(L[k])el.placeholder=L[k]});const themeBtn=document.getElementById('btnTheme');themeBtn.textContent=document.body.classList.contains('dark-mode')?L.light:L.dark;document.getElementById('btnPdf').querySelector('span').textContent=L.downloadPdf}
function toggleTheme(){const dark=document.body.classList.toggle('dark-mode');try{localStorage.setItem('kkb_school_theme_v2',dark?'dark':'light')}catch(e){}applyLanguage()}
function setMode(m){mode=m;document.getElementById('btnFee').classList.toggle('active',m==='FEE');document.getElementById('btnAdm').classList.toggle('active',m==='ADMISSION');document.getElementById('btnCert').classList.toggle('active',m==='CERT');document.getElementById('feeSection').style.display=m==='CERT'?'none':'block';document.getElementById('certSection').style.display=m==='CERT'?'block':'none';const pref=m==='FEE'?'FEE-':m==='ADMISSION'?'ADM-':'CRT-';document.getElementById('in_doc_no').value=pref+Math.floor(100000+Math.random()*899990);renderDoc()}
function renderDoc(){const L=T();const inst=esc(document.getElementById('in_inst').value.trim()||'APEX SKILL & COACHING ACADEMY');const addr=esc(document.getElementById('in_addr').value.trim()||'Main Road, Station Market | Mob: 9000000000');const docNo=esc(document.getElementById('in_doc_no').value.trim()||'-');const dt=esc(document.getElementById('in_date').value||'-');const batch=esc(document.getElementById('in_batch').value.trim()||'-');const stud=esc(document.getElementById('in_stud').value.trim()||'-');const parent=esc(document.getElementById('in_parent').value.trim()||'-');const course=esc(document.getElementById('in_course').value.trim()||'-');const ph=esc(document.getElementById('in_phone').value.trim()||'-');const notes=esc(document.getElementById('in_notes').value.trim()||L.thanks);
if(mode==='CERT'){const dur=esc(document.getElementById('in_dur').value.trim()||'3 Months');const grade=esc(document.getElementById('in_grade').value.trim()||'Grade A+');const dir=esc(document.getElementById('in_dir').value.trim()||'Director / Principal');document.getElementById('previewInner').innerHTML=`<div class="cert-border" dir="${curLang==='ur'?'rtl':'ltr'}"><div style="font-size:11px;font-weight:900;color:#b45309;letter-spacing:1px">${esc(L.certificateTitle)} ID: ${docNo}</div><h2 style="margin:8px 0 2px;font-size:22px;font-weight:900;color:#0f172a;text-transform:uppercase">${inst}</h2><p style="margin:0 0 16px;font-size:11px;color:#475569">${addr}</p><div class="cert-title">${esc(L.certificateTitle)}</div><p style="font-size:13px;color:#334155;margin:8px 0">${esc(L.certProud)}</p><div class="cert-name">${stud}</div><p style="font-size:11.5px;color:#475569;margin:5px 0 12px">${esc(L.certSon)} <b>${parent}</b></p><p style="font-size:12.5px;line-height:1.7;color:#1e293b;margin:0 auto;max-width:520px">${esc(L.completed)}<br><b style="font-size:15px;color:#0f172a">${course}</b><br>(${esc(L.durationLbl)}: <b>${dur}</b> | ${esc(L.session)}: <b>${batch}</b>) ${esc(L.secured)} <b>${grade}</b>.</p><div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;font-size:11px;text-align:center;gap:8px"><div style="width:35%"><b>${esc(L.issue)}:</b><br>${dt}</div><div style="width:25%;border:1.5px solid #b45309;border-radius:50%;padding:12px 4px;font-size:9px;font-weight:900;color:#b45309">${esc(L.seal)}</div><div style="width:35%;border-top:1.5px dashed #0f172a;padding-top:5px;font-weight:900">${dir}<br><span style="font-size:9.5px;color:#64748b">${esc(L.authorized)}</span></div></div></div>`;return}
const tot=Math.max(0,parseFloat(document.getElementById('in_tot_fee').value)||0);const paid=Math.max(0,parseFloat(document.getElementById('in_paid_now').value)||0);const prev=Math.max(0,parseFloat(document.getElementById('in_prev_paid').value)||0);const bal=Math.max(0,tot-(paid+prev));const pMode=esc(document.getElementById('in_mode').value);const nextDue=esc(document.getElementById('in_next_due').value.trim()||'-');const docTitle=mode==='FEE'?L.receipt:L.admissionSlip;const numberLabel=mode==='FEE'?L.receiptNo:L.admissionNo;
document.getElementById('previewInner').innerHTML=`<div class="doc-slip" dir="${curLang==='ur'?'rtl':'ltr'}"><div class="doc-header"><div class="doc-biz"><h2>${inst}</h2><p>${addr}</p></div><div class="doc-type-badge">${esc(docTitle)}</div></div><table class="meta-table"><tr><td class="lbl">${esc(numberLabel)}:</td><td class="val"><b>${docNo}</b></td><td class="lbl">${esc(L.date)}:</td><td class="val">${dt}</td></tr><tr><td class="lbl">${esc(L.student)}:</td><td class="val"><b>${stud}</b></td><td class="lbl">${esc(L.guardianLbl)}:</td><td class="val">${parent}</td></tr><tr><td class="lbl">${esc(L.courseClass)}:</td><td class="val"><b>${course}</b></td><td class="lbl">${esc(L.batch)}:</td><td class="val">${batch}</td></tr><tr><td class="lbl">${esc(L.mobile)}:</td><td class="val">${ph}</td><td class="lbl">${esc(L.mode)}:</td><td class="val">${pMode}</td></tr></table><table class="fee-table"><thead><tr><th>${esc(L.feeParticulars)}</th><th class="t-right">${esc(L.amount)}</th></tr></thead><tbody><tr><td>${esc(L.tuitionFee)}</td><td class="t-right">₹${money(tot)}</td></tr>${prev>0?`<tr><td>${esc(L.previous)}</td><td class="t-right">₹${money(prev)}</td></tr>`:''}<tr class="paid-row"><td>${esc(L.paidToday)}</td><td class="t-right">₹${money(paid)}</td></tr><tr class="balance-row"><td>${esc(L.balanceDue)}: ${nextDue})</td><td class="t-right">₹${money(bal)}</td></tr></tbody></table><div class="notes-box"><b>${esc(L.note)}:</b> ${notes}</div><div class="footer-sig-row"><div>${esc(L.studentSign)}</div><div class="sig-block">${esc(L.accountSign)}</div></div></div>`}
function downloadA4PDF(){const btn=document.getElementById('btnPdf');if(typeof html2pdf!=='function'){alert('PDF library load नहीं हुई। Internet connection जाँचें और दोबारा कोशिश करें।');return}btn.disabled=true;const L=T();btn.querySelector('span').textContent=L.generating;const savedX=window.scrollX||0,savedY=window.scrollY||0;window.scrollTo(0,0);const source=document.getElementById('a4DocSheet');const clone=source.cloneNode(true);clone.removeAttribute('id');const PDF_WIDTH=680;clone.style.cssText=[`width:${PDF_WIDTH}px`,`min-width:${PDF_WIDTH}px`,`max-width:${PDF_WIDTH}px`,'margin:0','padding:18px 20px','background-color:#ffffff','color:#0f172a','border:none','box-shadow:none','box-sizing:border-box'].join(';');const overlay=document.createElement('div');overlay.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;background:#ffffff;z-index:999999;overflow:auto;overscroll-behavior:contain;margin:0;padding:0;';const staging=document.createElement('div');staging.style.cssText=`position:relative;top:0;left:0;width:${PDF_WIDTH}px;margin:0;padding:0;background:#ffffff;`;staging.appendChild(clone);overlay.appendChild(staging);document.body.appendChild(overlay);const studentName=(document.getElementById('in_stud').value.trim()||'Student').replace(/[^a-zA-Z0-9-_]/g,'_');const fileName=`${mode}_${studentName}.pdf`;requestAnimationFrame(()=>setTimeout(()=>{html2pdf().set({margin:[8,10,10,10],filename:fileName,image:{type:'png',quality:1.0},html2canvas:{scale:3,useCORS:true,letterRendering:true,scrollX:0,scrollY:0,x:0,y:0,width:PDF_WIDTH,windowWidth:PDF_WIDTH,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true}}).from(staging).save().then(()=>{overlay.remove();window.scrollTo(savedX,savedY);btn.disabled=false;btn.querySelector('span').textContent=L.downloadPdf}).catch(err=>{console.error('PDF export failed:',err);overlay.remove();window.scrollTo(savedX,savedY);btn.disabled=false;btn.querySelector('span').textContent=L.downloadPdf;alert('PDF नहीं बन पाई। कृपया फिर से प्रयास करें।')})},150))}
function printDocDirect(){const w=window.open('','_blank','width=900,height=900');if(!w){alert('Print window popup blocked. कृपया popups allow करें।');return}const css=`*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;padding:8mm;background:#fff}.doc-slip{background:#fff;color:#0f172a;border:2px solid #0f172a;border-radius:8px;padding:16px}.doc-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #4338ca;padding-bottom:10px;margin-bottom:12px;gap:10px}.doc-biz h2{margin:0;font-size:18px}.doc-biz p{margin:3px 0 0;font-size:11px;color:#475569}.doc-type-badge{background:#4338ca;color:#fff;padding:5px 11px;border-radius:5px;font-size:10px;font-weight:800}.meta-table,.fee-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:11px}.meta-table td,.fee-table td,.fee-table th{border:1px solid #cbd5e1;padding:5px 6px;color:#0f172a}.meta-table td.lbl{background:#f8fafc;font-weight:800;width:23%}.fee-table th{background:#e0e7ff;color:#312e81;text-align:left}.fee-table tr.paid-row td{background:#f0fdf4;color:#166534}.fee-table tr.balance-row td{background:#fef2f2;color:#b91c1c}.t-right{text-align:right}.notes-box{background:#f8fafc;border-left:3px solid #4338ca;padding:7px 10px;font-size:10.5px;margin:10px 0}.footer-sig-row{display:flex;justify-content:space-between;margin-top:24px;font-size:10px}.sig-block{width:44%;text-align:center;border-top:1.5px dashed #475569;padding-top:5px;font-weight:800}.cert-border{border:4px double #b45309;border-radius:10px;padding:24px 20px;background:#fffbeb;text-align:center}.cert-title{display:inline-block;background:#b45309;color:#fff;padding:7px 20px;border-radius:30px;font-size:14px;font-weight:900;margin:12px 0 16px}.cert-name{font-size:22px;font-weight:900;color:#1e3a8a;border-bottom:1.5px dashed #b45309;display:inline-block;padding:3px 24px;margin:5px 0}@page{size:A4 portrait;margin:8mm} @media print{body{padding:0}.doc-slip,.cert-border{break-inside:avoid}}`;w.document.write(`<!DOCTYPE html><html lang="${curLang}" dir="${curLang==='ur'?'rtl':'ltr'}"><head><meta charset="UTF-8"><title>KaamKaj Bills - ${mode}</title><style>${css}</style></head><body>${document.getElementById('a4DocSheet').innerHTML}</body></html>`);w.document.close();w.focus();setTimeout(()=>{w.print();w.close()},500)}
function shareWhatsApp(){const inst=document.getElementById('in_inst').value.trim()||'Institute';const stud=document.getElementById('in_stud').value.trim()||'Student';const course=document.getElementById('in_course').value.trim()||'Course';const ph=document.getElementById('in_phone').value.trim().replace(/[^0-9]/g,'');let msg;if(mode==='CERT'){msg=`🎓 ${inst}\n${T().whatsappCert}: ${document.getElementById('in_doc_no').value}\nStudent: ${stud}\nCourse: ${course}\nGenerated via KaamKaj Bills.`}else{msg=`🎓 ${inst} (${document.getElementById('in_doc_no').value})\n${T().whatsappFee}\nStudent: ${stud}\nCourse: ${course}\nPaid Today: ₹${document.getElementById('in_paid_now').value||0}\nGenerated via KaamKaj Bills.`}window.open(ph?`https://wa.me/91${ph}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank')}
window.onload=()=>{try{if(localStorage.getItem('kkb_school_theme_v2')==='dark')document.body.classList.add('dark-mode');const savedLang=localStorage.getItem('kkb_school_lang_v2');if(savedLang&&LANGS[savedLang])curLang=savedLang}catch(e){}document.getElementById('selLang').value=curLang;document.getElementById('in_date').value=new Date().toISOString().split('T')[0];document.getElementById('in_doc_no').value='FEE-'+Math.floor(100000+Math.random()*899990);applyLanguage();renderDoc()};
</script>
