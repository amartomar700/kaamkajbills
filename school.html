<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>School, Coaching & Training Institute Suite - KaamKaj Bills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --primary: #4338ca;
    --primary-dark: #312e81;
    --primary-soft: #e0e7ff;
    --ink: #0f172a;
    --ink-muted: #475569;
    --border: #cbd5e1;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --gold: #d97706;
    --shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
  }

  body.dark-mode {
    --primary: #818cf8;
    --primary-dark: #4f46e5;
    --primary-soft: rgba(129, 140, 248, 0.16);
    --ink: #f1f5f9;
    --ink-muted: #94a3b8;
    --border: #334155;
    --bg: #0b1120;
    --surface: #1e293b;
    --surface-alt: #0f172a;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background-color: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
    transition: background-color 0.2s, color 0.2s;
  }

  /* Top Navigation Bar */
  .top-nav {
    background-color: #0f172a;
    color: #ffffff;
    padding: 12px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 3px solid #f59e0b;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }
  .nav-left, .nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-home {
    background-color: rgba(255,255,255,0.12);
    color: #ffffff;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.2s;
  }
  .btn-home:hover { background-color: #4338ca; border-color: #818cf8; }
  .nav-title { font-size: 15.5px; font-weight: 800; letter-spacing: 0.2px; }
  .btn-theme {
    background-color: rgba(255,255,255,0.14);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 7px 13px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-theme:hover { background-color: rgba(255,255,255,0.24); }

  /* Full-Screen Wide Split Grid Layout */
  .kb-wrapper {
    width: 100%;
    max-width: 1520px;
    margin: 0 auto;
    padding: 20px 26px 46px 26px;
    display: grid;
    grid-template-columns: minmax(420px, 1.05fr) minmax(500px, 0.95fr);
    gap: 24px;
    align-items: start;
  }

  /* Left Control Box */
  .control-box {
    background-color: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  label { font-size: 11px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.4px; }

  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    outline: none;
    color: var(--ink);
    background-color: var(--surface-alt);
    transition: border-color 0.2s, background-color 0.2s;
  }
  input:focus, select:focus {
    border-color: var(--primary);
    background-color: var(--surface);
    box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.14);
  }

  .section-badge {
    background-color: var(--primary-soft);
    color: var(--primary);
    font-size: 11.5px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 16px 0 12px 0;
    text-transform: uppercase;
    border-left: 4px solid var(--primary);
  }
  .section-badge:first-of-type { margin-top: 0; }

  .toggle-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 14px;
    background-color: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 5px;
    border-radius: 10px;
  }
  .toggle-btn {
    padding: 10px 6px;
    border: none;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    background-color: transparent;
    color: var(--ink-muted);
    transition: 0.2s;
  }
  .toggle-btn.active {
    background-color: #4338ca;
    color: #ffffff;
    box-shadow: 0 3px 8px rgba(67, 56, 202, 0.25);
  }

  /* Actions */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .btn {
    flex: 1;
    min-width: 145px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 800;
    color: #ffffff;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    transition: 0.2s;
  }
  .btn:hover { opacity: 0.93; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.65; cursor: not-allowed; }
  .btn-pdf { background-color: #4338ca; }
  .btn-print { background-color: #0f172a; }
  .btn-wa { background-color: #16a34a; }

  /* Right Sticky Preview Panel */
  .preview-panel {
    position: sticky;
    top: 72px;
    width: 100%;
    background-color: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .preview-label {
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  .preview-viewport {
    width: 100%;
    overflow-x: auto;
    background-color: #e2e8f0;
    padding: 16px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }
  body.dark-mode .preview-viewport {
    background-color: #0f172a;
  }
  #a4DocSheet {
    background-color: #ffffff !important;
    color: #0f172a !important;
    width: 100%;
    max-width: 700px;
    padding: 20px 18px;
    border: 1.5px solid #cbd5e1;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    border-radius: 8px;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  .slip-box {
    border: 2px solid #0f172a;
    border-radius: 8px;
    padding: 16px;
    background-color: #ffffff;
  }

  .cert-border {
    border: 4px double #b45309;
    border-radius: 10px;
    padding: 24px 20px;
    background-color: #fffbeb;
    text-align: center;
  }

  .doc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2.5px solid #4338ca;
    padding-bottom: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .doc-biz h2 { margin: 0; font-size: 18px; font-weight: 800; color: #0f172a; text-transform: uppercase; }
  .doc-biz p { margin: 3px 0 0; font-size: 11px; color: #475569; }
  .doc-type-badge {
    background-color: #4338ca;
    color: #ffffff;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 800;
    border-radius: 5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .meta-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 11px; }
  .meta-table td { padding: 4px 6px; border: 1px solid #cbd5e1; color: #0f172a; }
  .meta-table td.lbl { background-color: #f8fafc; font-weight: 700; color: #334155; width: 24%; }
  .meta-table td.val { font-weight: 600; color: #0f172a; width: 26%; }

  .fee-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 11.5px; }
  .fee-table th { background-color: #e0e7ff; color: #312e81; padding: 6px; text-align: left; font-weight: 800; border: 1px solid #a5b4fc; }
  .fee-table td { padding: 5.5px 6px; border: 1px solid #cbd5e1; font-weight: 600; color: #0f172a; }
  .t-right { text-align: right; }
  .t-center { text-align: center; }

  .notes-box { background-color: #f8fafc; border-left: 3.5px solid #4338ca; padding: 7px 10px; font-size: 10.5px; color: #334155; margin: 10px 0; }
  .footer-sig-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 26px; font-size: 10.5px; }
  .sig-block { width: 44%; text-align: center; border-top: 1.5px dashed #475569; padding-top: 4px; font-weight: 700; color: #334155; }

  @media (max-width: 1120px) {
    .kb-wrapper { grid-template-columns: 1fr; padding: 14px 12px 36px 12px; gap: 18px; }
    .preview-panel { position: static; }
  }
  @media (max-width: 760px) {
    .preview-viewport { justify-content: flex-start; padding: 10px; }
    #a4DocSheet { min-width: 620px; }
  }
  @media (max-width: 600px) {
    .toggle-bar, .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .top-nav { padding: 10px 14px; }
    .nav-title { font-size: 13.5px; }
    .control-box, .preview-panel { padding: 14px 12px; border-radius: 12px; }
  }
</style>
</head>
<body>

<div class="top-nav">
  <div class="nav-left">
    <a href="index.html" target="_self" class="btn-home">← All Tools</a>
    <span class="nav-title">KaamKaj Bills • School, Coaching &amp; Training</span>
  </div>
  <div class="nav-right">
    <button type="button" class="btn-theme" id="btnTheme" onclick="toggleTheme()">🌙 Dark Mode</button>
  </div>
</div>

<div class="kb-wrapper">
  <!-- LEFT: FORM CONTROLS -->
  <div class="control-box">
    <div style="margin-bottom: 10px;">
      <label>1. Document Type Chunein:</label>
      <div class="toggle-bar">
        <button type="button" class="toggle-btn active" id="btnFee" onclick="setMode('FEE')">🧾 Fee Receipt (फीस रसीद)</button>
        <button type="button" class="toggle-btn" id="btnAdm" onclick="setMode('ADMISSION')">🎓 Admission Slip (एडमिशन)</button>
        <button type="button" class="toggle-btn" id="btnCert" onclick="setMode('CERT')">🏆 Course Certificate</button>
      </div>
    </div>

    <div class="section-badge">1. Institute / Academy / School Details</div>
    <div class="grid-2">
      <div class="field"><label>Institute / Academy Name</label><input type="text" id="in_inst" placeholder="उदा. Apex Skill &amp; Coaching Academy" oninput="renderDoc()"></div>
      <div class="field"><label>Address, Reg No. &amp; Contact</label><input type="text" id="in_addr" placeholder="उदा. Main Road, Station Market | Mob: 9000000000" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge">2. Student &amp; Course Details</div>
    <div class="grid-3">
      <div class="field"><label>Receipt / Roll / Cert No.</label><input type="text" id="in_doc_no" oninput="renderDoc()"></div>
      <div class="field"><label>Issue Date (तारीख)</label><input type="date" id="in_date" oninput="renderDoc()"></div>
      <div class="field"><label>Batch / Academic Session</label><input type="text" id="in_batch" placeholder="उदा. 2026-27 (Morning Batch)" oninput="renderDoc()"></div>
    </div>

    <div class="grid-2">
      <div class="field"><label>Student Full Name</label><input type="text" id="in_stud" placeholder="उदा. Aarav Sharma" oninput="renderDoc()"></div>
      <div class="field"><label>Father / Guardian Name</label><input type="text" id="in_parent" placeholder="उदा. Shri Rajesh Sharma" oninput="renderDoc()"></div>
    </div>

    <div class="grid-2">
      <div class="field"><label>Course / Class / Trade Name</label><input type="text" id="in_course" placeholder="उदा. Computer &amp; Technical Diploma" oninput="renderDoc()"></div>
      <div class="field"><label>Student Mobile / WhatsApp</label><input type="text" id="in_phone" placeholder="उदा. 9000012345" oninput="renderDoc()"></div>
    </div>

    <!-- FEE & ADMISSION SECTION -->
    <div id="feeSection">
      <div class="section-badge">3. Fee Structure &amp; Installment Status (₹)</div>
      <div class="grid-3">
        <div class="field"><label>Total Course / Annual Fee (₹)</label><input type="number" id="in_tot_fee" placeholder="12000" oninput="renderDoc()"></div>
        <div class="field"><label>Amount Paid Now (₹)</label><input type="number" id="in_paid_now" placeholder="5000" oninput="renderDoc()"></div>
        <div class="field"><label>Previous Paid (If any ₹)</label><input type="number" id="in_prev_paid" placeholder="0" oninput="renderDoc()"></div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Payment Mode</label>
          <select id="in_mode" onchange="renderDoc()">
            <option value="UPI / Online">UPI / PhonePe / GPay</option>
            <option value="CASH (नकद)">CASH (नकद)</option>
            <option value="Bank Transfer / Cheque">Bank Transfer / Cheque</option>
          </select>
        </div>
        <div class="field"><label>Next Installment Due Date</label><input type="text" id="in_next_due" placeholder="उदा. 15 Dec 2026" oninput="renderDoc()"></div>
      </div>
    </div>

    <!-- CERTIFICATE SECTION -->
    <div id="certSection" style="display:none;">
      <div class="section-badge">3. Course Completion &amp; Grade Details</div>
      <div class="grid-3">
        <div class="field"><label>Course Duration</label><input type="text" id="in_dur" placeholder="उदा. 3 Months (120 Hours)" oninput="renderDoc()"></div>
        <div class="field"><label>Grade / Percentage</label><input type="text" id="in_grade" placeholder="उदा. Grade A+ (92%)" oninput="renderDoc()"></div>
        <div class="field"><label>Director / Principal Name</label><input type="text" id="in_dir" placeholder="उदा. Dr. S. K. Verma" oninput="renderDoc()"></div>
      </div>
    </div>

    <div class="field" style="margin-top: 8px;"><label>Remarks / Institute Note</label><input type="text" id="in_notes" placeholder="उदा. जमा की गई फीस वापस या ट्रांसफर नहीं होगी। नियमित उपस्थिति अनिवार्य है।" oninput="renderDoc()"></div>

    <div class="actions">
      <button type="button" class="btn btn-pdf" id="btnPdf" onclick="downloadA4PDF()">📥 Download A4 PDF</button>
      <button type="button" class="btn btn-print" onclick="printDocDirect()">🖨️ Direct Print</button>
      <button type="button" class="btn btn-wa" onclick="shareWhatsApp()">📲 WhatsApp Share</button>
    </div>
  </div>

  <!-- RIGHT: LIVE PREVIEW -->
  <div class="preview-panel">
    <div class="preview-label">Live Document Preview</div>
    <div class="preview-viewport">
      <div id="a4DocSheet">
        <div id="previewInner"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let mode = 'FEE';

  function esc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('btnTheme').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    try { localStorage.setItem('kkb_school_theme', isDark ? 'dark' : 'light'); } catch (e) {}
  }

  function setMode(m) {
    mode = m;
    document.getElementById('btnFee').classList.toggle('active', m === 'FEE');
    document.getElementById('btnAdm').classList.toggle('active', m === 'ADMISSION');
    document.getElementById('btnCert').classList.toggle('active', m === 'CERT');

    document.getElementById('feeSection').style.display = (m === 'CERT') ? 'none' : 'block';
    document.getElementById('certSection').style.display = (m === 'CERT') ? 'block' : 'none';
    const pref = m === 'FEE' ? 'FEE-' : (m === 'ADMISSION' ? 'ADM-' : 'CRT-');
    document.getElementById('in_doc_no').value = pref + Math.floor(100000 + Math.random() * 899990);
    renderDoc();
  }

  function renderDoc() {
    const inst = document.getElementById('in_inst').value.trim() || 'APEX SKILL & COACHING ACADEMY';
    const addr = document.getElementById('in_addr').value.trim() || 'Main Road, Station Market | Mob: 9000000000';
    const docNo = document.getElementById('in_doc_no').value.trim() || '-';
    const dt = document.getElementById('in_date').value || '-';
    const batch = document.getElementById('in_batch').value.trim() || '-';
    const stud = document.getElementById('in_stud').value.trim() || '-';
    const parent = document.getElementById('in_parent').value.trim() || '-';
    const course = document.getElementById('in_course').value.trim() || '-';
    const ph = document.getElementById('in_phone').value.trim() || '-';
    const notes = document.getElementById('in_notes').value.trim() || 'फीस जमा करने के लिए धन्यवाद। नियमित उपस्थिति अनिवार्य है।';

    if (mode === 'CERT') {
      const dur = document.getElementById('in_dur').value.trim() || '3 Months';
      const grade = document.getElementById('in_grade').value.trim() || 'Grade A+';
      const dir = document.getElementById('in_dir').value.trim() || 'Director / Principal';

      document.getElementById('previewInner').innerHTML = `
        <div class="cert-border">
          <div style="font-size:11px;font-weight:800;color:#b45309;letter-spacing:1.5px;text-transform:uppercase;">Certificate ID: ${esc(docNo)}</div>
          <h2 style="margin:6px 0 2px;font-size:22px;font-weight:900;color:#0f172a;text-transform:uppercase;">${esc(inst)}</h2>
          <p style="margin:0 0 16px;font-size:11px;color:#475569;">${esc(addr)}</p>

          <div style="display:inline-block;background:#b45309;color:#fff;padding:6px 20px;border-radius:30px;font-size:14px;font-weight:800;letter-spacing:1px;margin-bottom:16px;">
            CERTIFICATE OF COMPLETION
          </div>

          <p style="font-size:13px;color:#334155;margin:8px 0;">This is to proudly certify that</p>
          <div style="font-size:21px;font-weight:900;color:#1e3a8a;border-bottom:1.5px dashed #b45309;display:inline-block;padding:2px 24px;margin:4px 0;">
            ${esc(stud)}
          </div>
          <p style="font-size:11.5px;color:#475569;margin:4px 0 12px;">S/o / D/o <b>${esc(parent)}</b></p>

          <p style="font-size:12.5px;line-height:1.65;color:#1e293b;margin:0 auto;max-width:520px;">
            has successfully completed the training &amp; practical assessment in<br>
            <b style="font-size:15px;color:#0f172a;">${esc(course)}</b><br>
            (Duration: <b>${esc(dur)}</b> | Session: <b>${esc(batch)}</b>) and secured <b>${esc(grade)}</b>.
          </p>

          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;font-size:11px;text-align:center;">
            <div style="width:35%;"><b>Issue Date:</b><br>${esc(dt)}</div>
            <div style="width:25%;border:1.5px solid #b45309;border-radius:50%;padding:12px 4px;font-size:9px;font-weight:800;color:#b45309;">OFFICIAL<br>SEAL</div>
            <div style="width:35%;border-top:1.5px dashed #0f172a;padding-top:4px;font-weight:800;">${esc(dir)}<br><span style="font-size:9.5px;color:#64748b;">Authorized Signatory</span></div>
          </div>
        </div>
      `;
    } else {
      const tot = parseFloat(document.getElementById('in_tot_fee').value) || 0;
      const paid = parseFloat(document.getElementById('in_paid_now').value) || 0;
      const prev = parseFloat(document.getElementById('in_prev_paid').value) || 0;
      const bal = Math.max(0, tot - (paid + prev));
      const pMode = document.getElementById('in_mode').value;
      const nextDue = document.getElementById('in_next_due').value.trim() || '-';

      document.getElementById('previewInner').innerHTML = `
        <div class="slip-box">
          <div class="doc-header">
            <div class="doc-biz"><h2>${esc(inst)}</h2><p>${esc(addr)}</p></div>
            <div class="doc-type-badge">${mode === 'FEE' ? 'OFFICIAL FEE RECEIPT' : 'ADMISSION CONFIRMATION SLIP'}</div>
          </div>
          <table class="meta-table">
            <tr><td class="lbl">${mode === 'FEE' ? 'Receipt No:' : 'Admission No:'}</td><td class="val"><b>${esc(docNo)}</b></td><td class="lbl">Date:</td><td class="val">${esc(dt)}</td></tr>
            <tr><td class="lbl">Student Name:</td><td class="val"><b>${esc(stud)}</b></td><td class="lbl">Guardian:</td><td class="val">${esc(parent)}</td></tr>
            <tr><td class="lbl">Course / Class:</td><td class="val"><b>${esc(course)}</b></td><td class="lbl">Batch:</td><td class="val">${esc(batch)}</td></tr>
            <tr><td class="lbl">Mobile No:</td><td class="val">${esc(ph)}</td><td class="lbl">Payment Mode:</td><td class="val">${esc(pMode)}</td></tr>
          </table>
          <table class="fee-table">
            <thead><tr><th>Fee Particulars</th><th class="t-right">Amount (₹)</th></tr></thead>
            <tbody>
              <tr><td>Total Course / Tuition Fee</td><td class="t-right">₹${tot.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
              ${prev > 0 ? `<tr><td>Previously Paid Amount</td><td class="t-right">₹${prev.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>` : ''}
              <tr style="background-color:#f0fdf4;color:#166534;font-weight:800;"><td>Amount Paid Today</td><td class="t-right">₹${paid.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
              <tr style="background-color:#fef2f2;color:#dc2626;font-weight:800;"><td>Balance Fee Due (Next Due: ${esc(nextDue)})</td><td class="t-right">₹${bal.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
            </tbody>
          </table>
          <div class="notes-box"><b>Note:</b> ${esc(notes)}</div>
          <div class="footer-sig-row"><div style="font-size:10px;color:#64748b;">Student / Parent Signature</div><div class="sig-block">Accountant / Principal Sign</div></div>
        </div>
      `;
    }
  }

  /* Zero-Clipping A4 PDF Export */
  function downloadA4PDF() {
    const btn = document.getElementById('btnPdf');
    btn.disabled = true;
    btn.innerText = '⏳ Generating PDF...';

    const savedX = window.scrollX || 0;
    const savedY = window.scrollY || 0;
    window.scrollTo(0, 0);

    const source = document.getElementById('a4DocSheet');
    const clone = source.cloneNode(true);
    clone.removeAttribute('id');

    const PDF_WIDTH = 660;
    clone.style.cssText = [
      `width: ${PDF_WIDTH}px`,
      `min-width: ${PDF_WIDTH}px`,
      `max-width: ${PDF_WIDTH}px`,
      'margin: 0',
      'padding: 18px 20px',
      'background-color: #ffffff',
      'color: #0f172a',
      'border: none',
      'box-shadow: none',
      'box-sizing: border-box'
    ].join(';');

    const wrap = document.createElement('div');
    wrap.style.cssText = `position:absolute; top:0; left:0; width:${PDF_WIDTH}px; background-color:#ffffff; z-index:999999; margin:0; padding:0;`;
    wrap.appendChild(clone);
    document.body.appendChild(wrap);

    const studName = (document.getElementById('in_stud').value.trim() || 'Student').replace(/[^a-zA-Z0-9-_]/g, '_');

    requestAnimationFrame(() => {
      setTimeout(() => {
        html2pdf().set({
          margin: [8, 10, 10, 10],
          filename: `${mode}_${studName}.pdf`,
          image: { type: 'png', quality: 1.0 },
          html2canvas: {
            scale: 3,
            useCORS: true,
            letterRendering: true,
            scrollX: 0,
            scrollY: 0,
            x: 0,
            y: 0,
            width: PDF_WIDTH,
            windowWidth: PDF_WIDTH,
            backgroundColor: '#ffffff'
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
        }).from(clone).save().then(() => {
          wrap.remove();
          window.scrollTo(savedX, savedY);
          btn.disabled = false;
          btn.innerText = '📥 Download A4 PDF';
        }).catch(() => {
          wrap.remove();
          window.scrollTo(savedX, savedY);
          btn.disabled = false;
          btn.innerText = '📥 Download A4 PDF';
        });
      }, 150);
    });
  }

  function shareWhatsApp() {
    const inst = document.getElementById('in_inst').value.trim() || 'Institute';
    const stud = document.getElementById('in_stud').value.trim() || 'Student';
    const course = document.getElementById('in_course').value.trim() || 'Course';
    const ph = document.getElementById('in_phone').value.trim().replace(/[^0-9]/g, '');
    const msg = `*🎓 ${inst} (${document.getElementById('in_doc_no').value})*\n*Student:* ${stud}\n*Course:* ${course}\n*Paid Today:* ₹${document.getElementById('in_paid_now').value || 0}\n\n_Generated via KaamKaj Bills._`;
    window.open(ph ? `https://wa.me/91${ph}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }

  window.onload = () => {
    try {
      if (localStorage.getItem('kkb_school_theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('btnTheme').innerText = '☀️ Light Mode';
      }
    } catch (e) {}
    document.getElementById('in_date').value = new Date().toISOString().split('T')[0];
    document.getElementById('in_doc_no').value = 'FEE-' + Math.floor(100000 + Math.random() * 899990);
    renderDoc();
  };
