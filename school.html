<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>School, Coaching & Training Institute Suite - KaamKaj Bills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --primary: #4338ca;
    --primary-dark: #312e81;
    --primary-soft: #e0e7ff;
    --ink: #0f172a;
    --ink-muted: #475569;
    --border: #cbd5e1;
    --bg: #f1f5f9;
    --gold: #d97706;
  }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }

  /* Top Navigation Bar */
  .top-nav {
    background: var(--ink);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #f59e0b;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .btn-home {
    background: rgba(255,255,255,0.12);
    color: #fff;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.2s;
  }
  .btn-home:hover { background: var(--primary); border-color: var(--primary); }
  .nav-title { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }

  /* PC Full-Wide Split Grid Layout */
  .kb-wrapper {
    width: 100%;
    max-width: 100%;
    padding: 18px 24px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 24px;
    align-items: start;
  }

  /* Left Control Box */
  .control-box {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  label { font-size: 11px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.4px; }

  input, select {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13.5px;
    outline: none;
    color: var(--ink);
    background: #f8fafc;
    transition: all 0.2s;
  }
  input:focus, select:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.14);
  }

  .section-badge {
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 11.5px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 16px 0 12px 0;
    text-transform: uppercase;
    border-left: 4px solid var(--primary);
  }
  .section-badge:first-of-type { margin-top: 0; }

  .toggle-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 14px;
    background: #f1f5f9;
    border: 1px solid var(--border);
    padding: 5px;
    border-radius: 10px;
  }
  .toggle-btn {
    padding: 10px 6px;
    border: none;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--ink-muted);
    transition: 0.2s;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 3px 8px rgba(67, 56, 202, 0.28);
  }

  /* Actions */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
  .btn {
    flex: 1;
    min-width: 140px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    transition: 0.2s;
  }
  .btn:hover { opacity: 0.93; transform: translateY(-1px); }
  .btn-pdf { background: linear-gradient(135deg, #4338ca, #312e81); }
  .btn-print { background: linear-gradient(135deg, #1e293b, #0f172a); }
  .btn-wa { background: linear-gradient(135deg, #16a34a, #15803d); }

  /* Right Sticky Preview Panel */
  .preview-panel {
    position: sticky;
    top: 72px;
    width: 100%;
  }
  .preview-label {
    text-align: center;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  #a4DocSheet {
    background: #ffffff;
    width: 100%;
    padding: 24px 20px;
    border: 1.5px solid #cbd5e1;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    border-radius: 8px;
    box-sizing: border-box;
  }

  .slip-box {
    border: 2px solid #0f172a;
    border-radius: 8px;
    padding: 16px;
    background: #ffffff;
  }

  .cert-border {
    border: 4px double #b45309;
    border-radius: 10px;
    padding: 24px 20px;
    background: #fffbeb;
    text-align: center;
  }

  .doc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2.5px solid var(--primary);
    padding-bottom: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .doc-biz h2 { margin: 0; font-size: 18px; font-weight: 800; color: #0f172a; text-transform: uppercase; }
  .doc-biz p { margin: 3px 0 0; font-size: 11px; color: #475569; }
  .doc-type-badge {
    background: var(--primary);
    color: #ffffff;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 800;
    border-radius: 5px;
    text-transform: uppercase;
  }

  .meta-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 11px; }
  .meta-table td { padding: 4px 6px; border: 1px solid #cbd5e1; }
  .meta-table td.lbl { background: #f8fafc; font-weight: 700; color: #334155; width: 24%; }
  .meta-table td.val { font-weight: 600; color: #0f172a; width: 26%; }

  .fee-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 11.5px; }
  .fee-table th { background: #e0e7ff; color: #312e81; padding: 6px; text-align: left; font-weight: 800; border: 1px solid #a5b4fc; }
  .fee-table td { padding: 5.5px 6px; border: 1px solid #cbd5e1; font-weight: 600; }
  .t-right { text-align: right; }
  .t-center { text-align: center; }

  .notes-box { background: #f8fafc; border-left: 3.5px solid var(--primary); padding: 7px 10px; font-size: 10.5px; color: #334155; margin: 10px 0; }
  .footer-sig-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 26px; font-size: 10.5px; }
  .sig-block { width: 44%; text-align: center; border-top: 1.5px dashed #475569; padding-top: 4px; font-weight: 700; color: #334155; }

  @media (max-width: 960px) {
    .kb-wrapper { grid-template-columns: 1fr; padding: 12px 8px; gap: 16px; }
    .preview-panel { position: static; }
    .top-nav { padding: 10px 12px; }
  }
  @media (max-width: 600px) {
    .toggle-bar, .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html" target="_self" class="btn-home">← All Tools</a>
  <span class="nav-title">KaamKaj Bills • School, Coaching & Training</span>
  <span style="width: 60px;"></span>
</div>

<div class="kb-wrapper">
  <!-- LEFT: FORM CONTROLS -->
  <div class="control-box">
    <div style="margin-bottom: 10px;">
      <label>1. Document Type Chunein:</label>
      <div class="toggle-bar">
        <button type="button" class="toggle-btn active" id="btnFee" onclick="setMode('FEE')">🧾 Fee Receipt (फीस रसीद)</button>
        <button type="button" class="toggle-btn" id="btnAdm" onclick="setMode('ADMISSION')">🎓 Admission Slip (एडमिशन)</button>
        <button type="button" class="toggle-btn" id="btnCert" onclick="setMode('CERT')">🏆 Course Certificate</button>
      </div>
    </div>

    <div class="section-badge">1. Institute / Academy / School Details</div>
    <div class="grid-2">
      <div class="field"><label>Institute / Academy Name</label><input type="text" id="in_inst" placeholder="उदा. Vedayan Skill & Technical Academy" oninput="renderDoc()"></div>
      <div class="field"><label>Address, Reg No. & Contact</label><input type="text" id="in_addr" placeholder="उदा. Pune, Maharashtra | Mob: 98XXXXXXXX" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge">2. Student & Course Details</div>
    <div class="grid-3">
      <div class="field"><label>Receipt / Roll / Cert No.</label><input type="text" id="in_doc_no" oninput="renderDoc()"></div>
      <div class="field"><label>Issue Date (तारीख)</label><input type="date" id="in_date" oninput="renderDoc()"></div>
      <div class="field"><label>Batch / Academic Session</label><input type="text" id="in_batch" placeholder="उदा. 2026-27 (Morning Batch)" oninput="renderDoc()"></div>
    </div>

    <div class="grid-2">
      <div class="field"><label>Student Full Name</label><input type="text" id="in_stud" placeholder="उदा. Aditya Deshpande" oninput="renderDoc()"></div>
      <div class="field"><label>Father / Guardian Name</label><input type="text" id="in_parent" placeholder="उदा. Shri Prakash Deshpande" oninput="renderDoc()"></div>
    </div>

    <div class="grid-2">
      <div class="field"><label>Course / Class / Trade Name</label><input type="text" id="in_course" placeholder="उदा. CCNA Networking & CCTV Diploma" oninput="renderDoc()"></div>
      <div class="field"><label>Student Mobile / WhatsApp</label><input type="text" id="in_phone" placeholder="उदा. 9876543210" oninput="renderDoc()"></div>
    </div>

    <!-- FEE & ADMISSION SECTION -->
    <div id="feeSection">
      <div class="section-badge">3. Fee Structure & Installment Status (₹)</div>
      <div class="grid-3">
        <div class="field"><label>Total Course / Annual Fee (₹)</label><input type="number" id="in_tot_fee" placeholder="12000" oninput="renderDoc()"></div>
        <div class="field"><label>Amount Paid Now (₹)</label><input type="number" id="in_paid_now" placeholder="5000" oninput="renderDoc()"></div>
        <div class="field"><label>Previous Paid (If any ₹)</label><input type="number" id="in_prev_paid" placeholder="0" oninput="renderDoc()"></div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Payment Mode</label>
          <select id="in_mode" onchange="renderDoc()">
            <option value="UPI / Online">UPI / PhonePe / GPay</option>
            <option value="CASH (नकद)">CASH (नकद)</option>
            <option value="Bank Transfer / Cheque">Bank Transfer / Cheque</option>
          </select>
        </div>
        <div class="field"><label>Next Installment Due Date</label><input type="text" id="in_next_due" placeholder="उदा. 15 Dec 2026" oninput="renderDoc()"></div>
      </div>
    </div>

    <!-- CERTIFICATE SECTION -->
    <div id="certSection" style="display:none;">
      <div class="section-badge">3. Course Completion & Grade Details</div>
      <div class="grid-3">
        <div class="field"><label>Course Duration</label><input type="text" id="in_dur" placeholder="उदा. 3 Months (120 Hours)" oninput="renderDoc()"></div>
        <div class="field"><label>Grade / Percentage</label><input type="text" id="in_grade" placeholder="उदा. Grade A+ (92%)" oninput="renderDoc()"></div>
        <div class="field"><label>Director / Principal Name</label><input type="text" id="in_dir" placeholder="उदा. Amar Singh Tomar" oninput="renderDoc()"></div>
      </div>
    </div>

    <div class="field" style="margin-top: 8px;"><label>Remarks / Institute Note</label><input type="text" id="in_notes" placeholder="उदा. जमा की गई फीस वापस या ट्रांसफर नहीं होगी। नियमित उपस्थिति अनिवार्य है।" oninput="renderDoc()"></div>

    <div class="actions">
      <button type="button" class="btn btn-pdf" onclick="downloadA4PDF()">📥 Download A4 PDF</button>
      <button type="button" class="btn btn-print" onclick="printDocDirect()">🖨️ Direct Print</button>
      <button type="button" class="btn btn-wa" onclick="shareWhatsApp()">📲 WhatsApp Share</button>
    </div>
  </div>

  <!-- RIGHT: LIVE PREVIEW -->
  <div class="preview-panel">
    <div class="preview-label">Live Document Preview</div>
    <div id="a4DocSheet">
      <div id="previewInner"></div>
    </div>
  </div>
</div>

<script>
  let mode = 'FEE';

  function setMode(m) {
    mode = m;
    document.getElementById('btnFee').classList.toggle('active', m === 'FEE');
    document.getElementById('btnAdm').classList.toggle('active', m === 'ADMISSION');
    document.getElementById('btnCert').classList.toggle('active', m === 'CERT');

    document.getElementById('feeSection').style.display = (m === 'CERT') ? 'none' : 'block';
    document.getElementById('certSection').style.display = (m === 'CERT') ? 'block' : 'none';
    const pref = m === 'FEE' ? 'FEE-' : (m === 'ADMISSION' ? 'ADM-' : 'CRT-');
    document.getElementById('in_doc_no').value = pref + Math.floor(100000 + Math.random() * 899990);
    renderDoc();
  }

  function renderDoc() {
    const inst = document.getElementById('in_inst').value.trim() || 'VEDAYAN SKILL & COACHING ACADEMY';
    const addr = document.getElementById('in_addr').value.trim() || 'Pune, Maharashtra | Mob: 98XXXXXXXX';
    const docNo = document.getElementById('in_doc_no').value.trim() || '-';
    const dt = document.getElementById('in_date').value || '-';
    const batch = document.getElementById('in_batch').value.trim() || '-';
    const stud = document.getElementById('in_stud').value.trim() || '-';
    const parent = document.getElementById('in_parent').value.trim() || '-';
    const course = document.getElementById('in_course').value.trim() || '-';
    const ph = document.getElementById('in_phone').value.trim() || '-';
    const notes = document.getElementById('in_notes').value.trim() || 'फीस जमा करने के लिए धन्यवाद। नियमित उपस्थिति अनिवार्य है।';

    if (mode === 'CERT') {
      const dur = document.getElementById('in_dur').value.trim() || '3 Months';
      const grade = document.getElementById('in_grade').value.trim() || 'Grade A+';
      const dir = document.getElementById('in_dir').value.trim() || 'Director / Principal';

      document.getElementById('previewInner').innerHTML = `
        <div class="cert-border">
          <div style="font-size:11px;font-weight:800;color:#b45309;letter-spacing:1.5px;text-transform:uppercase;">Certificate ID: ${docNo}</div>
          <h2 style="margin:6px 0 2px;font-size:22px;font-weight:900;color:#0f172a;text-transform:uppercase;">${inst}</h2>
          <p style="margin:0 0 16px;font-size:11px;color:#475569;">${addr}</p>

          <div style="display:inline-block;background:#b45309;color:#fff;padding:6px 20px;border-radius:30px;font-size:14px;font-weight:800;letter-spacing:1px;margin-bottom:16px;">
            CERTIFICATE OF COMPLETION
          </div>

          <p style="font-size:13px;color:#334155;margin:8px 0;">This is to proudly certify that</p>
          <div style="font-size:21px;font-weight:900;color:#1e3a8a;border-bottom:1.5px dashed #b45309;display:inline-block;padding:2px 24px;margin:4px 0;">
            ${stud}
          </div>
          <p style="font-size:11.5px;color:#475569;margin:4px 0 12px;">S/o / D/o <b>${parent}</b></p>

          <p style="font-size:12.5px;line-height:1.65;color:#1e293b;margin:0 auto;max-width:520px;">
            has successfully completed the training & practical assessment in<br>
            <b style="font-size:15px;color:#0f172a;">${course}</b><br>
            (Duration: <b>${dur}</b> | Session: <b>${batch}</b>) and secured <b>${grade}</b>.
          </p>

          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;font-size:11px;text-align:center;">
            <div style="width:35%;"><b>Issue Date:</b><br>${dt}</div>
            <div style="width:25%;border:1.5px solid #b45309;border-radius:50%;padding:12px 4px;font-size:9px;font-weight:800;color:#b45309;">OFFICIAL<br>SEAL</div>
            <div style="width:35%;border-top:1.5px dashed #0f172a;padding-top:4px;font-weight:800;">${dir}<br><span style="font-size:9.5px;color:#64748b;">Authorized Signatory</span></div>
          </div>
        </div>
      `;
    } else {
      const tot = parseFloat(document.getElementById('in_tot_fee').value) || 0;
      const paid = parseFloat(document.getElementById('in_paid_now').value) || 0;
      const prev = parseFloat(document.getElementById('in_prev_paid').value) || 0;
      const bal = Math.max(0, tot - (paid + prev));
      const pMode = document.getElementById('in_mode').value;
      const nextDue = document.getElementById('in_next_due').value.trim() || '-';

      document.getElementById('previewInner').innerHTML = `
        <div class="slip-box">
          <div class="doc-header">
            <div class="doc-biz"><h2>${inst}</h2><p>${addr}</p></div>
            <div class="doc-type-badge">${mode === 'FEE' ? 'OFFICIAL FEE RECEIPT' : 'ADMISSION CONFIRMATION SLIP'}</div>
          </div>
          <table class="meta-table">
            <tr><td class="lbl">${mode === 'FEE' ? 'Receipt No:' : 'Admission No:'}</td><td class="val"><b>${docNo}</b></td><td class="lbl">Date:</td><td class="val">${dt}</td></tr>
            <tr><td class="lbl">Student Name:</td><td class="val"><b>${stud}</b></td><td class="lbl">Guardian:</td><td class="val">${parent}</td></tr>
            <tr><td class="lbl">Course / Class:</td><td class="val"><b>${course}</b></td><td class="lbl">Batch:</td><td class="val">${batch}</td></tr>
            <tr><td class="lbl">Mobile No:</td><td class="val">${ph}</td><td class="lbl">Payment Mode:</td><td class="val">${pMode}</td></tr>
          </table>
          <table class="fee-table">
            <thead><tr><th>Fee Particulars</th><th class="t-right">Amount (₹)</th></tr></thead>
            <tbody>
              <tr><td>Total Course / Tuition Fee</td><td class="t-right">₹${tot.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
              ${prev > 0 ? `<tr><td>Previously Paid Amount</td><td class="t-right">₹${prev.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>` : ''}
              <tr style="background:#f0fdf4;color:#166534;font-weight:800;"><td>Amount Paid Today</td><td class="t-right">₹${paid.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
              <tr style="background:#fef2f2;color:#dc2626;font-weight:800;"><td>Balance Fee Due (Next Due: ${nextDue})</td><td class="t-right">₹${bal.toLocaleString('en-IN', {minimumFractionDigits:2})}</td></tr>
            </tbody>
          </table>
          <div class="notes-box"><b>Note:</b> ${notes}</div>
          <div class="footer-sig-row"><div style="font-size:10px;color:#64748b;">Student / Parent Signature</div><div class="sig-block">Accountant / Principal Sign</div></div>
        </div>
      `;
    }
  }

  function downloadA4PDF() {
    const clone = document.getElementById('a4DocSheet').cloneNode(true);
    clone.style.cssText = 'width:700px;margin:0 auto;padding:18px;background:#fff;border:none;box-shadow:none;';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;top:0;left:0;width:740px;z-index:999999;background:#fff;';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);
    html2pdf().set({
      margin: [6, 6, 6, 6],
      filename: `${mode}_${document.getElementById('in_stud').value.trim() || 'Student'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, width: 740, windowWidth: 740 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(clone).save().then(() => wrap.remove()).catch(() => wrap.remove());
  }

  function printDocDirect() {
    const w = window.open('', '_blank', 'width=850,height=900');
    w.document.write(`<!DOCTYPE html><html><head><title>Print</title><style>
      *{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;padding:8mm}
      .slip-box{border:2px solid #0f172a;border-radius:8px;padding:16px}
      .cert-border{border:4px double #b45309;border-radius:10px;padding:24px 20px;background:#fffbeb;text-align:center}
      .doc-header{display:flex;justify-content:space-between;border-bottom:2px solid #4338ca;padding-bottom:8px;margin-bottom:10px}
      .doc-biz h2{margin:0;font-size:17px;text-transform:uppercase}.doc-biz p{margin:2px 0 0;font-size:10.5px;color:#475569}
      .doc-type-badge{background:#4338ca;color:#fff;padding:4px 10px;font-size:10.5px;font-weight:800;border-radius:4px}
      .meta-table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px}
      .meta-table td{padding:4px 6px;border:1px solid #cbd5e1}.meta-table td.lbl{background:#f8fafc;font-weight:700;width:22%}
      .fee-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
      .fee-table th{background:#e0e7ff;color:#312e81;padding:5px;text-align:left;border:1px solid #a5b4fc}
      .fee-table td{padding:5px;border:1px solid #cbd5e1}.t-right{text-align:right}
      .notes-box{background:#f8fafc;border-left:3px solid #4338ca;padding:6px 8px;font-size:10px;margin:8px 0}
      .footer-sig-row{display:flex;justify-content:space-between;margin-top:24px;font-size:10px}
      .sig-block{width:44%;text-align:center;border-top:1.5px dashed #475569;padding-top:4px;font-weight:700}
    </style></head><body>${document.getElementById('a4DocSheet').innerHTML}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 400);
  }

  function shareWhatsApp() {
    const inst = document.getElementById('in_inst').value.trim() || 'Institute';
    const stud = document.getElementById('in_stud').value.trim() || 'Student';
    const course = document.getElementById('in_course').value.trim() || 'Course';
    const ph = document.getElementById('in_phone').value.trim().replace(/[^0-9]/g, '');
    const msg = `*🎓 ${inst} (${document.getElementById('in_doc_no').value})*\n*Student:* ${stud}\n*Course:* ${course}\n*Paid Today:* ₹${document.getElementById('in_paid_now').value || 0}\n\n_Generated via KaamKaj Bills._`;
    window.open(ph ? `https://wa.me/91${ph}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }

  window.onload = () => {
    document.getElementById('in_date').value = new Date().toISOString().split('T')[0];
    document.getElementById('in_doc_no').value = 'FEE-' + Math.floor(100000 + Math.random() * 899990);
    renderDoc();
  };
</script>
