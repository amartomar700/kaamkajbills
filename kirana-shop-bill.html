<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kirana & General Store Bill - KaamKaj Bills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: #1e293b;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }

    /* Construction Icon & Gear Animation */
    .animation-box {
      position: relative;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .gear-big {
      font-size: 60px;
      display: inline-block;
      animation: spinRight 4s linear infinite;
    }

    .gear-small {
      font-size: 36px;
      display: inline-block;
      margin-left: -10px;
      margin-top: 30px;
      animation: spinLeft 3s linear infinite;
    }

    @keyframes spinRight {
      100% { transform: rotate(360deg); }
    }

    @keyframes spinLeft {
      100% { transform: rotate(-360deg); }
    }

    /* Text Styling */
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      color: #fbbf24; /* Construction Yellow */
    }

    p {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Animated Construction Stripe Progress Bar */
    .progress-track {
      width: 100%;
      height: 16px;
      background-color: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      background: repeating-linear-gradient(
        45deg,
        #f59e0b,
        #f59e0b 12px,
        #1e293b 12px,
        #1e293b 24px
      );
      background-size: 34px 34px;
      animation: moveStripes 1s linear infinite;
      border-radius: 10px;
    }

    @keyframes moveStripes {
      0% { background-position: 0 0; }
      100% { background-position: 34px 0; }
    }

    .status-text {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Ghoomte hue gears ka animation -->
    <div class="animation-box">
      <span class="gear-big">⚙️</span>
      <span class="gear-small">⚙️</span>
    </div>

    <h1>This Page is Building</h1>
    <p>Hum is page par kaam kar rahe hain. Naya aur behtar experience jald hi live hoga!</p>

    <!-- Construction Tape / Progress Bar -->
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>

    <div class="status-text">🚧 Work in Progress...</div>
  </div>

</body>
</html>
 
</script>
</body>
</html>
