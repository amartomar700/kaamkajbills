
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirana & General Store Bill - KaamKaj Bills</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f172a;
  color: #f8fafc;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 480px;
  width: 100%;
  background: #1e293b;
  padding: 40px 30px;
  border-radius: 16px;
  border: 1px solid #334155;
  box-shadow: 0 15px 35px rgba(0,0,0,.4);
}

.animation-box {
  height: 90px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
}

.gear-big {
  font-size: 60px;
  animation: spinRight 4s linear infinite;
}

.gear-small {
  font-size: 36px;
  margin-left: -10px;
  margin-top: 30px;
  animation: spinLeft 3s linear infinite;
}

@keyframes spinRight {
  to { transform: rotate(360deg); }
}

@keyframes spinLeft {
  to { transform: rotate(-360deg); }
}

h1 {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 12px;
  color: #fbbf24;
}

p {
  font-size: 15px;
  color: #94a3b8;
  margin-bottom: 28px;
  line-height: 1.6;
}

.progress-track {
  width: 100%;
  height: 16px;
  background: #0f172a;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #334155;
  margin-bottom: 12px;
}

.progress-fill {
  height: 100%;
  width: 65%;
  background: repeating-linear-gradient(
    45deg,
    #f59e0b,
    #f59e0b 12px,
    #1e293b 12px,
    #1e293b 24px
  );
  background-size: 34px 34px;
  animation: moveStripes 1s linear infinite;
}

@keyframes moveStripes {
  to { background-position: 34px 0; }
}

.status-text {
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 1.5px;
  margin-bottom: 28px;
}

/* Back Button */
.back-btn {
  display: inline-block;
  text-decoration: none;
  background: #2563eb;
  color: #fff;
  padding: 13px 26px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  transition: .3s;
}

.back-btn:hover {
  background: #1d4ed8;
  transform: translateY(-2px);
}

@media(max-width: 480px) {
  .container {
    padding: 35px 22px;
  }

  h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="animation-box">
    <span class="gear-big">⚙️</span>
    <span class="gear-small">⚙️</span>
  </div>

  <h1>This Page is Building</h1>

  <p>
    Hum is page par kaam kar rahe hain.
    Naya aur behtar experience jald hi live hoga!
  </p>

  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>

  <div class="status-text">
    🚧 WORK IN PROGRESS...
  </div>

  <a href="/" class="back-btn">
    ← Back to Home
  </a>

</div>

</body>
</html>
