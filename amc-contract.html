  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('btnTheme').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  }

  function applyPreset(key, btn) {
    document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const p = PRESETS[key];
    document.getElementById('in_scope').value = p.scope;
    equipmentList = JSON.parse(JSON.stringify(p.items));
    renderItemInputs();
    renderAMC();
  }

  function addItem() {
    equipmentList.push({ name: '', model: '', qty: '1 No' });
    renderItemInputs();
    renderAMC();
  }

  function removeItem(idx) {
    equipmentList.splice(idx, 1);
    renderItemInputs();
    renderAMC();
  }

  function updateItem(idx, field, val) {
    equipmentList[idx][field] = val;
    renderAMC();
  }

  function renderItemInputs() {
    const box = document.getElementById('itemsContainer');
    box.innerHTML = equipmentList.map((it, i) => `
      <div class="item-row">
        <input type="text" placeholder="Equipment / System Name" value="${it.name}" oninput="updateItem(${i}, 'name', this.value)">
        <input type="text" placeholder="Make / Capacity" value="${it.model}" oninput="updateItem(${i}, 'model', this.value)">
        <input type="text" placeholder="Qty" value="${it.qty}" oninput="updateItem(${i}, 'qty', this.value)">
        <button type="button" class="btn-del" onclick="removeItem(${i})">✕</button>
      </div>
    `).join('');
  }

        </div>

        <div class="amc-sig-row">
          <div class="sig-line">${L.sig1}</div>
          <div class="sig-line">${L.sig2}</div>
        </div>
      </div>
    `;
  }

  function downloadA4PDF() {
    const source = document.getElementById('a4DocSheet');
    const clone = source.cloneNode(true);
    clone.style.cssText = 'width: 680px; max-width: 680px; margin: 0; padding: 14px; background: #ffffff; color: #0f172a; border: none; box-shadow: none; box-sizing: border-box;';

    const wrap = document.createElement('div');
    wrap.style.cssText = 'position: absolute; top: 0; left: 0; width: 680px; background: #ffffff; z-index: 999999; margin: 0; padding: 0;';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);

    const fileNo = document.getElementById('in_doc_no').value.trim() || 'Contract';
    html2pdf().set({
      margin: [8, 8, 8, 8],
      filename: `AMC_Contract_${fileNo}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, x: 0, y: 0, width: 680, windowWidth: 680 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(clone).save().then(() => wrap.remove()).catch(() => wrap.remove());
  }

  function printDocDirect() {
    const w = window.open('', '_blank', 'width=850,height=950');
    w.document.write(`<!DOCTYPE html><html><head><title>Print AMC Contract</title>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Oriya:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
      <style>
      *{box-sizing:border-box;font-family:-apple-system,"Noto Sans Devanagari","Noto Sans Gujarati","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Gurmukhi","Noto Sans Oriya",sans-serif}
      body{margin:0;padding:8mm}
      .urdu-rtl{font-family:'Noto Nastaliq Urdu',serif!important;direction:rtl;text-align:right;line-height:2.1!important}
      .amc-box{border:2px solid #0f172a;padding:16px 18px}
      .amc-top-banner{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0f172a;padding-bottom:8px;margin-bottom:10px}
      .amc-provider h2{margin:0;font-size:16px;font-weight:900}.amc-provider p{margin:2px 0 0;font-size:10px;color:#475569}
      .amc-tag{background:#0f172a;color:#fff;padding:4px 9px;font-size:10px;font-weight:800;border-radius:4px}
      .amc-doc-title{text-align:center;background:#f1f5f9;border:1px solid #cbd5e1;padding:5px;font-size:13.5px;font-weight:900;margin-bottom:8px}
      .amc-parties{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;font-size:10.5px}
      .party-card{border:1px solid #cbd5e1;padding:7px 9px;background:#f8fafc}
      .party-card h4{margin:0 0 3px;font-size:10px;color:#0369a1}
      .amc-meta-strip{display:flex;justify-content:space-between;border:1px solid #0f172a;padding:5px 9px;font-size:10.5px;font-weight:700;margin-bottom:8px;background:#fffbeb}
      .amc-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:10.5px}
      .amc-table th{background:#0f172a;color:#fff;padding:4px 7px;text-align:left}
      .amc-table td{border:1px solid #cbd5e1;padding:4px 7px}
      .amc-clauses{margin:6px 0 10px 18px;padding:0;font-size:10.5px;line-height:1.5}
      .amc-clauses li{margin-bottom:3px;page-break-inside:avoid}
      .amc-fee-box{border:1.5px solid #16a34a;background:#f0fdf4;padding:7px 10px;font-size:11px;font-weight:800;color:#166534;display:flex;justify-content:space-between;margin-bottom:12px}
      .amc-sig-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px;font-size:10.5px;page-break-inside:avoid}
      .sig-line{border-top:1.5px solid #0f172a;padding-top:4px;text-align:center;font-weight:800}
    </style></head><body class="${document.getElementById('a4DocSheet').className}">${document.getElementById('a4DocSheet').innerHTML}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 500);
  }

  function shareWhatsApp() {
    const client = document.getElementById('in_client').value.trim() || 'Client';
    const docNo = document.getElementById('in_doc_no').value.trim();
    const fee = (parseFloat(document.getElementById('in_fee').value) || 0).toLocaleString('en-IN');
    const ph = document.getElementById('in_client_ph').value.trim().replace(/[^0-9]/g, '');
    const msg = `*🛡️ ANNUAL MAINTENANCE CONTRACT (${docNo})*\n*Client:* ${client}\n*Period:* ${document.getElementById('in_start').value} to ${document.getElementById('in_end').value}\n*Annual Fee:* ₹${fee}\n\n_Generated via KaamKaj Bills._`;
    window.open(ph ? `https://wa.me/91${ph}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }

  window.onload = () => {
    const today = new Date();
    const nextYear = new Date(today);
    nextYear.setFullYear(today.getFullYear() + 1);
    nextYear.setDate(today.getDate() - 1);

    document.getElementById('in_start').value = today.toISOString().split('T')[0];
    document.getElementById('in_end').value = nextYear.toISOString().split('T')[0];
    document.getElementById('in_doc_no').value = 'AMC-' + Math.floor(10000 + Math.random() * 89999);
    applyPreset('CCTV', document.querySelector('.preset-chip'));
  };
</script>
