<body>

<header>
  <a href="https://kaamkajbills.in/">
    <img src="https://kaamkajbills.in/favicon-96x96.png" alt="KB Logo" width="32" height="32">
    KaamKaj <span>Bills</span>
  </a>
  <a href="https://kaamkajbills.in/" style="font-size:0.9rem; font-weight:600;">← All Tools</a>
</header>

<div class="container">
  <!-- Input Form -->
  <div class="card">
    <h1>Bank Account Transfer Letter</h1>
    <p class="sub">Apni details bharein aur 12 bhashaon mein ready-to-print application banayein.</p>

    <div class="form-group">
      <label for="langSelect">Select Language / भाषा चुनें (12 Languages)</label>
      <select id="langSelect" onchange="updateLetter()">
        <option value="en">1. English</option>
        <option value="hi">2. हिंदी (Hindi)</option>
        <option value="mr">3. मराठी (Marathi)</option>
        <option value="gu">4. ગુજરાતી (Gujarati)</option>
        <option value="bn">5. বাংলা (Bengali)</option>
        <option value="ta">6. தமிழ் (Tamil)</option>
        <option value="te">7. తెలుగు (Telugu)</option>
        <option value="kn">8. ಕನ್ನಡ (Kannada)</option>
        <option value="ml">9. മലയാളം (Malayalam)</option>
        <option value="pa">10. ਪੰਜਾਬੀ (Punjabi)</option>
        <option value="or">11. ଓଡ଼ିଆ (Odia)</option>
        <option value="ur">12. اردو (Urdu)</option>
      </select>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Your Full Name</label>
        <input type="text" id="custName" placeholder="e.g. Rajesh Sharma" oninput="updateLetter()">
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" id="mobile" placeholder="e.g. 9876543210" oninput="updateLetter()">
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Bank Name</label>
        <input type="text" id="bankName" placeholder="e.g. State Bank of India" oninput="updateLetter()">
      </div>
      <div class="form-group">
        <label>Account Number</label>
        <input type="text" id="accNo" placeholder="e.g. 30987654321" oninput="updateLetter()">
      </div>
    </div>

    <div class="form-group">
      <label>Current Branch Name & City</label>
      <input type="text" id="oldBranch" placeholder="e.g. Deccan Gymkhana, Pune" oninput="updateLetter()">
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>New (Target) Branch Name</label>
        <input type="text" id="newBranch" placeholder="e.g. Andheri West, Mumbai" oninput="updateLetter()">
      </div>
      <div class="form-group">
        <label>New Branch Code (Optional)</label>
        <input type="text" id="branchCode" placeholder="e.g. 04512" oninput="updateLetter()">
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Reason for Transfer</label>
        <input type="text" id="reason" placeholder="e.g. Job Transfer / Home Shift" oninput="updateLetter()">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="letterDate" onchange="updateLetter()">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
      <button class="btn-copy" onclick="copyText()">📋 Copy Text</button>
    </div>
  </div>

  <!-- Live Letter Preview -->
  <div>
    <div id="letterPreview" class="preview-box indic-font"></div>
  </div>
</div>

<script>
  document.getElementById('letterDate').valueAsDate = new Date();

  function val(id, fallback) {
    const v = document.getElementById(id).value.trim();
    return v ? v : fallback;
  }

  function updateLetter() {
    const lang = document.getElementById('langSelect').value;
    const name = val('custName', '[Customer Name]');
    const mobile = val('mobile', '[Mobile Number]');
    const bank = val('bankName', '[Bank Name]');
    const acc = val('accNo', '[Account Number]');
    const oldBr = val('oldBranch', '[Current Branch]');
    const newBr = val('newBranch', '[New Branch]');
    const code = val('branchCode', '[Branch Code]');
    const reason = val('reason', 'Job Transfer / Change of Residence');
    const date = val('letterDate', 'DD/MM/YYYY');

    const preview = document.getElementById('letterPreview');
    preview.className = lang === 'ur' ? 'preview-box urdu-font' : 'preview-box indic-font';

    const templates = {
      en: `To,
The Branch Manager,
${bank},
${oldBr}

Date: ${date}

Subject: Request for transfer of Bank Account (${acc}) to ${newBr} branch.

Respected Sir/Madam,

I am maintaining a Savings/Current Account with your branch bearing Account Number ${acc}. Due to ${reason}, I have shifted to a new location and it is difficult for me to operate my account from the current branch.

Therefore, I kindly request you to transfer my bank account along with my existing KYC details, net banking, and debit card facilities to your ${newBr} branch (Branch Code: ${code}).

I am enclosing a copy of my Passbook and ID/Address proof for your reference. Kindly process my request at the earliest.

Thanking you,

Yours faithfully,
${name}
Mobile: ${mobile}
Encl: Copy of Passbook & KYC Document`,

      hi: `सेवा में,
शाखा प्रबंधक महोदय,
${bank},
${oldBr}

दिनांक: ${date}

विषय: बैंक खाता (${acc}) को ${newBr} शाखा में स्थानांतरित (Transfer) करने हेतु आवेदन।

महोदय/महोदया,

सविनय निवेदन है कि मेरा आपके बैंक की इस शाखा में एक बचत/चालू खाता है, जिसकी खाता संख्या ${acc} है। ${reason} के कारण मैं नए स्थान पर शिफ्ट हो गया हूँ, जिससे मुझे वर्तमान शाखा से लेन-देन करने में असुविधा हो रही है।

अतः आपसे विनम्र अनुरोध है कि कृपया मेरे इस खाते को आपकी ${newBr} शाखा (ब्रांच कोड: ${code}) में स्थानांतरित करने की कृपा करें।

आवेदन के साथ मेरी पासबुक और केवाईसी (KYC) दस्तावेज़ की प्रति संलग्न है।

धन्यवाद,

भवदीय,
${name}
मोबाइल: ${mobile}
संलग्नक: पासबुक एवं पहचान पत्र की प्रति`,

      mr: `प्रति,
शाखा व्यवस्थापक,
${bank},
${oldBr}

दिनांक: ${date}

विषय: बँक खाते (${acc}) ${newBr} शाखेत वर्ग (Transfer) करणेबाबत विनंती अर्ज.

महोदय/महोदया,

सविनय विनंती की, माझे आपल्या बँकेच्या या शाखेत बचत/चालू खाते असून त्याचा खाते क्रमांक ${acc} आहे. ${reason} यामुळे मी नवीन ठिकाणी स्थलांतरित झालो आहे, त्यामुळे मला या शाखेतून व्यवहार करणे गैरसोयीचे होत आहे.

तरी कृपया माझे बँक खाते आपल्या ${newBr} शाखेत (शाखा कोड: ${code}) वर्ग करावे, ही नम्र विनंती. सोबत पासबुक आणि केवायसी (KYC) कागदपत्रांची प्रत जोडली आहे.

कळावे,

आपला विश्वासू,
${name}
मोबाईल: ${mobile}`,

      gu: `પ્રતિ,
શાખા મેનેજર શ્રી,
${bank},
${oldBr}

તારીખ: ${date}

વિષય: બેંક ખાતું (${acc}) ${newBr} શાખામાં ટ્રાન્સફર કરવા બાબત.

માનનીય સાહેબ/મેડમ,

સવિનય જણાવવાનું કે મારું આપની શાખામાં બચત/ચાલુ ખાતું છે, જેનો ખાતા નંબર ${acc} છે. ${reason} ના કારણે હું નવા સ્થળે શિફ્ટ થયો છું, જેથી મને હાલની શાખામાંથી વ્યવહાર કરવામાં મુશ્કેલી પડે છે.

આથી નમ્ર વિનંતી છે કે મારું બેંક ખાતું આપની ${newBr} શાખામાં (બ્રાન્ચ કોડ: ${code}) ટ્રાન્સફર કરવાની કૃપા કરશો. અરજી સાથે પાસબુક અને KYC દસ્તાવેજની નકલ સામેલ છે.

આભાર સહ,

આપનો વિશ્વાસુ,
${name}
મોબાઈલ: ${mobile}`,

      bn: `প্রতি,
শাখা ব্যবস্থাপক,
${bank},
${oldBr}

তারিখ: ${date}

বিষয়: ব্যাংক অ্যাকাউন্ট (${acc}) ${newBr} শাখায় স্থানান্তরের (Transfer) জন্য আবেদন।

মহাশয়/মহাশয়া,

বিনীত নিবেদন এই যে, আপনার শাখায় আমার একটি সেভিংস/কারেন্ট অ্যাকাউন্ট রয়েছে, যার নম্বর ${acc}। ${reason}-এর কারণে আমি নতুন জায়গায় স্থানান্তরিত হয়েছি, তাই বর্তমান শাখা থেকে লেনদেন করা আমার পক্ষে অসুবিধাজনক হচ্ছে।

অতএব, অনুগ্রহ করে আমার অ্যাকাউন্টটি আপনার ${newBr} শাখায় (ব্রাঞ্চ কোড: ${code}) স্থানান্তর করার ব্যবস্থা করুন। আবেদনের সাথে পাসবুক ও কেওয়াইসি (KYC) নথির প্রতিলিপি সংযুক্ত করা হলো।

ধন্যবাদান্তে,

বিনীত,
${name}
মোবাইল: ${mobile}`,

      ta: `அனுப்புநர் / பெறுநர்,
கிளை மேலாளர் அவர்கள்,
${bank},
${oldBr}

தேதி: ${date}

பொருள்: வங்கிக் கணக்கை (${acc}) ${newBr} கிளைக்கு மாற்றுதல் தொடர்பாக.

மதிப்பிற்குரிய ஐயா/அம்மா,

தங்கள் கிளையில் எனது வங்கிக் கணக்கு (எண்: ${acc}) உள்ளது. ${reason} காரணமாக நான் புதிய இடத்திற்கு குடிபெயர்ந்துள்ளேன். இதனால் தற்போதைய கிளையில் வங்கிப் பரிவர்த்தனைகளை மேற்கொள்வது சிரமமாக உள்ளது.

எனவே, எனது வங்கிக் கணக்கை தங்களின் ${newBr} கிளைக்கு (கிளை குறியீடு: ${code}) மாற்றித் தருமாறு தாழ்மையுடன் கேட்டுக்கொள்கிறேன். இத்துடன் பாஸ்புக் மற்றும் KYC ஆவணங்களின் நகல் இணைக்கப்பட்டுள்ளது.

நன்றி,

தங்கள் உண்மையுள்ள,
${name}
தொலைபேசி: ${mobile}`,

      te: `గౌరవనీయులైన బ్రాంచ్ మేనేజర్ గారికి,
${bank},
${oldBr}

తేదీ: ${date}

విషయం: నా బ్యాంక్ ఖాతాను (${acc}) ${newBr} బ్రాంచ్‌కు బదిలీ (Transfer) చేయమని అభ్యర్థన.

అయ్యా/అమ్మా,

మీ బ్రాంచ్‌లో నాకు ${acc} నంబర్ గల బ్యాంక్ ఖాతా ఉంది. ${reason} కారణంగా నేను కొత్త ప్రాంతానికి మారాను, కాబట్టి ప్రస్తుత బ్రాంచ్ నుండి లావాదేవీలు నిర్వహించడం నాకు కష్టంగా ఉంది.

దయచేసి నా బ్యాంక్ ఖాతాను మీ ${newBr} బ్రాంచ్‌కు (బ్రాంచ్ కోడ్: ${code}) బదిలీ చేయవలసిందిగా కోరుచున్నాను. దరఖాస్తుతో పాటు నా పాస్‌బుక్ మరియు KYC పత్రాల నకలును జతపరిచాను.

ధన్యవాదాలు,

ఇట్లు,
${name}
మొబైల్: ${mobile}`,

      kn: `ಗೆ,
ಶಾಖಾ ವ್ಯವಸ್ಥಾಪಕರು,
${bank},
${oldBr}

ದಿನಾಂಕ: ${date}

ವಿಷಯ: ಬ್ಯಾಂಕ್ ಖಾತೆಯನ್ನು (${acc}) ${newBr} ಶಾಖೆಗೆ ವರ್ಗಾಯಿಸಲು (Transfer) ವಿನಂತಿ.

ಮಾನ್ಯರೇ,

ನಿಮ್ಮ ಶಾಖೆಯಲ್ಲಿ ನಾನು ${acc} ಸಂಖ್ಯೆಯ ಉಳಿತಾಯ/ಚಾಲ್ತಿ ಖಾತೆಯನ್ನು ಹೊಂದಿದ್ದೇನೆ. ${reason} ಕಾರಣದಿಂದಾಗಿ ನಾನು ಹೊಸ ಸ್ಥಳಕ್ಕೆ ಸ್ಥಳಾಂತರಗೊಂಡಿದ್ದೇನೆ, ಆದ್ದರಿಂದ ಪ್ರಸ್ತುತ ಶಾಖೆಯಿಂದ ವ್ಯವಹರಿಸಲು ನನಗೆ ತೊಂದರೆಯಾಗುತ್ತಿದೆ.

ದಯವಿಟ್ಟು ನನ್ನ ಬ್ಯಾಂಕ್ ಖಾತೆಯನ್ನು ನಿಮ್ಮ ${newBr} ಶಾಖೆಗೆ (ಶಾಖೆ ಕೋಡ್: ${code}) ವರ್ಗಾಯಿಸಬೇಕೆಂದು ವಿನಂತಿಸುತ್ತೇನೆ. ಪಾಸ್‌ಬುಕ್ ಮತ್ತು KYC ದಾಖಲೆಗಳ ಪ್ರತಿಯನ್ನು ಲಗತ್ತಿಸಲಾಗಿದೆ.

ಧನ್ಯವಾದಗಳು,

ತಮ್ಮ ವಿಶ್ವಾಸಿ,
${name}
ಮೊಬೈಲ್: ${mobile}`,

      ml: `സ്വീകർത്താവ്,
ബ്രാഞ്ച് മാനേജർ,
${bank},
${oldBr}

തീയതി: ${date}

വിഷയം: ബാങ്ക് അക്കൗണ്ട് (${acc}) ${newBr} ശാഖയിലേക്ക് മാറ്റുന്നതിനുള്ള അപേക്ഷ.

സർ/മാഡം,

നിങ്ങളുടെ ശാഖയിൽ എനിക്ക് ${acc} എന്ന നമ്പറിൽ ഒരു ബാങ്ക് അക്കൗണ്ട് ഉണ്ട്. ${reason} കാരണം ഞാൻ പുതിയ സ്ഥലത്തേക്ക് താമസം മാറിയതിനാൽ നിലവിലെ ശാഖയിൽ നിന്ന് ഇടപാടുകൾ നടത്താൻ ബുദ്ധിമുട്ടുണ്ട്.

ആയതിനാൽ എന്റെ ബാങ്ക് അക്കൗണ്ട് നിങ്ങളുടെ ${newBr} ശാഖയിലേക്ക് (ബ്രാഞ്ച് കോഡ്: ${code}) മാറ്റിത്തരണമെന്ന് വിനീതമായി അപേക്ഷിക്കുന്നു. പാസ്ബുക്കിന്റെയും KYC രേഖകളുടെയും പകർപ്പ് ഇതോടൊപ്പം ചേർക്കുന്നു.

നന്ദി,

വിശ്വസ്തതയോടെ,
${name}
മൊബൈൽ: ${mobile}`,

      pa: `ਸੇਵਾ ਵਿਖੇ,
ਬ੍ਰਾਂਚ ਮੈਨੇਜਰ ਸਾਹਿਬ,
${bank},
${oldBr}

ਮਿਤੀ: ${date}

ਵਿਸ਼ਾ: ਬੈਂਕ ਖਾਤਾ (${acc}) ${newBr} ਬ੍ਰਾਂਚ ਵਿੱਚ ਟ੍ਰਾਂਸਫਰ ਕਰਨ ਬਾਰੇ ਬੇਨਤੀ।

ਸ਼੍ਰੀਮਾਨ ਜੀ,

ਬੇਨਤੀ ਹੈ ਕਿ ਮੇਰਾ ਤੁਹਾਡੀ ਬ੍ਰਾਂਚ ਵਿੱਚ ਬਚਤ/ਚਾਲੂ ਖਾਤਾ ਹੈ, ਜਿਸਦਾ ਨੰਬਰ ${acc} ਹੈ। ${reason} ਕਾਰਨ ਮੈਂ ਨਵੀਂ ਜਗ੍ਹਾ ਸ਼ਿਫਟ ਹੋ ਗਿਆ ਹਾਂ, ਜਿਸ ਕਰਕੇ ਮੈਨੂੰ ਮੌਜੂਦਾ ਬ੍ਰਾਂਚ ਤੋਂ ਲੈਣ-ਦੇਣ ਕਰਨ ਵਿੱਚ ਮੁਸ਼ਕਲ ਆ ਰਹੀ ਹੈ।

ਕਿਰਪਾ ਕਰਕੇ ਮੇਰਾ ਇਹ ਖਾਤਾ ਤੁਹਾਡੀ ${newBr} ਬ੍ਰਾਂਚ (ਬ੍ਰਾਂਚ ਕੋਡ: ${code}) ਵਿੱਚ ਟ੍ਰਾਂਸਫਰ ਕਰਨ ਦੀ ਕ੍ਰਿਪਾਲਤਾ ਕੀਤੀ ਜਾਵੇ। ਨਾਲ ਪਾਸਬੁੱਕ ਅਤੇ KYC ਦਸਤਾਵੇਜ਼ਾਂ ਦੀ ਕਾਪੀ ਨੱਥੀ ਹੈ।

ਧੰਨਵਾਦ ਸਹਿਤ,

ਆਪ ਜੀ ਦਾ ਵਿਸ਼ਵਾਸਪਾਤਰ,
${name}
ਮੋਬਾਈਲ: ${mobile}`,

      or: `ମାନ୍ୟବର ଶାଖା ପରିଚାଳକ,
${bank},
${oldBr}

ତାରିଖ: ${date}

ବିଷୟ: ବ୍ୟାଙ୍କ ଆକାଉଣ୍ଟ (${acc}) କୁ ${newBr} ଶାଖାକୁ ସ୍ଥାନାନ୍ତର (Transfer) କରିବା ପାଇଁ ଆବେଦନ।

ମହାଶୟ/ମହାଶୟା,

ବିନୀତ ନିବେଦନ ଏହି କି ଯେ, ଆପଣଙ୍କ ଶାଖାରେ ମୋର ଏକ ବ୍ୟାଙ୍କ ଆକାଉଣ୍ଟ ଅଛି, ଯାହାର ନମ୍ବର ${acc} ଅଟେ। ${reason} କାରଣରୁ ମୁଁ ନୂତନ ସ୍ଥାନକୁ ସ୍ଥାନାନ୍ତରିତ ହୋଇଛି, ତେଣୁ ବର୍ତ୍ତମାନର ଶାଖାରୁ କାରବାର କରିବା ମୋ ପାଇଁ ଅସୁବିଧାଜନକ ହେଉଛି।

ଅତଏବ ଦୟାକରି ମୋର ଆକାଉଣ୍ଟକୁ ଆପଣଙ୍କ ${newBr} ଶାଖାକୁ (ବ୍ରାଞ୍ଚ କୋଡ୍: ${code}) ସ୍ଥାନାନ୍ତର କରିବାକୁ ଅନୁରୋଧ କରୁଛି। ଆବେଦନ ସହିତ ପାସବୁକ୍ ଏବଂ KYC ନକଲ ସଂଲଗ୍ନ କରାଯାଇଛି।

ଧନ୍ୟବାଦ,

ଆପଣଙ୍କର ବିଶ୍ୱସ୍ତ,
${name}
ମୋବାଇଲ୍: ${mobile}`,

      ur: `بخدمت جناب برانچ منیجر صاحب،
${bank}،
${oldBr}

تاریخ: ${date}

موضوع: بینک اکاؤنٹ (${acc}) کو ${newBr} برانچ میں منتقل (Transfer) کرنے کی درخواست۔

جناب عالی،

گزارش ہے کہ میرا آپ کی برانچ میں ایک سیونگ/کرنٹ اکاؤنٹ ہے جس کا نمبر ${acc} ہے۔ ${reason} کی وجہ سے میں نئی جگہ منتقل ہو گیا ہوں، جس کی وجہ سے مجھے موجودہ برانچ سے لین دین کرنے میں دشواری ہو رہی ہے۔

براہ کرم میرا بینک اکاؤنٹ آپ کی ${newBr} برانچ (برانچ کوڈ: ${code}) میں منتقل کرنے کی زحمت فرمائیں۔ درخواست کے ساتھ پاس بک اور KYC دستاویزات کی کاپی منسلک ہے۔

شکریہ،

آپ کا مخلص،
${name}
موبائل: ${mobile}`
    };

    preview.textContent = templates[lang];
  }

  function copyText() {
    const text = document.getElementById('letterPreview').textContent;
    navigator.clipboard.writeText(text).then(() => {
      alert('Letter copied to clipboard!');
    });
  }

  updateLetter();
</script>
