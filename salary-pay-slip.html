  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  color: var(--ink);
  background: #f8fafc;
  transition: border-color .18s, box-shadow .18s, background .18s;
  min-width: 0;
}

@media (prefers-color-scheme: dark) {
  .field-input, .field-select {
    background: #0f1a2c;
  }
}

.field-input:focus, .field-select:focus {
  border-color: var(--primary);
  background: var(--card);
  box-shadow: 0 0 0 3px rgba(2,132,199,.16);
}

.rupee-wrap {
  position: relative;
}

.rupee-wrap .field-input {
  padding-left: 30px;
}

.rupee-wrap::before {
  content: '₹';
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  font-weight: 800;
  color: var(--faint);
  z-index: 1;
}

/* ---- A4 slip: exactly 210mm x 297mm at 96dpi ---- */

#a4DocSheet {
  width: 794px;
  min-height: 1122px;
  padding: 32px;
  box-sizing: border-box;
  overflow: visible;
  background: #ffffff !important;
  color: #0f172a !important;
  border: 1.5px solid #cbd5e1;
  box-shadow: 0 14px 34px rgba(15,23,42,.10);
  border-radius: 8px;
  flex: none;
}

#a4DocSheet table {
  table-layout: fixed;
  width: 100%;
  border-collapse: collapse;
}

#a4DocSheet td, #a4DocSheet th, #a4DocSheet p, #a4DocSheet div {
  word-break: break-word;
  overflow-wrap: anywhere;
}

#a4DocSheet .slip-border {
  border: 1.5px solid #0f172a;
  padding: 18px;
  border-radius: 6px;
}

.slip-emp td {
  padding: 5px 6px;
  border: 1px solid #cbd5e1;
  font-size: 11.5px;
}

.slip-emp td.lbl {
  background: #f8fafc;
  font-weight: 700;
  color: #334155;
}

.slip-emp td.val {
  font-weight: 600;
  color: #0f172a;
}

.slip-matrix th {
  background: #0f172a;
  color: #fff;
  padding: 7px 8px;
  text-align: left;
  font-weight: 700;
  border: 1px solid #0f172a;
  font-size: 11.5px;
}

.slip-matrix td {
  padding: 6px 8px;
  border: 1px solid #cbd5e1;
  font-weight: 600;
  font-size: 11.5px;
}

.t-right {
  text-align: right !important;
}

/* pdf-mode: hide chrome, expand the original slip to full width */

.pdf-mode .hide-in-pdf {
  display: none !important;
}

.pdf-mode .preview-col {
  width: 100% !important;
  max-width: none !important;
}

.pdf-mode #a4DocSheet {
  box-shadow: none;
  border-radius: 0;
  margin: 0 auto;
}

@media print {
  @page {
    size: A4;

    margin: 0;
  }

  html, body {
    background: #fff !important;
  }

  .no-print {
    display: none !important;
  }

  .app-shell {
    padding-top: 0 !important;
    min-height: 0 !important;
    background: #fff !important;
  }

  .main-grid {
    display: block !important;
    padding: 0 !important;
    gap: 0 !important;
  }

  .form-col {
    display: none !important;
  }

  .preview-col {
    display: block !important;
    width: 100% !important;
    max-width: none !important;
  }

  .preview-scale-wrap {
    height: auto !important;
    overflow: visible !important;
  }

  .preview-scale-inner {
    transform: none !important;
    height: auto !important;
  }

  #a4DocSheet {
    width: 210mm !important;
    height: 297mm !important;
    min-height: 297mm !important;
    box-shadow: none !important;
    border: none !important;
    border-radius: 0 !important;
    margin: 0 !important;
    padding: 32px !important;
  }
}

.hover\:opacity-95:hover{
  opacity: 0.95;
}

.disabled\:opacity-50:disabled{
  opacity: 0.5;
}

.dark\:bg-slate-800\/40:is(.dark *){
  background-color: rgb(30 41 59 / 0.4);
}

.dark\:bg-slate-800\/50:is(.dark *){
  background-color: rgb(30 41 59 / 0.5);
}

.dark\:bg-slate-900:is(.dark *){
  --tw-bg-opacity: 1;
  background-color: rgb(15 23 42 / var(--tw-bg-opacity, 1));
}

.dark\:text-slate-200:is(.dark *){
  --tw-text-opacity: 1;
  color: rgb(226 232 240 / var(--tw-text-opacity, 1));
}

.dark\:ring-slate-700:is(.dark *){
  --tw-ring-opacity: 1;
  --tw-ring-color: rgb(51 65 85 / var(--tw-ring-opacity, 1));
}

@media (min-width: 640px){
  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:block{
    display: block;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}

@media (min-width: 1024px){
  .lg\:sticky{
    position: sticky;
  }

  .lg\:grid-cols-\[1\.1fr_0\.9fr\]{
    grid-template-columns: 1.1fr 0.9fr;
  }
}
