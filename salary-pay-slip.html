* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: clip;
}

body {
  background: var(--surface);
  color: var(--ink);
  font-family: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

.font-display {
  font-family: 'Fraunces', Georgia, serif;
}

/* Stacked single-column layout */

.kb-wrapper {
  display: block;
  max-width: 980px;
  margin: 0 auto;
  padding: 12px;
}

.control-box {
  padding: 14px;
}

.section-badge {
  margin: 10px 0 8px;
}

.step-pill {
  padding: 6px;
}

.summary-card {
  padding: 10px;
}

.field-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
  line-height: 1.35;
}

.field-label span {
  display: block;
  text-transform: none;
  letter-spacing: 0;
  font-weight: 600;
  color: var(--faint);
  font-size: 11px;
}

.field-input, .field-select {
  width: 100%;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  outline: none;
  color: var(--ink);
  background: #f8fafc;
  transition: border-color .18s, box-shadow .18s, background .18s;
  min-width: 0;
}

@media (prefers-color-scheme: dark) {
  .field-input, .field-select {
    background: #0f1a2c;
  }
}

.field-input:focus, .field-select:focus {
  border-color: var(--primary);
  background: var(--card);
  box-shadow: 0 0 0 3px rgba(2,132,199,.16);
}

.rupee-wrap {
  position: relative;
}

.rupee-wrap .field-input {
  padding-left: 30px;
}

.rupee-wrap::before {
  content: '₹';
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  font-weight: 800;
  color: var(--faint);
  z-index: 1;
}

/* Preview: below form, full width, centered, never clipped */

.preview-col {
  width: 100%;
  margin-top: 16px;
}

.preview-panel {
  width: 100%;
  max-width: 760px;
  margin: 16px auto 0;
  overflow: visible;
}

#a4DocSheet {
  width: 100%;
  max-width: 760px;
  min-height: 0;
  padding: 24px;
  box-sizing: border-box;
  overflow: visible;
  background: #ffffff !important;
  color: #0f172a !important;
  border: 1.5px solid #cbd5e1;
  box-shadow: 0 14px 34px rgba(15,23,42,.10);
  border-radius: 8px;
  flex: none;
  margin: 0 auto;
}

#a4DocSheet table {
  table-layout: fixed;
  width: 100%;
  border-collapse: collapse;
}

#a4DocSheet td, #a4DocSheet th, #a4DocSheet p, #a4DocSheet div {
  word-break: break-word;
  overflow-wrap: anywhere;
}

#a4DocSheet .slip-border {
  border: 1.5px solid #0f172a;
  padding: 18px;
  border-radius: 6px;
}

.slip-emp td {
  padding: 5px 6px;
  border: 1px solid #cbd5e1;
  font-size: 11.5px;
}

.slip-emp td.lbl {
  background: #f8fafc;
  font-weight: 700;
  color: #334155;
}

.slip-emp td.val {
  font-weight: 600;
  color: #0f172a;
}

.slip-matrix th {
  background: #0f172a;
  color: #fff;
  padding: 7px 8px;
  text-align: left;
  font-weight: 700;
  border: 1px solid #0f172a;
  font-size: 11.5px;
}

.slip-matrix td {
  padding: 6px 8px;
  border: 1px solid #cbd5e1;
  font-weight: 600;
  font-size: 11.5px;
}

.t-right {
  text-align: right !important;
}

/* pdf-mode: hide chrome, show only the slip */

.pdf-mode .hide-in-pdf {
  display: none !important;
}

.pdf-mode .form-col {
  display: none !important;
}

.pdf-mode .preview-col {
  width: 100% !important;
  max-width: none !important;
  margin-top: 0 !important;
}

.pdf-mode #a4DocSheet {
  box-shadow: none;
  border-radius: 0;
  margin: 0 auto;
}

@media print {
  @page {
    size: A4;

    margin: 0;
  }

  html, body {
    background: #fff !important;
  }

  .no-print {
    display: none !important;
  }

  .app-shell {
    padding-top: 0 !important;
    min-height: 0 !important;
    background: #fff !important;
  }

  .kb-wrapper {
    display: block !important;
    padding: 0 !important;
    gap: 0 !important;
    max-width: none !important;
  }

  .form-col {
    display: none !important;
  }

  .preview-col {
    display: block !important;
    width: 100% !important;
    max-width: none !important;
    margin-top: 0 !important;
  }

  .preview-panel {
    max-width: none !important;
    margin: 0 !important;
  }

  #a4DocSheet {
    width: 210mm !important;
    max-width: none !important;
    height: 297mm !important;
    min-height: 297mm !important;
    box-shadow: none !important;
    border: none !important;
    border-radius: 0 !important;
    margin: 0 !important;
    padding: 32px !important;
  }
}

.hover\:opacity-95:hover{
  opacity: 0.95;
}

.disabled\:opacity-50:disabled{
  opacity: 0.5;
}

.dark\:bg-slate-800\/40:is(.dark *){
  background-color: rgb(30 41 59 / 0.4);
}

.dark\:bg-slate-800\/50:is(.dark *){
  background-color: rgb(30 41 59 / 0.5);
}

.dark\:bg-slate-900:is(.dark *){
  --tw-bg-opacity: 1;
  background-color: rgb(15 23 42 / var(--tw-bg-opacity, 1));
}

.dark\:text-slate-200:is(.dark *){
  --tw-text-opacity: 1;
  color: rgb(226 232 240 / var(--tw-text-opacity, 1));
}

.dark\:ring-slate-700:is(.dark *){
  --tw-ring-opacity: 1;
  --tw-ring-color: rgb(51 65 85 / var(--tw-ring-opacity, 1));
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }
}
