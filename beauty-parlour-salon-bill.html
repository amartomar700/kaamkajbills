<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beauty Studio Billing – KaamKaj Bills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--rose:#be3a6b;--rose-d:#8f2750;--blush:#fbe4ec;--bg:#fdf6f8;--ink:#1f2a44;--gold:#b76e79;--ok:#2f855a;--bad:#c0392b;--line:#ecd3db}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.top a{color:var(--rose-d);text-decoration:none;font-weight:600;border:1px solid var(--line);padding:6px 12px;border-radius:8px}
.top h1{margin:0;font:700 19px Georgia,serif;color:var(--rose-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{display:block;color:#6b7390;font:500 12px system-ui}
.top .sp{flex:1}.top .dt{font-size:12.5px;color:#6b7390;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 20px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 2px 8px #be3a6b0f}
.stat span{font-size:12px;color:#6b7390}.stat b{display:block;font:700 18px Georgia,serif;color:var(--rose-d)}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:20px;padding:14px 20px 30px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px #be3a6b12;padding:6px 16px 16px}
details{border-bottom:1px solid var(--line);padding:4px 0}details:last-of-type{border:0}
summary{cursor:pointer;padding:10px 0;font:700 15px Georgia,serif;color:var(--rose-d);list-style:none}
summary::before{content:"▸";display:inline-block;width:18px;color:var(--gold)}details[open]>summary::before{content:"▾"}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding-bottom:10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}.fld span{font-size:12px;font-weight:600;color:#6b4a58}
.fld.w,.g .w{grid-column:1/-1}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #dcc3cd;border-radius:10px;background:#fffbfc;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--rose);background:#fff}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}.chk input{width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--blush);padding:5px;border-radius:12px;margin:12px 0 4px}
.seg button{border:0;background:none;padding:11px 8px;border-radius:9px;font-weight:700;color:var(--rose-d);cursor:pointer}
.seg button.on{background:var(--rose);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;color:var(--rose-d)}
.btn:hover{background:var(--blush)}.btn.p{background:var(--rose);border-color:var(--rose);color:#fff}.btn.p:hover{background:var(--rose-d)}
.btn.k{background:#1f9d57;border-color:#1f9d57;color:#fff}.btn.d{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;max-height:150px;overflow:auto}
.chip{border:1px solid var(--gold);background:#fff;color:var(--rose-d);border-radius:20px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip:hover{background:var(--blush)}
.row{display:grid;grid-template-columns:1fr 64px 92px 96px 34px;gap:6px;align-items:center;margin-bottom:6px}
.row .ra{text-align:right;font-weight:600}.hd{font-size:11.5px;font-weight:700;color:#6b4a58}
.x{border:1px solid #f1b5ad;background:#fdeceb;color:var(--bad);border-radius:8px;height:36px;cursor:pointer}
.acts{position:sticky;bottom:0;background:#fff;padding:12px 0 2px;margin-top:8px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sec{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.pv{position:sticky;top:64px}.pv h2{margin:0 0 8px;font:600 13px system-ui;color:#6b7390;text-align:center}
#pw{overflow:hidden;border-radius:10px;border:1px solid var(--line);box-shadow:0 8px 24px #be3a6b18;background:#fff}
#ps{width:794px;transform-origin:0 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}#pdfHost{display:none}
/* document (A4) */
.doc{width:794px;background:#fff;color:#1f2a44;padding:8mm 14mm;font:12px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.doc *{box-sizing:border-box}
.dh{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--rose);padding-bottom:10px}
.dh .l{display:flex;gap:12px;min-width:0;flex:1}.dh img{max-width:90px;max-height:72px;object-fit:contain;align-self:flex-start}
.doc h1{margin:0;font:700 22px/1.2 Georgia,serif;color:var(--rose-d);overflow-wrap:anywhere}
.doc .sub{color:#5b6580;font-size:11px;overflow-wrap:anywhere}
.badge{background:var(--rose);color:#fff;padding:5px 12px;border-radius:5px;font-weight:700;font-size:11px;align-self:flex-start;text-align:center;max-width:170px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px;margin:12px 0}
.mg div{display:flex;gap:6px;border-bottom:1px dotted #d9b8c4;padding:2px 0;min-width:0}.mg b{min-width:88px;color:#7a4a5b;font-weight:600}.mg span{overflow-wrap:anywhere}
.it{width:100%;border-collapse:collapse;table-layout:fixed}
.it th{background:var(--blush);color:var(--rose-d);padding:7px 6px;text-align:left;border-top:1px solid var(--line);border-bottom:1.5px solid var(--gold);font-size:11px}
.it td{padding:6px;border-bottom:1px solid #f4e3e9;vertical-align:top;overflow-wrap:anywhere}
.it tr{break-inside:avoid;page-break-inside:avoid}.c{text-align:center!important}.r{text-align:right!important}
.sm{display:flex;justify-content:space-between;gap:18px;margin-top:12px;break-inside:avoid}
.pay{flex:1;font-size:11px;color:#5b6580}.pay b{color:var(--ink)}
.tot{width:250px;border-collapse:collapse}.tot td{padding:3px 8px}
.tot .net td{background:var(--rose);color:#fff;font:700 14px Georgia,serif}.tot .bal td{font-weight:700;color:var(--bad)}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:700;font-size:11px;color:#fff}
.nb{border-left:3px solid var(--gold);background:#fff6f8;padding:6px 10px;margin-top:10px;font-size:11px;overflow-wrap:anywhere;break-inside:avoid}
.sg{display:flex;justify-content:space-between;gap:40px;margin-top:38px;break-inside:avoid}
.sg div{flex:1;text-align:center;border-top:1.5px dashed var(--gold);padding-top:4px;font-size:11px;color:#6b4a58}
.ty{text-align:center;margin-top:14px;font:italic 13px Georgia,serif;color:var(--rose-d)}
@media(max-width:1000px){main{grid-template-columns:1fr}.pv{position:static}.stats{grid-template-columns:1fr 1fr}.acts{position:static}}
@media(max-width:600px){.g{grid-template-columns:1fr}.top .dt{display:none}header.top{padding:10px 12px}main,.stats{padding-left:10px;padding-right:10px}
.row{grid-template-columns:1fr 1fr 1fr 34px}.row .d{grid-column:1/-1}.hd.row{display:none}.acts{grid-template-columns:1fr}}
@media print{@page{size:A4 portrait;margin:10mm 0}html,body{background:#fff!important}body>*{display:none!important}
body>#pdfHost{display:block!important}.doc{width:100%!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html" target="_self">← All Tools</a>
  <div style="min-width:0"><h1 id="hName">Beauty Studio</h1><small>Billing &amp; Booking Manager</small></div>
  <span class="sp"></span>
  <span class="dt" id="hDate"></span>
  <span class="dt"><i class="dot"></i><span id="st">Ready</span></span>
</header>
<div class="stats">
  <div class="stat"><span>Net payable</span><b id="sNet">₹0.00</b></div>
  <div class="stat"><span>Advance received</span><b id="sAdv">₹0.00</b></div>
  <div class="stat"><span>Balance due</span><b id="sBal">₹0.00</b></div>
  <div class="stat"><span>Payment status</span><b id="sSt">Pending</b></div>
</div>
<main>
  <section class="panel" id="form"></section>
  <aside class="pv"><h2>Live A4 preview</h2><div id="pw"><div id="ps"></div></div></aside>
</main>
<div id="pdfHost"></div>
<div id="toast" role="status"></div>

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const x of c.flat())if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x));return e};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Browser storage is full or blocked – not saved.');return false}},
 del(k){try{localStorage.removeItem(k)}catch{}}};
const n=x=>{x=parseFloat(x);return isFinite(x)&&x>0?x:0};
const r2=x=>Math.round(x*100)/100;
const inr=x=>'₹'+(+x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const inr0=x=>'₹'+(+x||0).toLocaleString('en-IN');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>{if(!s)return '';const d=new Date(s+'T00:00');return isNaN(d)?s:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}

const DEF={'Facial & Skin Care':[['Gold Facial',1500],['Hydra Facial',2500],['Diamond Facial',2000],['Cleanup',600],['Skin Polishing',1800],['Bleach',500]],
'Hair Services':[['Hair Cut',350],['Hair Spa',900],['Hair Coloring',2200],['Hair Smoothening',4500],['Keratin Treatment',5000],['Blow Dry',400]],
'Waxing & Threading':[['Eyebrow Threading',50],['Upper Lip',30],['Full Face Threading',250],['Full Arms Waxing',400],['Full Legs Waxing',600],['Full Body Waxing',2200]],
'Nail & Hand Care':[['Manicure',500],['Pedicure',700],['Nail Art',600],['Nail Extensions',1800]],
'Makeup Services':[['Bridal Makeup',15000],['HD Makeup',5000],['Airbrush Makeup',8000],['Engagement Makeup',7000],['Party Makeup',2500],['Reception Makeup',9000],['Hairstyling',1200]]};
const DT='Advance is non-refundable on cancellation. Please arrive 10 minutes before your slot. Services once availed cannot be refunded.';
const DTH='Thank you for choosing us – we look forward to seeing you again!';
const BIZ=['bizName','owner','addr','city','phone','wa','email'];
const PROF=[...BIZ,'terms','thanks','gstPct','payMode'];
let mode='BILL',items=[blank()],logo='',cat=store.get('bs_cat',null)||JSON.parse(JSON.stringify(DEF)),rm=false,F={},amt=[];
function blank(){return{d:'',q:1,r:0}}
const v=k=>{const e=F[k];return e?(e.type==='checkbox'?e.checked:e.value.trim()):''};
const set=(k,x)=>{const e=F[k];if(!e)return;if(e.type==='checkbox')e.checked=!!x;else e.value=x??''};

/* ---------- calculation (pure) ---------- */
function calc(){
 const sub=r2(items.reduce((s,i)=>s+n(i.q)*n(i.r),0));
 const disc=Math.min(n(v('discount')),sub),extra=n(v('extra'));
 const tax=v('gstOn')?r2((sub-disc+extra)*n(v('gstPct'))/100):0;
 const net=r2(sub-disc+extra+tax),adv=Math.min(n(v('advance')),net),bal=Math.max(0,r2(net-adv));
 const st=net>0&&bal===0?'Paid':adv>0?'Partially Paid':'Pending';
 return{sub,disc,extra,tax,net,adv,bal,st};
}
const stCol=s=>s==='Paid'?'#2f855a':s==='Partially Paid'?'#c98a1b':'#c0392b';
const title=()=>mode==='BILL'?'Service Bill & Payment Receipt':'Bridal / Party Makeup Booking Slip';
const live=()=>items.filter(i=>i.d.trim()||n(i.r));

/* ---------- document number ---------- */
function nextNo(){const p=mode==='BILL'?'BTY':'BRD',c=store.get('bs_cnt',{});c[p]=(c[p]||0)+1;store.set('bs_cnt',c);
 return p+'-'+today().slice(2).replace(/-/g,'')+'-'+String(c[p]).padStart(3,'0')}

/* ---------- A4 document ---------- */
function buildDoc(){
 const c=calc(),pairs=[['No.',v('docNo')],['Date',fd(v('docDate'))],
  ['Appointment',[fd(v('apDate')),v('apTime')].filter(Boolean).join(' · ')],['Client',v('cName')],['Mobile',v('cPhone')],['Email',v('cEmail')],['Artist / staff',v('staff')]];
 if(mode==='BOOK')pairs.push(['Event',v('evType')],['Venue',v('venue')],['Wedding date',fd(v('wedDate'))],['Event date',fd(v('evDate'))],['Category',v('mkCat')],['Slot',v('slot')],['Persons',v('persons')]);
 const contact=[v('phone')&&'Ph: '+v('phone'),v('wa')&&'WA: '+v('wa'),v('email')].filter(Boolean).join('  |  ');
 const rows=live();
 const body=rows.length?rows.map((it,i)=>h('tr',{},h('td',{class:'c'},i+1),h('td',{},it.d||'-'),h('td',{class:'c'},n(it.q)),h('td',{class:'r'},inr(it.r)),h('td',{class:'r'},inr(n(it.q)*n(it.r))))):[h('tr',{},h('td',{colspan:5,class:'c'},'No services added'))];
 const T=(a,b,cl)=>h('tr',{class:cl||''},h('td',{},a),h('td',{class:'r'},b));
 const tot=[T('Subtotal',inr(c.sub))];
 if(c.disc)tot.push(T('Discount','-'+inr(c.disc)));if(c.extra)tot.push(T('Additional charges',inr(c.extra)));
 if(c.tax)tot.push(T('GST ('+n(v('gstPct'))+'%)',inr(c.tax)));
 tot.push(T('Net payable',inr(c.net),'net'),T('Advance received','-'+inr(c.adv)),T('Balance due',inr(c.bal),'bal'));
 const pay=[['Payment mode',v('payMode')],['Reference',v('payRef')],['Transaction ID',v('txn')],['Payment date',fd(v('payDate'))]].filter(x=>x[1]).map(x=>h('div',{},x[0]+': ',h('b',{},x[1])));
 return h('div',{class:'doc',style:'width:794px'},
  h('div',{class:'dh'},h('div',{class:'l'},logo&&h('img',{src:logo,alt:'Logo'}),h('div',{style:'min-width:0'},h('h1',{},v('bizName')||'Beauty Studio'),
   v('owner')&&h('div',{class:'sub'},v('owner')),(v('addr')||v('city'))&&h('div',{class:'sub'},[v('addr'),v('city')].filter(Boolean).join(', ')),contact&&h('div',{class:'sub'},contact))),
   h('div',{class:'badge'},title())),
  h('div',{class:'mg'},pairs.filter(p=>p[1]).map(p=>h('div',{},h('b',{},p[0]),h('span',{},p[1])))),
  h('table',{class:'it'},h('colgroup',{},h('col',{style:'width:6%'}),h('col',{style:'width:44%'}),h('col',{style:'width:12%'}),h('col',{style:'width:16%'}),h('col',{style:'width:22%'})),
   h('thead',{},h('tr',{},h('th',{class:'c'},'#'),h('th',{},'Service description'),h('th',{class:'c'},mode==='BILL'?'Qty':'Persons'),h('th',{class:'r'},'Rate'),h('th',{class:'r'},'Amount'))),h('tbody',{},body)),
  h('div',{class:'sm'},h('div',{class:'pay'},pay,h('div',{style:'margin-top:6px'},h('span',{class:'pill',style:'background:'+stCol(c.st)},c.st))),h('table',{class:'tot'},tot)),
  mode==='BOOK'&&v('special')&&h('div',{class:'nb'},h('b',{},'Special requirements: '),v('special')),
  h('div',{class:'nb'},h('b',{},'Terms & conditions: '),v('terms')||DT),
  h('div',{class:'sg'},h('div',{},'Client signature'),h('div',{},'Authorised signature'+(v('bizName')?' – '+v('bizName'):''))),
  h('div',{class:'ty'},v('thanks')||DTH));
}

/* ---------- rendering ---------- */
let raf;function update(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
 const c=calc();$('#sNet').textContent=inr(c.net);$('#sAdv').textContent=inr(c.adv);$('#sBal').textContent=inr(c.bal);
 const s=$('#sSt');s.textContent=c.st;s.style.color=stCol(c.st);$('#hName').textContent=v('bizName')||'Beauty Studio';
 $('#ps').replaceChildren(buildDoc());fit()});sched()}
function fit(){const w=$('#pw').clientWidth,s=Math.min(1,w/794),p=$('#ps');p.style.transform='scale('+s+')';$('#pw').style.height=p.offsetHeight*s+'px'}
window.addEventListener('resize',fit);

/* ---------- storage ---------- */
let st;function sched(){clearTimeout(st);st=setTimeout(()=>{saveProfile();saveDraft(true)},900)}
function saveProfile(){const o={logo};PROF.forEach(k=>o[k]=v(k));store.set('bs_prof',o)}
function snap(){const f={};Object.keys(F).forEach(k=>{if(!BIZ.includes(k))f[k]=v(k)});return{mode,items,f}}
function saveDraft(auto){if(store.set('bs_draft',snap())){$('#st').textContent=(auto?'Autosaved ':'Draft saved ')+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});if(!auto)toast('Draft saved on this device')}}
function apply(s,keepNo){setMode(s.mode||'BILL',true);items=(s.items&&s.items.length?s.items:[blank()]).map(i=>({d:String(i.d||''),q:n(i.q),r:n(i.r)}));
 Object.keys(s.f||{}).forEach(k=>{if(!(keepNo===false&&k==='docNo'))set(k,s.f[k])});renderRows();update()}
function loadDraft(){const d=store.get('bs_draft',null);if(!d)return toast('No saved draft found');apply(d);toast('Draft restored')}
function fresh(m){const keep=BIZ.concat(['terms','thanks','gstPct','payMode']).reduce((o,k)=>(o[k]=v(k),o),{});
 Object.keys(F).forEach(k=>{if(!PROF.includes(k))set(k,F[k].type==='number'?'':'')});
 set('docDate',today());set('payDate',today());set('persons','1');set('mkCat','Bridal');items=[blank()];setMode(m||mode);renderRows();update()}
function finalize(){store.set('bs_last',snap())}
function dupLast(){const l=store.get('bs_last',null);if(!l)return toast('No previous bill yet – download or print one first');
 apply(l);set('docNo',nextNo());set('docDate',today());set('payDate',today());set('advance','');update();toast('Previous bill duplicated with a new number')}
function clearAll(){if(!confirm('Delete ALL saved data on this device (business profile, logo, services, drafts, counters)? This cannot be undone.'))return;
 ['bs_prof','bs_draft','bs_cat','bs_cnt','bs_last'].forEach(store.del);cat=JSON.parse(JSON.stringify(DEF));logo='';
 BIZ.concat(['terms','thanks']).forEach(k=>set(k,''));set('terms',DT);set('thanks',DTH);set('gstPct','18');fresh('BILL');renderCatSel();renderChips();toast('All saved data cleared')}

/* ---------- logo ---------- */
function pickLogo(e){const f=e.target.files[0];e.target.value='';if(!f)return;
 if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast('Logo must be a PNG, JPG or WebP image');
 if(f.size>3*1024*1024)return toast('Logo is larger than 3 MB – please choose a smaller image');
 const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{const s=Math.min(1,400/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);logo=cv.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.88);URL.revokeObjectURL(u);saveProfile();update();toast('Logo added')};
 img.onerror=()=>toast('Could not read that image');img.src=u}

/* ---------- services ---------- */
function addSvc(name,price){if(items.length===1&&!items[0].d&&!items[0].r)items[0]={d:name,q:1,r:price};else items.push({d:name,q:1,r:price});renderRows();update()}
function renderCatSel(){const s=$('#scat'),cur=s.value;s.replaceChildren(h('option',{value:''},'All categories'),Object.keys(cat).map(k=>h('option',{value:k},k)));s.value=cat[cur]?cur:'';
 $('#cl').replaceChildren(Object.keys(cat).map(k=>h('option',{value:k})))}
function renderChips(){const q=$('#sq').value.toLowerCase(),cf=$('#scat').value,box=$('#chips');box.replaceChildren();
 Object.keys(cat).forEach(k=>{if(cf&&cf!==k)return;cat[k].forEach((s,i)=>{if(q&&!s[0].toLowerCase().includes(q))return;
  box.append(h('button',{type:'button',class:'chip',title:k,onclick:()=>{if(rm){cat[k].splice(i,1);if(!cat[k].length)delete cat[k];store.set('bs_cat',cat);renderCatSel();renderChips()}else addSvc(s[0],s[1])}},s[0]+' · '+inr0(s[1]),rm?' ✕':''))})});
 if(!box.children.length)box.append(h('span',{class:'sub'},'No matching services. Add one in "Manage catalogue".'))}
function renderRows(){const b=$('#rows');b.replaceChildren();amt=[];
 items.forEach((it,i)=>{const a=h('div',{class:'ra'},inr(n(it.q)*n(it.r)));amt.push(a);
  const d=h('input',{type:'text',class:'d',placeholder:'Service name','aria-label':'Service',value:it.d,maxlength:200});
  const q=h('input',{type:'number',min:0,step:'any',inputmode:'decimal','aria-label':'Quantity',value:it.q});
  const r=h('input',{type:'number',min:0,step:'any',inputmode:'decimal','aria-label':'Rate',value:it.r||''});
  const re=()=>{a.textContent=inr(n(it.q)*n(it.r));update()};
  d.oninput=()=>{it.d=d.value;update()};q.oninput=()=>{it.q=n(q.value);re()};r.oninput=()=>{it.r=n(r.value);re()};
  q.onchange=()=>{q.value=it.q};r.onchange=()=>{r.value=it.r||''};
  b.append(h('div',{class:'row'},d,q,r,a,h('button',{type:'button',class:'x','aria-label':'Delete service',onclick:()=>{items.splice(i,1);if(!items.length)items.push(blank());renderRows();update()}},'✕')))})}

/* ---------- outputs ---------- */
function setMode(m,silent){mode=m;$('#mB').classList.toggle('on',m==='BILL');$('#mK').classList.toggle('on',m==='BOOK');
 document.querySelectorAll('[data-m]').forEach(e=>e.hidden=e.dataset.m!==(m==='BILL'?'S':'B'));
 if(!silent){set('docNo',nextNo())}update()}
async function pdf(){
 if(!window.html2pdf)return toast('PDF library did not load (needs internet once). Use Print → Save as PDF instead.');
 const host=$('#pdfHost'),doc=buildDoc();host.replaceChildren(doc);toast('Preparing PDF…');
 const fn=(mode==='BILL'?'Beauty_':'Bridal_')+(v('docNo')||'doc').replace(/[^\w-]/g,'')+'.pdf';
 try{await html2pdf().set({margin:[10,0,14,0],filename:fn,image:{type:'jpeg',quality:.95},
  html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:794,scrollX:0,scrollY:0},
  jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['tr','.nb','.sm','.sg']}})
  .from(doc).toPdf().get('pdf').then(p=>{const N=p.internal.getNumberOfPages();for(let i=1;i<=N;i++){p.setPage(i);p.setFontSize(8);p.setTextColor(120);p.text('Page '+i+' of '+N,105,291,{align:'center'})}}).save();
  finalize();toast('PDF downloaded')}catch(e){toast('PDF failed: '+(e&&e.message||'unknown error'))}finally{host.replaceChildren()}}
function prt(){$('#pdfHost').replaceChildren(buildDoc());finalize();setTimeout(()=>window.print(),80)}
window.addEventListener('afterprint',()=>$('#pdfHost').replaceChildren());
function wa(){const c=calc(),L=['*'+(v('bizName')||'Beauty Studio')+'*','*'+title()+'* – '+v('docNo'),'','Hello '+(v('cName')||'there')+','];
 if(v('apDate'))L.push('Appointment: '+fd(v('apDate'))+(v('apTime')?' at '+v('apTime'):''));
 L.push('','*Services*');live().forEach((it,i)=>L.push((i+1)+'. '+(it.d||'Service')+' – '+n(it.q)+' × '+inr(it.r)+' = '+inr(n(it.q)*n(it.r))));
 L.push('','Subtotal: '+inr(c.sub));if(c.disc)L.push('Discount: -'+inr(c.disc));if(c.extra)L.push('Additional charges: '+inr(c.extra));if(c.tax)L.push('GST: '+inr(c.tax));
 L.push('*Total: '+inr(c.net)+'*','Advance received: '+inr(c.adv),'*Balance due: '+inr(c.bal)+'*','Payment status: '+c.st,'',v('thanks')||DTH);
 let p=v('cPhone').replace(/\D/g,'').replace(/^0+/,'');if(p.length===10)p='91'+p;
 finalize();window.open('https://wa.me/'+(p.length>=11?p:'')+'?text='+encodeURIComponent(L.join('\n')),'_blank','noopener');
 toast('WhatsApp opened – review the message, then press Send yourself')}

/* ---------- build form ---------- */
function fld(k,l,t='text',o,m,w){let e;
 if(t==='select')e=h('select',{},o.map(x=>h('option',{value:x},x)));else if(t==='textarea')e=h('textarea',{rows:2,maxlength:600});
 else e=h('input',{type:t,...(t==='number'?{min:0,step:'any',inputmode:'decimal'}:{maxlength:150})});
 e.dataset.k=k;F[k]=e;const x=t==='check'?h('label',{class:'chk'},e,l):h('label',{class:'fld'+(w?' w':'')},h('span',{},l),e);if(m)x.dataset.m=m;return x}
const sec=(t,open,...c)=>h('details',{open},h('summary',{},t),...c);
const grid=(...c)=>h('div',{class:'g'},...c);
function build(){const f=$('#form');
 f.append(h('div',{class:'seg'},h('button',{type:'button',id:'mB',class:'on',onclick:()=>setMode('BILL')},'Service Bill & Receipt'),h('button',{type:'button',id:'mK',onclick:()=>setMode('BOOK')},'Bridal / Party Booking')));
 f.append(sec('Business profile',true,grid(fld('bizName','Parlour / studio name','text',0,0,1),fld('owner','Owner / makeup artist'),fld('city','City'),fld('addr','Full address','text',0,0,1),fld('phone','Contact number','tel'),fld('wa','WhatsApp number','tel'),fld('email','Email','email',0,0,1),
  h('div',{class:'w sec',style:'padding:0'},h('label',{class:'btn'},'Upload logo',h('input',{type:'file',accept:'image/png,image/jpeg,image/webp',hidden:true,onchange:pickLogo})),h('button',{type:'button',class:'btn d',onclick:()=>{logo='';saveProfile();update()}},'Remove logo')))));
 f.append(sec('Client & appointment',true,grid(fld('docNo','Bill / booking no.'),fld('docDate','Document date','date'),fld('apDate','Appointment date','date'),fld('apTime','Appointment time','time'),
  fld('cName','Client name'),fld('cPhone','Client mobile','tel'),fld('cEmail','Client email (optional)','email'),fld('staff','Artist / staff name'),
  fld('evType','Event type','text',0,'B'),fld('persons','Number of persons','number',0,'B'),fld('venue','Event venue / location','text',0,'B',1),fld('wedDate','Wedding date','date',0,'B'),fld('evDate','Event date','date',0,'B'),
  fld('mkCat','Makeup category','select',['Bridal','Engagement','Party','Reception','Photoshoot','Other'],'B'),fld('slot','Booking slot','text',0,'B'),fld('special','Special requirements','textarea',0,'B',1))));
 f.append(sec('Services',true,
  h('div',{class:'g'},h('label',{class:'fld'},h('span',{},'Search services'),h('input',{id:'sq',type:'search',placeholder:'e.g. facial',oninput:renderChips})),h('label',{class:'fld'},h('span',{},'Category'),h('select',{id:'scat',onchange:renderChips}))),
  h('div',{class:'chips',id:'chips'}),
  h('div',{class:'row hd'},h('span',{},'Service'),h('span',{},'Qty'),h('span',{},'Rate ₹'),h('span',{class:'ra'},'Amount'),h('span')),h('div',{id:'rows'}),
  h('button',{type:'button',class:'btn',onclick:()=>{items.push(blank());renderRows();update()}},'+ Add custom service row'),
  h('details',{},h('summary',{},'Manage catalogue'),h('div',{class:'g'},h('label',{class:'fld'},h('span',{},'Service name'),h('input',{id:'cn',maxlength:80})),h('label',{class:'fld'},h('span',{},'Price ₹'),h('input',{id:'cp',type:'number',min:0,step:'any'})),
   h('label',{class:'fld w'},h('span',{},'Category (pick or type a new one)'),h('input',{id:'cc',list:'cl'}),h('datalist',{id:'cl'}))),
   h('div',{class:'sec',style:'padding-top:0'},h('button',{type:'button',class:'btn p',onclick:()=>{const nm=$('#cn').value.trim();if(!nm)return toast('Enter a service name');const c=$('#cc').value.trim()||'Custom';(cat[c]=cat[c]||[]).push([nm,n($('#cp').value)]);store.set('bs_cat',cat);$('#cn').value=$('#cp').value='';renderCatSel();renderChips();toast('Added to catalogue')}},'Add to catalogue'),
    h('button',{type:'button',class:'btn',id:'rmb',onclick:e=>{rm=!rm;e.target.textContent=rm?'Done removing':'Remove services';renderChips()}},'Remove services'),
    h('button',{type:'button',class:'btn d',onclick:()=>{if(confirm('Restore the default service catalogue? Your custom services will be lost.')){cat=JSON.parse(JSON.stringify(DEF));store.set('bs_cat',cat);renderCatSel();renderChips()}}},'Restore defaults')))));
 f.append(sec('Billing & payment',true,grid(fld('discount','Discount ₹','number'),fld('extra','Additional charges ₹','number'),fld('gstOn','Add GST','check'),fld('gstPct','GST %','number'),
  fld('payMode','Payment method','select',['Cash','UPI','PhonePe','Google Pay','Paytm','Debit / Credit Card','Bank Transfer','Other']),fld('advance','Advance / amount received ₹','number'),fld('payRef','Payment reference no.'),fld('txn','Transaction ID (optional)'),fld('payDate','Payment date','date'))));
 f.append(sec('Terms & messages',false,grid(fld('terms','Terms & conditions','textarea',0,0,1),fld('thanks','Thank-you message','textarea',0,0,1))));
 f.append(h('div',{class:'acts'},h('button',{type:'button',class:'btn p',onclick:pdf},'Download A4 PDF'),h('button',{type:'button',class:'btn',onclick:prt},'Print'),h('button',{type:'button',class:'btn k',onclick:wa},'Share on WhatsApp')));
 f.append(h('div',{class:'sec'},h('button',{type:'button',class:'btn',onclick:()=>fresh('BILL')},'New bill'),h('button',{type:'button',class:'btn',onclick:()=>fresh('BOOK')},'New bridal booking'),h('button',{type:'button',class:'btn',onclick:dupLast},'Duplicate last bill'),
  h('button',{type:'button',class:'btn',onclick:()=>saveDraft(false)},'Save draft'),h('button',{type:'button',class:'btn',onclick:loadDraft},'Load draft'),
  h('button',{type:'button',class:'btn d',onclick:()=>{if(confirm('Reset all bill fields? Your business profile stays.'))fresh()}},'Reset form'),h('button',{type:'button',class:'btn d',onclick:clearAll},'Clear all saved data')));
 f.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.k){if(e.target.dataset.k==='gstOn')e.target.dispatchEvent(new Event('change'));update()}});
 f.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;
  if(t.type==='number'){let x=n(t.value);const c=calc();if(k==='discount'&&x>c.sub)x=c.sub;if(k==='advance'&&x>c.net)x=c.net;t.value=x||''}update()});
}

/* ---------- init ---------- */
build();
$('#hDate').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
const pr=store.get('bs_prof',null);
set('terms',DT);set('thanks',DTH);set('gstPct','18');set('docDate',today());set('payDate',today());set('persons','1');
if(pr){PROF.forEach(k=>{if(pr[k]!=null)set(k,pr[k])});logo=typeof pr.logo==='string'?pr.logo:''}
renderCatSel();renderChips();renderRows();setMode('BILL');
if('ResizeObserver' in window)new ResizeObserver(fit).observe($('#pw'));
})();
</script>
