  ta: ['← அனைத்து கருவிகள்','காம்காஜ் பில்ஸ் • பால் மற்றும் மண்டி விவசாயி சீட்டு','மொழி','இங்கே இருந்து முறையை மாற்றலாம்','1. சீட்டு வகையைத் தேர்ந்தெடுக்கவும்:','🌾 மண்டி பயிர் விற்பனை சீட்டு','🥛 பால் சேகரிப்பு சீட்டு','1. மண்டி கமிஷன் / பால் மைய விவரங்கள்','நிறுவனம் / பால் மையத்தின் பெயர்','மண்டி / கிராம முகவரி மற்றும் மொபைல்','2. விவசாயி விவரங்கள்','சீட்டு எண் (தானியங்கி)','தேதி','பால் ஷிப்ட் / கால்நடை','வாகனம் / டிராக்டர் எண் (விருப்பம்)','விவசாயி பெயர்','கிராமம் மற்றும் மொபைல் / WhatsApp','3. பயிர் எடை மற்றும் ஏல விலை','பயிர் / பொருள்','மூட்டைகள்','நிகர எடை (குவிண்டால்)','விலை / குவிண்டால் (₹)','+ பயிர் சேர்க்கவும்','4. மண்டி செலவுகள் / கழிவுகள்','கூலி / எடை கட்டணம் (₹)','கமிஷன் / மண்டி கட்டணம் (₹)','முன்பணம் / போக்குவரத்து கழிவு (₹)','3. பால் அளவு, FAT, SNF மற்றும் விலை','பால் அளவு (லிட்டர்)','FAT (%)','SNF (%)','விலை / லிட்டர் (₹)','கால்நடை தீவனம் / முன்பண கழிவு (₹)','பணம் செலுத்தும் முறை','வங்கி கணக்கு பரிமாற்றம்','ரொக்கப் பணம்','குறிப்புகள் / பணக் குறிப்பு','📥 A4 PDF பதிவிறக்கம்','🖨️ நேரடி அச்சு','📲 WhatsApp சீட்டு','விவசாயி சீட்டு நேரடி முன்னோட்டம்','மண்டி விவசாயி சீட்டு','பால் சேகரிப்பு சீட்டு','சீட்டு எண்:','தேதி:','விவசாயி பெயர்:','கிராமம் / மொபைல்:','வாகன எண்:','பயிர் மொத்த தொகை:','கூலி / எடை:','கமிஷன் / மண்டி கட்டணம்:','முன்பணம் / போக்குவரத்து கழிவு:','விவசாயிக்கு நிகரத் தொகை:','குறிப்பு:','விவசாயி கையொப்பம் / கைரேகை','கணக்காளர் / அங்கீகரிக்கப்பட்ட கையொப்பம்','ஷிப்ட் / கால்நடை:','மொபைல்:','பால் அளவு (லிட்டர்)','FAT (%)','SNF (%)','விலை / லிட்டர்','மொத்த பால் மதிப்பு:','தீவனம் / முன்பண கழிவு:','நிகரத் தொகை','உறுப்பினர் / விவசாயி கையொப்பம்','பால் மைய செயலாளர் / ஆபரேட்டர் கையொப்பம்','குவிண்டால்','லிட்டர்','மண்டி விவசாயி சீட்டு','பால் சீட்டு','மையம்:','விவசாயி:','தேதி:','காம்காஜ் பில்ஸ் மூலம் உருவாக்கப்பட்டது.','எடை மற்றும் பண விவரங்கள் சரிபார்க்கப்பட்டன. நன்றி!','காலை - எருமை','மாலை - எருமை','காலை - பசு','மாலை - பசு'],
  te: ['← అన్ని టూల్స్','కామ్‌కాజ్ బిల్స్ • డెయిరీ & మండీ రైతు స్లిప్','భాష','ఇక్కడ నుండి మోడ్ మార్చవచ్చు','1. స్లిప్ రకాన్ని ఎంచుకోండి:','🌾 మండీ పంట అమ్మకం స్లిప్','🥛 డెయిరీ పాలు సేకరణ స్లిప్','1. మండీ ఆడత్ / డెయిరీ కేంద్ర వివరాలు','సంస్థ / డెయిరీ కేంద్రం పేరు','మండీ / గ్రామ చిరునామా & మొబైల్','2. రైతు వివరాలు','స్లిప్ నంబర్ (ఆటో)','తేదీ','పాల షిఫ్ట్ / పశువు','వాహనం / ట్రాక్టర్ నంబర్ (ఐచ్ఛికం)','రైతు పేరు','గ్రామం & మొబైల్ / WhatsApp','3. పంట బరువు & వేలం ధర','పంట / వస్తువు','బస్తాలు','నికర బరువు (క్వింటాళ్లు)','ధర / క్వింటాల్ (₹)','+ పంట జోడించండి','4. మండీ ఖర్చులు / తగ్గింపులు','హమాలీ / తూకం (₹)','ఆడత్ / మండీ ఫీజు (₹)','అడ్వాన్స్ / రవాణా తగ్గింపు (₹)','3. పాల పరిమాణం, FAT, SNF & ధర','పాల పరిమాణం (లీటర్లు)','FAT (%)','SNF (%)','ధర / లీటర్ (₹)','పశు ఆహారం / అడ్వాన్స్ తగ్గింపు (₹)','చెల్లింపు విధానం','బ్యాంక్ ఖాతా బదిలీ','నగదు చెల్లింపు','వ్యాఖ్యలు / చెల్లింపు గమనిక','📥 A4 PDF డౌన్‌లోడ్','🖨️ నేరుగా ప్రింట్','📲 WhatsApp స్లిప్','రైతు స్లిప్ ప్రత్యక్ష ప్రివ్యూ','మండీ రైతు స్లిప్','పాల సేకరణ స్లిప్','స్లిప్ నంబర్:','తేదీ:','రైతు పేరు:','గ్రామం / మొబైల్:','వాహన నంబర్:','పంట మొత్తం విలువ:','హమాలీ / తూకం:','ఆడత్ / మండీ ఫీజు:','అడ్వాన్స్ / రవాణా తగ్గింపు:','రైతుకు నికర చెల్లింపు:','గమనిక:','రైతు సంతకం / వేలిముద్ర','మునీమ్ / అధీకృత సంతకం','షిఫ్ట్ / పశువు:','మొబైల్:','పాల పరిమాణం (లీటర్)','FAT (%)','SNF (%)','ధర / లీటర్','మొత్తం పాల విలువ:','పశు ఆహారం / అడ్వాన్స్ తగ్గింపు:','నికర చెల్లింపు','సభ్యుడు / రైతు సంతకం','డెయిరీ కార్యదర్శి / ఆపరేటర్ సంతకం','క్వింటాల్','లీటర్','మండీ రైతు స్లిప్','డెయిరీ పాల స్లిప్','కేంద్రం:','రైతు:','తేదీ:','కామ్‌కాజ్ బిల్స్ ద్వారా రూపొందించబడింది.','బరువు మరియు చెల్లింపు వివరాలు తనిఖీ చేయబడ్డాయి. ధన్యవాదాలు!','ఉదయం - గేదె','సాయంత్రం - గేదె','ఉదయం - ఆవు','సాయంత్రం - ఆవు'],
  kn: ['← ಎಲ್ಲಾ ಉಪಕರಣಗಳು','ಕಾಮ್‌ಕಾಜ್ ಬಿಲ್ಸ್ • ಡೈರಿ ಮತ್ತು ಮಂಡಿ ರೈತ ಸ್ಲಿಪ್','ಭಾಷೆ','ಇಲ್ಲಿಂದ ನೀವು ಮೋಡ್ ಬದಲಾಯಿಸಬಹುದು','1. ಸ್ಲಿಪ್ ಪ್ರಕಾರ ಆಯ್ಕೆಮಾಡಿ:','🌾 ಮಂಡಿ ಬೆಳೆ ಮಾರಾಟ ಸ್ಲಿಪ್','🥛 ಡೈರಿ ಹಾಲು ಸಂಗ್ರಹ ಸ್ಲಿಪ್','1. ಮಂಡಿ ಆಢತ್ / ಡೈರಿ ಕೇಂದ್ರದ ವಿವರಗಳು','ಆಢತ್ ಸಂಸ್ಥೆ / ಡೈರಿ ಕೇಂದ್ರದ ಹೆಸರು','ಮಂಡಿ / ಗ್ರಾಮದ ವಿಳಾಸ ಮತ್ತು ಮೊಬೈಲ್','2. ರೈತರ ವಿವರಗಳು','ಸ್ಲಿಪ್ ಸಂಖ್ಯೆ (ಆಟೋ)','ದಿನಾಂಕ','ಹಾಲಿನ ಶಿಫ್ಟ್ / ಪಶು','ವಾಹನ / ಟ್ರ್ಯಾಕ್ಟರ್ ಸಂಖ್ಯೆ (ಐಚ್ಛಿಕ)','ರೈತರ ಹೆಸರು','ಗ್ರಾಮ ಮತ್ತು ಮೊಬೈಲ್ / WhatsApp','3. ಬೆಳೆ ತೂಕ ಮತ್ತು ಹರಾಜು ದರ','ಬೆಳೆ / ಸರಕು','ಚೀಲಗಳು','ನಿವ್ವಳ ತೂಕ (ಕ್ವಿಂಟಾಲ್)','ದರ / ಕ್ವಿಂಟಾಲ್ (₹)','+ ಬೆಳೆ ಸೇರಿಸಿ','4. ಮಂಡಿ ವೆಚ್ಚ / ಕಡಿತಗಳು','ಹಮಾಲಿ / ತೂಕ (₹)','ಆಢತ್ / ಮಂಡಿ ಶುಲ್ಕ (₹)','ಮುಂಗಡ / ಸಾರಿಗೆ ಕಡಿತ (₹)','3. ಹಾಲಿನ ಪ್ರಮಾಣ, FAT, SNF ಮತ್ತು ದರ','ಹಾಲಿನ ಪ್ರಮಾಣ (ಲೀಟರ್)','FAT (%)','SNF (%)','ದರ / ಲೀಟರ್ (₹)','ಪಶು ಆಹಾರ / ಮುಂಗಡ ಕಡಿತ (₹)','ಪಾವತಿ ವಿಧಾನ','ಬ್ಯಾಂಕ್ ಖಾತೆ ವರ್ಗಾವಣೆ','ನಗದು ಪಾವತಿ','ಟಿಪ್ಪಣಿ / ಪಾವತಿ ಸಂದೇಶ','📥 A4 PDF ಡೌನ್‌ಲೋಡ್','🖨️ ನೇರ ಮುದ್ರಣ','📲 WhatsApp ಸ್ಲಿಪ್','ರೈತ ಸ್ಲಿಪ್ ಲೈವ್ ಪೂರ್ವವೀಕ್ಷಣೆ','ಮಂಡಿ ರೈತ ಸ್ಲಿಪ್','ಹಾಲು ಸಂಗ್ರಹ ಸ್ಲಿಪ್','ಸ್ಲಿಪ್ ಸಂಖ್ಯೆ:','ದಿನಾಂಕ:','ರೈತರ ಹೆಸರು:','ಗ್ರಾಮ / ಮೊಬೈಲ್:','ವಾಹನ ಸಂಖ್ಯೆ:','ಬೆಳೆ ಒಟ್ಟು ಮೊತ್ತ:','ಹಮಾಲಿ / ತೂಕ:','ಆಢತ್ / ಮಂಡಿ ಶುಲ್ಕ:','ಮುಂಗಡ / ಸಾರಿಗೆ ಕಡಿತ:','ರೈತನಿಗೆ ನಿವ್ವಳ ಪಾವತಿ:','ಟಿಪ್ಪಣಿ:','ರೈತರ ಸಹಿ / ಹೆಬ್ಬೆರಳ ಗುರುತು','ಮುನೀಮ್ / ಅಧಿಕೃತ ಸಹಿ','ಶಿಫ್ಟ್ / ಪಶು:','ಮೊಬೈಲ್:','ಹಾಲಿನ ಪ್ರಮಾಣ (ಲೀಟರ್)','FAT (%)','SNF (%)','ದರ / ಲೀಟರ್','ಒಟ್ಟು ಹಾಲಿನ ಮೌಲ್ಯ:','ಪಶು ಆಹಾರ / ಮುಂಗಡ ಕಡಿತ:','ನಿವ್ವಳ ಪಾವತಿ','ಸದಸ್ಯ / ರೈತರ ಸಹಿ','ಡೈರಿ ಕಾರ್ಯದರ್ಶಿ / ಆಪರೇಟರ್ ಸಹಿ','ಕ್ವಿಂಟಾಲ್','ಲೀಟರ್','ಮಂಡಿ ರೈತ ಸ್ಲಿಪ್','ಡೈರಿ ಹಾಲು ಸ್ಲಿಪ್','ಕೇಂದ್ರ:','ರೈತ:','ದಿನಾಂಕ:','ಕಾಮ್‌ಕಾಜ್ ಬಿಲ್ಸ್ ಮೂಲಕ ರಚಿಸಲಾಗಿದೆ.','ತೂಕ ಮತ್ತು ಪಾವತಿ ವಿವರಗಳನ್ನು ಪರಿಶೀಲಿಸಲಾಗಿದೆ. ಧನ್ಯವಾದಗಳು!','ಬೆಳಿಗ್ಗೆ - ಎಮ್ಮೆ','ಸಂಜೆ - ಎಮ್ಮೆ','ಬೆಳಿಗ್ಗೆ - ಹಸು','ಸಂಜೆ - ಹಸು'],

function renderMandiRows(){document.getElementById('mandiInputsBody').innerHTML=crops.map((c,i)=>`<tr><td><input aria-label="${t('cropLabel')}" value="${esc(c.name)}" oninput="crops[${i}].name=this.value;renderDoc()"></td><td><input aria-label="${t('bagsLabel')}" type="number" min="0" step="any" value="${c.bags}" oninput="crops[${i}].bags=num(this.value);renderDoc()"></td><td><input aria-label="${t('weightLabel')}" type="number" min="0" step="any" value="${c.qtl}" oninput="crops[${i}].qtl=num(this.value);renderDoc()"></td><td><input aria-label="${t('rateLabel')}" type="number" min="0" step="any" value="${c.rate}" oninput="crops[${i}].rate=num(this.value);renderDoc()"></td><td class="t-center"><button type="button" class="btn-del-row" aria-label="Delete crop" onclick="delCrop(${i})">✕</button></td></tr>`).join('')}
function addMandiRow(){crops.push({name:'',bags:0,qtl:0,rate:0});renderMandiRows();renderDoc()}
function delCrop(i){if(crops.length>1){crops.splice(i,1);renderMandiRows();renderDoc()}}
function calcDairy(){renderDoc()}
function renderDoc(){const biz=esc(document.getElementById('in_biz').value.trim()||(mode==='MANDI'?'SHREE KISAN KRISHI ADHAT COMPANY':'GRAMIN DUDH SANKALAN KENDRA'));const addr=esc(document.getElementById('in_addr').value.trim()||'Krishi Upaj Mandi Yard | Mob: 9000000000');const slipNo=esc(document.getElementById('in_slip_no').value.trim()||'-');const dt=esc(document.getElementById('in_date').value||'-');const farmer=esc(document.getElementById('in_farmer').value.trim()||'-');const ph=esc(document.getElementById('in_phone').value.trim()||'-');const notes=esc(document.getElementById('in_notes').value.trim()||t('defaultNote'));
if(mode==='MANDI'){const veh=esc(document.getElementById('in_vehicle').value.trim()||'-');let gross=0;const rows=crops.map((c,i)=>{const qtl=num(c.qtl),rate=num(c.rate),amt=qtl*rate;gross+=amt;return `<tr><td class="t-center">${i+1}</td><td>${esc(c.name||'-')}</td><td class="t-center">${num(c.bags)}</td><td class="t-center">${qtl} ${t('qtl')}</td><td class="t-right">₹${num(rate).toLocaleString('en-IN')}</td><td class="t-right">₹${money(amt)}</td></tr>`}).join('');const ham=num(document.getElementById('in_hammali').value),adh=num(document.getElementById('in_adhat').value),adv=num(document.getElementById('in_adv_cut').value),net=Math.max(0,gross-ham-adh-adv);document.getElementById('slipPreviewContent').innerHTML=`<div class="doc-header"><div class="doc-biz"><h2>${biz}</h2><p>${addr}</p></div><div class="doc-type-badge">${t('mandiBadge')}</div></div><table class="meta-table"><tr><td class="lbl">${t('outSlipNo')}</td><td class="val"><b>${slipNo}</b></td><td class="lbl">${t('outDate')}</td><td class="val">${dt}</td></tr><tr><td class="lbl">${t('outFarmer')}</td><td class="val"><b>${farmer}</b></td><td class="lbl">${t('outVillage')}</td><td class="val">${ph}</td></tr><tr><td class="lbl">${t('outVehicle')}</td><td class="val" colspan="3">${veh}</td></tr></table><table class="doc-items-table"><thead><tr><th class="t-center">#</th><th>${t('cropLabel')}</th><th class="t-center">${t('bagsLabel')}</th><th class="t-center">${t('weightLabel')}</th><th class="t-right">${t('rateLabel')}</th><th class="t-right">${t('amount')}</th></tr></thead><tbody>${rows}</tbody></table><div class="summary-wrap"><table class="summary-table"><tr><td>${t('grossCrop')}</td><td class="t-right">₹${money(gross)}</td></tr>${ham>0?`<tr style="color:#dc2626"><td>${t('hammaliOut')}</td><td class="t-right">-₹${money(ham)}</td></tr>`:''}${adh>0?`<tr style="color:#dc2626"><td>${t('adhatOut')}</td><td class="t-right">-₹${money(adh)}</td></tr>`:''}${adv>0?`<tr style="color:#dc2626"><td>${t('advanceCutOut')}</td><td class="t-right">-₹${money(adv)}</td></tr>`:''}<tr class="total-row"><td>${t('netKisan')}</td><td class="t-right">₹${money(net)}</td></tr></table></div><div class="notes-box"><b>${t('noteLabel')}</b> ${notes}</div><div class="footer-sig-row"><div style="font-size:10px;color:#64748b">${t('farmerSign')}</div><div class="sig-block">${t('munimSign')}</div></div>`;
}else{const shift=document.getElementById('in_shift').value;const shiftText=t(shift);const qty=num(document.getElementById('d_qty').value),fat=esc(document.getElementById('d_fat').value||'-'),snf=esc(document.getElementById('d_snf').value||'-'),rate=num(document.getElementById('d_rate').value),gross=qty*rate,ded=num(document.getElementById('d_ded').value),net=Math.max(0,gross-ded),pMode=document.getElementById('d_mode').value==='bank'?t('bankOption'):t('cashOption');document.getElementById('slipPreviewContent').innerHTML=`<div class="doc-header"><div class="doc-biz"><h2>${biz}</h2><p>${addr}</p></div><div class="doc-type-badge">${t('dairyBadge')}</div></div><table class="meta-table"><tr><td class="lbl">${t('outSlipNo')}</td><td class="val"><b>${slipNo}</b></td><td class="lbl">${t('outDate')}</td><td class="val">${dt}</td></tr><tr><td class="lbl">${t('outFarmer')}</td><td class="val"><b>${farmer}</b></td><td class="lbl">${t('outMobile')}</td><td class="val">${ph}</td></tr><tr><td class="lbl">${t('outShift')}</td><td class="val" colspan="3">${shiftText}</td></tr></table><table class="doc-items-table"><thead><tr><th class="t-center">${t('outMilkQty')}</th><th class="t-center">${t('outFat')}</th><th class="t-center">${t('outSnf')}</th><th class="t-right">${t('outRate')}</th><th class="t-right">${t('amount')}</th></tr></thead><tbody><tr><td class="t-center"><b>${qty} ${t('ltr')}</b></td><td class="t-center">${fat}%</td><td class="t-center">${snf}%</td><td class="t-right">₹${rate.toFixed(2)}</td><td class="t-right">₹${money(gross)}</td></tr></tbody></table><div class="summary-wrap"><table class="summary-table"><tr><td>${t('outGrossMilk')}</td><td class="t-right">₹${money(gross)}</td></tr>${ded>0?`<tr style="color:#dc2626"><td>${t('feedDed')}</td><td class="t-right">-₹${money(ded)}</td></tr>`:''}<tr class="total-row"><td>${t('netPay')} (${pMode}):</td><td class="t-right">₹${money(net)}</td></tr></table></div><div class="notes-box"><b>${t('noteLabel')}</b> ${notes}</div><div class="footer-sig-row"><div style="font-size:10px;color:#64748b">${t('memberSign')}</div><div class="sig-block">${t('dairySign')}</div></div>`}}
function downloadA4PDF(){const btn=document.getElementById('btnPdf');if(typeof html2pdf!=='function'){alert('PDF library could not be loaded. Please check your internet connection and try again.');return}btn.disabled=true;const originalText=btn.textContent;btn.textContent='⏳ '+(curLang==='hi'?'PDF बनाया जा रहा है…':'Generating PDF…');const source=document.getElementById('a4DocSheet');const clone=source.cloneNode(true);clone.removeAttribute('id');const PDF_WIDTH=680;clone.style.cssText=[`width:${PDF_WIDTH}px`,`max-width:${PDF_WIDTH}px`,'margin:0','padding:26px 28px','background:#ffffff','color:#0f172a','border:1.5px solid #cbd5e1','border-radius:6px','box-shadow:none','box-sizing:border-box'].join(';');const overlay=document.createElement('div');overlay.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;background:#ffffff;z-index:999999;overflow:auto;margin:0;padding:0;';const staging=document.createElement('div');staging.style.cssText=`position:relative;top:0;left:0;width:${PDF_WIDTH}px;margin:0;padding:0;background:#ffffff;`;staging.appendChild(clone);overlay.appendChild(staging);document.body.appendChild(overlay);const safeNo=(document.getElementById('in_slip_no').value.trim()||'KisanParchi').replace(/[^a-zA-Z0-9-_]/g,'');const filename=`${mode==='MANDI'?'MandiSlip':'DairySlip'}_${safeNo}.pdf`;requestAnimationFrame(()=>setTimeout(()=>{html2pdf().set({margin:[10,12,12,12],filename,image:{type:'png',quality:1},html2canvas:{scale:3,useCORS:true,letterRendering:true,scrollX:0,scrollY:0,x:0,y:0,width:PDF_WIDTH,windowWidth:PDF_WIDTH,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true}}).from(staging).save().then(()=>{overlay.remove();btn.disabled=false;btn.textContent=originalText}).catch(err=>{console.error('PDF export failed:',err);overlay.remove();btn.disabled=false;btn.textContent=originalText;alert('PDF generation failed. Please try Direct Print → Save as PDF.')})},150))}
function printDocDirect(){const w=window.open('','_blank','width=850,height=900');if(!w){alert('Please allow pop-ups to print this slip.');return}w.document.write(`<!DOCTYPE html><html lang="${curLang}" dir="${curLang==='ur'?'rtl':'ltr'}"><head><meta charset="UTF-8"><title>${t('title')}</title><style>*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;padding:8mm;background:#fff;color:#0f172a}.slip-box{border:1.5px solid #0f172a;border-radius:8px;padding:16px}.doc-header{display:flex;justify-content:space-between;border-bottom:2px solid #15803d;padding-bottom:8px;margin-bottom:10px}.doc-biz h2{margin:0;font-size:17px;text-transform:uppercase}.doc-biz p{margin:2px 0 0;font-size:10.5px;color:#475569}.doc-type-badge{background:#15803d;color:#fff;padding:4px 10px;font-size:10.5px;font-weight:800;border-radius:4px}.meta-table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px}.meta-table td{padding:4px 6px;border:1px solid #cbd5e1}.meta-table td.lbl{background:#f8fafc;font-weight:700;width:22%}.doc-items-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}.doc-items-table th{background:#dcfce7;color:#166534;padding:5px;text-align:left;border:1px solid #86efac}.doc-items-table td{padding:5px;border:1px solid #cbd5e1}.t-right{text-align:right}.t-center{text-align:center}.summary-wrap{display:flex;justify-content:flex-end;margin:8px 0}.summary-table{font-size:11px;border-collapse:collapse;min-width:230px}.summary-table td{padding:2px 6px}.total-row td{background:#dcfce7;border-top:2px solid #15803d;font-size:13.5px;font-weight:800;color:#14532d}.notes-box{background:#f8fafc;border-left:3px solid #15803d;padding:6px 8px;font-size:10px;margin:8px 0}.footer-sig-row{display:flex;justify-content:space-between;margin-top:24px;font-size:10px}.sig-block{width:44%;text-align:center;border-top:1.5px dashed #475569;padding-top:4px;font-weight:700}@media print{@page{size:A4 portrait;margin:0}}</style></head><body>${document.getElementById('a4DocSheet').innerHTML}</body></html>`);w.document.close();w.focus();setTimeout(()=>{w.print();w.close()},400)}
function shareWhatsApp(){const biz=document.getElementById('in_biz').value.trim()||(mode==='MANDI'?'Mandi / Dairy':'Dairy Center'),farmer=document.getElementById('in_farmer').value.trim()||'Kisan',slipNo=document.getElementById('in_slip_no').value,date=document.getElementById('in_date').value;let msg=`*🌾 ${mode==='MANDI'?t('waMandi'):t('waDairy')} (${slipNo})*\n*${t('waCenter')}* ${biz}\n*${t('waFarmer')}* ${farmer}\n*${t('waDate')}* ${date}\n\n_${t('generated')}_`;if(mode==='DAIRY'){const qty=num(document.getElementById('d_qty').value),gross=qty*num(document.getElementById('d_rate').value),ded=num(document.getElementById('d_ded').value);msg+=`\n*${t('outMilkQty')}:* ${qty} ${t('ltr')}\n*${t('netPay')}:* ₹${Math.max(0,gross-ded).toLocaleString('en-IN')}`}else{const gross=crops.reduce((s,c)=>s+num(c.qtl)*num(c.rate),0),ded=num(document.getElementById('in_hammali').value)+num(document.getElementById('in_adhat').value)+num(document.getElementById('in_adv_cut').value);msg+=`\n*${t('netKisan')}:* ₹${Math.max(0,gross-ded).toLocaleString('en-IN')}`}window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank')}
window.onload=()=>{try{if(localStorage.getItem('kkb_mandi_theme')==='dark')document.body.classList.add('dark-mode');const savedLang=localStorage.getItem('kkb_mandi_lang');if(savedLang&&LOCALES[savedLang])curLang=savedLang}catch(e){}document.getElementById('in_date').value=new Date().toISOString().split('T')[0];document.getElementById('in_slip_no').value='MND-'+Math.floor(100000+Math.random()*899990);applyLanguage();renderMandiRows();renderDoc()};
