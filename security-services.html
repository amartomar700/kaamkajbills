  $('slipPreviewContent').innerHTML=`<div class="doc-header"><div class="doc-biz"><h2>${biz}</h2><p>${addr}</p></div><div class="doc-type-badge">${esc(t('rosterBadge'))}</div></div><table class="meta-table"><tr><td class="lbl">${esc(t('outRosterNo'))}:</td><td class="val"><b>${rosNo}</b></td><td class="lbl">${esc(t('outDutyDate'))}:</td><td class="val">${dt}</td></tr><tr><td class="lbl">${esc(t('outClientSite'))}:</td><td class="val" colspan="3"><b>${site}</b></td></tr><tr><td class="lbl">${esc(t('outOfficer'))}:</td><td class="val" colspan="3">${sup}</td></tr></table><table class="doc-items-table"><thead><tr><th class="t-center" style="width:7%">#</th><th style="width:28%">${esc(t('outGuardName'))}</th><th style="width:23%">${esc(t('outPost'))}</th><th style="width:24%">${esc(t('outShift'))}</th><th style="width:18%">${esc(t('outContact'))}</th></tr></thead><tbody>${rows}</tbody></table><div class="notes-box"><b>${esc(t('outStandingOrders'))}:</b> ${notes}</div><div class="footer-sig-row"><div style="font-size:10px;color:#64748b">${esc(t('outClientSign'))}</div><div class="sig-block">${esc(t('outSupervisorSign'))}</div></div>`;
 }else{
  const advNo=esc($('in_adv_no').value.trim()||'-'),dt=esc($('in_adv_date').value||'-'),dedM=esc($('in_ded_month').value.trim()||t('nextSalary')),staff=esc($('in_staff_name').value.trim()||'-'),role=esc($('in_staff_role').value.trim()||'-'),amt=safeNum($('in_adv_amt').value),pMode=$('in_adv_mode').value==='cash'?t('cash'):t('upi'),reason=esc($('in_adv_reason').value.trim()||t('personalRequirement'));
  const declaration=t('declarationText').replace('{month}',dedM);
  $('slipPreviewContent').innerHTML=`<div class="doc-header"><div class="doc-biz"><h2>${biz}</h2><p>${addr}</p></div><div class="doc-type-badge">${esc(t('advanceBadge'))}</div></div><table class="meta-table"><tr><td class="lbl">${esc(t('outVoucherNo'))}:</td><td class="val"><b>${advNo}</b></td><td class="lbl">${esc(t('outDate'))}:</td><td class="val">${dt}</td></tr><tr><td class="lbl">${esc(t('outEmployee'))}:</td><td class="val"><b>${staff}</b></td><td class="lbl">${esc(t('outRole'))}:</td><td class="val">${role}</td></tr><tr><td class="lbl">${esc(t('outPayment'))}:</td><td class="val">${esc(pMode)}</td><td class="lbl">${esc(t('outRecovery'))}:</td><td class="val" style="color:#dc2626;font-weight:800">${dedM}</td></tr><tr><td class="lbl">${esc(t('outReason'))}:</td><td class="val" colspan="3">${reason}</td></tr></table><div class="adv-highlight"><span style="font-size:12px;font-weight:800">${esc(t('outAdvancePaid'))}</span><span class="adv-amount">₹${money(amt)}</span></div><div class="declaration-box"><b>${esc(t('outDeclaration'))}:</b> ${esc(declaration)}</div><div class="footer-sig-row"><div class="sig-block">${esc(t('outReceiverSign'))}</div><div class="sig-block">${esc(t('outManagerSign'))}</div></div>`;
 }
}
function downloadA4PDF(){const btn=$('btnPdf');if(typeof html2pdf!=='function'){alert('PDF library could not be loaded. Please check your internet connection and try again.');return}btn.disabled=true;const oldText=btn.textContent;btn.textContent=t('generating');const clone=$('a4DocSheet').cloneNode(true);clone.removeAttribute('id');const PDF_WIDTH=680;clone.style.cssText=[`width:${PDF_WIDTH}px`,`max-width:${PDF_WIDTH}px`,'min-width:0','margin:0','padding:26px 28px','background:#ffffff','color:#0f172a','border:1.5px solid #cbd5e1','border-radius:6px','box-shadow:none','box-sizing:border-box','flex-shrink:0'].join(';');const overlay=document.createElement('div');overlay.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;background:#ffffff;z-index:999999;overflow:auto;margin:0;padding:0;';const staging=document.createElement('div');staging.style.cssText=`position:relative;top:0;left:0;width:${PDF_WIDTH}px;margin:0;padding:0;background:#ffffff;`;staging.appendChild(clone);overlay.appendChild(staging);document.body.appendChild(overlay);const rawNo=mode==='ROSTER'?($('in_ros_no').value.trim()||'Roster'):($('in_adv_no').value.trim()||'Advance');const safeNo=rawNo.replace(/[^a-zA-Z0-9-_]/g,'')||'SecuritySlip';const filename=`${mode==='ROSTER'?'DutyRoster':'StaffAdvance'}_${safeNo}.pdf`;requestAnimationFrame(()=>setTimeout(()=>{html2pdf().set({margin:[10,12,12,12],filename,image:{type:'png',quality:1},html2canvas:{scale:3,useCORS:true,letterRendering:true,scrollX:0,scrollY:0,x:0,y:0,width:PDF_WIDTH,windowWidth:PDF_WIDTH,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},pagebreak:{mode:['css','legacy'],avoid:['.slip-box']}}).from(staging).save().then(()=>{overlay.remove();btn.disabled=false;btn.textContent=oldText}).catch(err=>{console.error('PDF export failed:',err);overlay.remove();btn.disabled=false;btn.textContent=oldText;alert('PDF export failed. Please try again or use Direct Print.')})},150))}
function printDocDirect(){const w=window.open('','_blank','width=900,height=950');if(!w){alert('Please allow pop-ups to print this slip.');return}const html=`<!DOCTYPE html><html lang="${curLang}" dir="${curLang==='ur'?'rtl':'ltr'}"><head><meta charset="UTF-8"><title>Security Services Slip</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;padding:8mm;background:#fff;color:#0f172a}.slip-box{border:1.5px solid #0f172a;border-radius:8px;padding:16px;break-inside:avoid}.doc-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1e3a8a;padding-bottom:8px;margin-bottom:10px;gap:10px}.doc-biz h2{margin:0;font-size:17px;text-transform:uppercase}.doc-biz p{margin:2px 0 0;font-size:10.5px;color:#475569}.doc-type-badge{background:#1e3a8a;color:#fff;padding:4px 10px;font-size:10px;font-weight:800;border-radius:4px;max-width:48%;text-align:center}.meta-table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px;table-layout:fixed}.meta-table td{padding:4px 6px;border:1px solid #cbd5e1;overflow-wrap:anywhere}.meta-table td.lbl{background:#f8fafc;font-weight:700;width:22%}.doc-items-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:10.5px;table-layout:fixed}.doc-items-table th{background:#dbeafe;color:#1e3a8a;padding:5px;text-align:left;border:1px solid #93c5fd}.doc-items-table td{padding:5px;border:1px solid #cbd5e1;overflow-wrap:anywhere}.t-center{text-align:center}.notes-box,.declaration-box{background:#f8fafc;border:1px solid #cbd5e1;border-left:3px solid #1e3a8a;padding:7px 9px;font-size:10px;margin:8px 0;line-height:1.45}.adv-highlight{background:#eff6ff;border:1px solid #93c5fd;padding:10px 12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:10px 0}.adv-amount{font-size:18px;font-weight:900;color:#1e3a8a}.footer-sig-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;font-size:10px;gap:12px}.sig-block{width:44%;text-align:center;border-top:1.5px dashed #475569;padding-top:4px;font-weight:700}@page{size:A4 portrait;margin:0}</style></head><body>${$('a4DocSheet').innerHTML}</body></html>`;w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function shareWhatsApp(){const biz=$('in_biz').value.trim()||'Security Agency';if(mode==='ROSTER'){const site=$('in_site').value.trim()||'Site';const lines=guards.map((g,i)=>`${i+1}. *${g.name||'-'}* - ${g.post||'-'} (${g.shift||'-'})`).join('\n');const msg=`*🛡️ ${t('rosterBadge')} (${ $('in_ros_date').value||'-' })*\n*${t('waAgency')}:* ${biz}\n*${t('waSite')}:* ${site}\n\n${lines}\n\n_${t('generated')}_`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank')}else{const staff=$('in_staff_name').value.trim()||'Staff';const amt=safeNum($('in_adv_amt').value);const ph=$('in_staff_ph').value.trim().replace(/[^0-9]/g,'');const msg=`*💵 ${t('advanceBadge')} (${ $('in_adv_no').value||'-' })*\n*${t('waAgency')}:* ${biz}\n*${t('waStaff')}:* ${staff}\n*${t('waAdvancePaid')}:* ₹${money(amt)}\n*${t('waPurpose')}:* ${$('in_adv_reason').value.trim()||'-'}\n\n_${t('generated')}_`;window.open(ph?`https://wa.me/91${ph}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank')}}
window.addEventListener('load',()=>{try{if(localStorage.getItem('kkb_security_theme')==='dark')document.body.classList.add('dark-mode');const saved=localStorage.getItem('kkb_security_lang');if(saved&&I18N[saved])curLang=saved}catch(e){}const today=new Date().toISOString().split('T')[0];$('in_ros_date').value=today;$('in_adv_date').value=today;$('in_ros_no').value='RST-'+Math.floor(100000+Math.random()*899990);$('in_adv_no').value='ADV-'+Math.floor(100000+Math.random()*899990);$('languageSelect').value=curLang;applyLanguage();renderGuardRows();renderDoc()});
