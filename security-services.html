<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Security Services Duty Roster & Staff Advance Slip - KaamKaj Bills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --primary: #1e3a8a;
    --primary-dark: #172554;
    --primary-soft: #dbeafe;
    --ink: #0f172a;
    --ink-muted: #475569;
    --border: #cbd5e1;
    --bg: #f1f5f9;
    --danger: #dc2626;
  }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }

  /* Top Navigation Bar */
  .top-nav {
    background: var(--ink);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #f59e0b;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .btn-home {
    background: rgba(255,255,255,0.12);
    color: #fff;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.2s;
  }
  .btn-home:hover { background: var(--primary); border-color: var(--primary); }
  .nav-title { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }

  /* PC Full-Wide Split Grid Layout */
  .kb-wrapper {
    width: 100%;
    max-width: 100%;
    padding: 18px 24px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 24px;
    align-items: start;
  }

  /* Left Control Box */
  .control-box {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  label { font-size: 11px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.4px; }

  input, select {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13.5px;
    outline: none;
    color: var(--ink);
    background: #f8fafc;
    transition: all 0.2s;
  }
  input:focus, select:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.14);
  }

  .section-badge {
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 11.5px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 16px 0 12px 0;
    text-transform: uppercase;
    border-left: 4px solid var(--primary);
  }
  .section-badge:first-of-type { margin-top: 0; }

  .toggle-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
    background: #f1f5f9;
    border: 1px solid var(--border);
    padding: 5px;
    border-radius: 10px;
  }
  .toggle-btn {
    padding: 10px;
    border: none;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--ink-muted);
    transition: 0.2s;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 3px 8px rgba(30, 58, 138, 0.28);
  }

  /* Roster Table Controls */
  .items-input-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
  .items-input-table th {
    text-align: left;
    padding: 8px 6px;
    color: var(--ink-muted);
    font-weight: 800;
    background: #eff6ff;
    border-bottom: 2px solid var(--border);
  }
  .items-input-table td { padding: 6px 4px; }
  .btn-del-row {
    background: #fee2e2;
    color: var(--danger);
    border: 1px solid #fca5a5;
    border-radius: 6px;
    width: 32px;
    height: 36px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-del-row:hover { background: var(--danger); color: #fff; }
  .btn-add-row {
    background: var(--primary-soft);
    color: var(--primary-dark);
    border: 1.5px dashed var(--primary);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }

  /* Actions */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
  .btn {
    flex: 1;
    min-width: 140px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    transition: 0.2s;
  }
  .btn:hover { opacity: 0.93; transform: translateY(-1px); }
  .btn-pdf { background: linear-gradient(135deg, #1e3a8a, #172554); }
  .btn-print { background: linear-gradient(135deg, #1e293b, #0f172a); }
  .btn-wa { background: linear-gradient(135deg, #16a34a, #15803d); }

  /* Right Sticky Preview Panel */
  .preview-panel {
    position: sticky;
    top: 72px;
    width: 100%;
  }
  .preview-label {
    text-align: center;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  #a4DocSheet {
    background: #ffffff;
    width: 100%;
    padding: 24px 20px;
    border: 1.5px solid #cbd5e1;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    border-radius: 8px;
    box-sizing: border-box;
  }

  .slip-box {
    border: 1.5px solid #0f172a;
    border-radius: 8px;
    padding: 16px;
    background: #ffffff;
  }

  .doc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2.5px solid var(--primary);
    padding-bottom: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .doc-biz h2 { margin: 0; font-size: 18px; font-weight: 800; color: #0f172a; text-transform: uppercase; }
  .doc-biz p { margin: 3px 0 0; font-size: 11px; color: #475569; }
  .doc-type-badge {
    background: var(--primary);
    color: #ffffff;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 800;
    border-radius: 5px;
    text-transform: uppercase;
  }

  .meta-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 11px; }
  .meta-table td { padding: 4px 6px; border: 1px solid #cbd5e1; }
  .meta-table td.lbl { background: #f8fafc; font-weight: 700; color: #334155; width: 24%; }
  .meta-table td.val { font-weight: 600; color: #0f172a; width: 26%; }

  .doc-items-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 11px; }
  .doc-items-table th { background: #dbeafe; color: #1e3a8a; padding: 6px; text-align: left; font-weight: 800; border: 1px solid #93c5fd; }
  .doc-items-table td { padding: 5.5px 6px; border: 1px solid #cbd5e1; font-weight: 600; }
  .t-center { text-align: center !important; }

  .adv-highlight {
    background: #eff6ff;
    border: 1.5px solid #93c5fd;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 12px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .notes-box { background: #f8fafc; border-left: 3.5px solid var(--primary); padding: 7px 10px; font-size: 10.5px; color: #334155; margin: 10px 0; line-height: 1.45; }
  .footer-sig-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 26px; font-size: 10.5px; }
  .sig-block { width: 44%; text-align: center; border-top: 1.5px dashed #475569; padding-top: 4px; font-weight: 700; color: #334155; }

  @media (max-width: 960px) {
    .kb-wrapper { grid-template-columns: 1fr; padding: 12px 8px; gap: 16px; }
    .preview-panel { position: static; }
    .top-nav { padding: 10px 12px; }
  }
  @media (max-width: 600px) {
    .toggle-bar, .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html" target="_self" class="btn-home">← All Tools</a>
  <span class="nav-title">KaamKaj Bills • Security Roster & Staff Advance</span>
  <span style="width: 60px;"></span>
</div>

<div class="kb-wrapper">
  <!-- LEFT: FORM CONTROLS -->
  <div class="control-box">
    <div style="margin-bottom: 10px;">
      <label>1. Slip Mode Chunein:</label>
      <div class="toggle-bar">
        <button type="button" class="toggle-btn active" id="btnRoster" onclick="setMode('ROSTER')">🛡️ Security Guard Duty Roster</button>
        <button type="button" class="toggle-btn" id="btnAdvance" onclick="setMode('ADVANCE')">💵 Staff Salary Advance Memo</button>
      </div>
    </div>

    <div class="section-badge">1. Agency / Company Details</div>
    <div class="grid-2">
      <div class="field"><label>Security Agency / Firm Name</label><input type="text" id="in_biz" placeholder="उदा. ShieldForce Security & Facility Services" oninput="renderDoc()"></div>
      <div class="field"><label>Office Address & Control Room No.</label><input type="text" id="in_addr" placeholder="उदा. Warje, Pune | 24x7 Control: 98XXXXXXXX" oninput="renderDoc()"></div>
    </div>

    <!-- ROSTER SECTION -->
    <div id="rosterSection">
      <div class="section-badge">2. Site & Shift Schedule Details</div>
      <div class="grid-3">
        <div class="field"><label>Roster No. (Auto)</label><input type="text" id="in_ros_no" oninput="renderDoc()"></div>
        <div class="field"><label>Duty Date / Week</label><input type="date" id="in_ros_date" oninput="renderDoc()"></div>
        <div class="field"><label>Field Supervisor Name</label><input type="text" id="in_sup" placeholder="उदा. Ajay Verma" oninput="renderDoc()"></div>
      </div>

      <div class="field"><label>Client Site / Society / Factory Name</label><input type="text" id="in_site" placeholder="उदा. Green Valley Co-op Housing Society, Pune" oninput="renderDoc()"></div>

      <div class="section-badge">3. Guard Deployment & Shift Timing</div>
      <div style="overflow-x: auto;">
        <table class="items-input-table">
          <thead>
            <tr>
              <th style="width: 30%;">Guard / Staff Name</th>
              <th style="width: 24%;">Post / Gate Point</th>
              <th style="width: 24%;">Shift Timing</th>
              <th style="width: 14%;">ID / Mobile</th>
              <th style="width: 8%;"></th>
            </tr>
          </thead>
          <tbody id="rosterInputsBody"></tbody>
        </table>
      </div>
      <button type="button" class="btn-add-row" onclick="addGuardRow()">+ Naya Guard / Staff Jodein</button>
    </div>

    <!-- ADVANCE SECTION -->
    <div id="advanceSection" style="display:none;">
      <div class="section-badge">2. Staff Advance Payment Details</div>
      <div class="grid-3">
        <div class="field"><label>Voucher / Memo No.</label><input type="text" id="in_adv_no" oninput="renderDoc()"></div>
        <div class="field"><label>Date (तारीख)</label><input type="date" id="in_adv_date" oninput="renderDoc()"></div>
        <div class="field"><label>Deduction Month</label><input type="text" id="in_ded_month" placeholder="उदा. November 2026" oninput="renderDoc()"></div>
      </div>

      <div class="grid-2">
        <div class="field"><label>Staff / Guard Full Name</label><input type="text" id="in_staff_name" placeholder="उदा. Rameshwar Yadav" oninput="renderDoc()"></div>
        <div class="field"><label>Designation & Employee ID</label><input type="text" id="in_staff_role" placeholder="उदा. Security Guard (ID: SG-42)" oninput="renderDoc()"></div>
      </div>

      <div class="grid-3">
        <div class="field"><label>Advance Amount (₹)</label><input type="number" id="in_adv_amt" placeholder="3000" oninput="renderDoc()"></div>
        <div class="field">
          <label>Payment Mode</label>
          <select id="in_adv_mode" onchange="renderDoc()">
            <option value="UPI / Online">UPI / Bank Transfer</option>
            <option value="CASH (नकद)">CASH (नकद)</option>
          </select>
        </div>
        <div class="field"><label>Staff Mobile / WhatsApp</label><input type="text" id="in_staff_ph" placeholder="उदा. 9876543210" oninput="renderDoc()"></div>
      </div>

      <div class="field"><label>Purpose / Reason for Advance</label><input type="text" id="in_adv_reason" placeholder="उदा. Personal / Family Medical Emergency" oninput="renderDoc()"></div>
    </div>

    <div class="field" style="margin-top: 8px;"><label>Standing Instructions / Terms</label><input type="text" id="in_notes" placeholder="उदा. सभी गार्ड ड्यूटी समय से 15 मिनट पहले प्रॉपर यूनिफॉर्म में रिपोर्ट करें। बिना रिलीवर पोस्ट न छोड़ें।" oninput="renderDoc()"></div>

    <div class="actions">
      <button type="button" class="btn btn-pdf" onclick="downloadA4PDF()">📥 Download A4 PDF</button>
      <button type="button" class="btn btn-print" onclick="printDocDirect()">🖨️ Direct Print</button>
      <button type="button" class="btn btn-wa" onclick="shareWhatsApp()">📲 WhatsApp Share</button>
    </div>
  </div>

  <!-- RIGHT: LIVE PREVIEW -->
  <div class="preview-panel">
    <div class="preview-label">Live Duty Roster / Advance Preview</div>
    <div id="a4DocSheet">
      <div class="slip-box" id="slipPreviewContent"></div>
    </div>
  </div>
</div>

<script>
  let mode = 'ROSTER';
  let guards = [
    { name: 'Suresh Jadhav', post: 'Main Entry Gate', shift: 'Day (08 AM - 08 PM)', phone: '98220XXXXX' },
    { name: 'Mahesh Kadam', post: 'Main Entry Gate', shift: 'Night (08 PM - 08 AM)', phone: '98230XXXXX' }
  ];

  function setMode(m) {
    mode = m;
    document.getElementById('btnRoster').classList.toggle('active', m === 'ROSTER');
    document.getElementById('btnAdvance').classList.toggle('active', m === 'ADVANCE');
    document.getElementById('rosterSection').style.display = m === 'ROSTER' ? 'block' : 'none';
    document.getElementById('advanceSection').style.display = m === 'ADVANCE' ? 'block' : 'none';
    renderDoc();
  }

  function renderGuardRows() {
    document.getElementById('rosterInputsBody').innerHTML = guards.map((g, i) => `
      <tr>
        <td><input value="${g.name}" oninput="guards[${i}].name=this.value;renderDoc()"></td>
        <td><input value="${g.post}" oninput="guards[${i}].post=this.value;renderDoc()"></td>
        <td><input value="${g.shift}" oninput="guards[${i}].shift=this.value;renderDoc()"></td>
        <td><input value="${g.phone}" oninput="guards[${i}].phone=this.value;renderDoc()"></td>
        <td class="t-center"><button type="button" class="btn-del-row" onclick="delGuard(${i})">✕</button></td>
      </tr>
    `).join('');
  }
  function addGuardRow() { guards.push({ name: '', post: '', shift: 'Day Shift', phone: '' }); renderGuardRows(); renderDoc(); }
  function delGuard(i) { if (guards.length > 1) { guards.splice(i, 1); renderGuardRows(); renderDoc(); } }

  function renderDoc() {
    const biz = document.getElementById('in_biz').value.trim() || 'SHIELDFORCE SECURITY SERVICES';
    const addr = document.getElementById('in_addr').value.trim() || '24x7 Control Room | Mob: 98XXXXXXXX';
    const notes = document.getElementById('in_notes').value.trim() || 'सभी गार्ड समय से 15 मिनट पहले प्रॉपर यूनिफॉर्म में रिपोर्ट करें।';

    if (mode === 'ROSTER') {
      const rosNo = document.getElementById('in_ros_no').value.trim() || '-';
      const dt = document.getElementById('in_ros_date').value || '-';
      const sup = document.getElementById('in_sup').value.trim() || '-';
      const site = document.getElementById('in_site').value.trim() || '-';

      const rows = guards.map((g, i) => `
        <tr>
          <td class="t-center">${i+1}</td>
          <td><b>${g.name || '-'}</b></td>
          <td>${g.post || '-'}</td>
          <td>${g.shift || '-'}</td>
          <td>${g.phone || '-'}</td>
        </tr>
      `).join('');

      document.getElementById('slipPreviewContent').innerHTML = `
        <div class="doc-header">
          <div class="doc-biz"><h2>${biz}</h2><p>${addr}</p></div>
          <div class="doc-type-badge">DUTY DEPLOYMENT ROSTER</div>
        </div>
        <table class="meta-table">
          <tr><td class="lbl">Roster No:</td><td class="val"><b>${rosNo}</b></td><td class="lbl">Duty Date:</td><td class="val">${dt}</td></tr>
          <tr><td class="lbl">Client Site:</td><td class="val" colspan="3"><b>${site}</b></td></tr>
          <tr><td class="lbl">Field Officer:</td><td class="val" colspan="3">${sup}</td></tr>
        </table>
        <table class="doc-items-table">
          <thead><tr><th class="t-center" style="width:7%">#</th><th style="width:28%">Guard Name</th><th style="width:23%">Post / Point</th><th style="width:24%">Shift Timing</th><th style="width:18%">Contact</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="notes-box"><b>Standing Orders:</b> ${notes}</div>
        <div class="footer-sig-row"><div style="font-size:10px;color:#64748b;">Client / Society Sign</div><div class="sig-block">Field Supervisor / Agency Sign</div></div>
      `;
    } else {
      const advNo = document.getElementById('in_adv_no').value.trim() || '-';
      const dt = document.getElementById('in_adv_date').value || '-';
      const dedM = document.getElementById('in_ded_month').value.trim() || 'Next Salary';
      const staff = document.getElementById('in_staff_name').value.trim() || '-';
      const role = document.getElementById('in_staff_role').value.trim() || '-';
      const amt = parseFloat(document.getElementById('in_adv_amt').value) || 0;
      const pMode = document.getElementById('in_adv_mode').value;
      const reason = document.getElementById('in_adv_reason').value.trim() || 'Personal Requirement';

      document.getElementById('slipPreviewContent').innerHTML = `
        <div class="doc-header">
          <div class="doc-biz"><h2>${biz}</h2><p>${addr}</p></div>
          <div class="doc-type-badge">STAFF ADVANCE VOUCHER</div>
        </div>
        <table class="meta-table">
          <tr><td class="lbl">Voucher No:</td><td class="val"><b>${advNo}</b></td><td class="lbl">Date:</td><td class="val">${dt}</td></tr>
          <tr><td class="lbl">Employee Name:</td><td class="val"><b>${staff}</b></td><td class="lbl">Role / ID:</td><td class="val">${role}</td></tr>
          <tr><td class="lbl">Payment Mode:</td><td class="val">${pMode}</td><td class="lbl">Recovery Month:</td><td class="val" style="color:#dc2626;font-weight:800;">${dedM}</td></tr>
          <tr><td class="lbl">Reason:</td><td class="val" colspan="3">${reason}</td></tr>
        </table>
        <div class="adv-highlight">
          <span style="font-size:12px;font-weight:800;color:#1e3a8a;">SALARY ADVANCE APPROVED & PAID:</span>
          <span style="font-size:18px;font-weight:900;color:#1e3a8a;">₹${amt.toLocaleString('en-IN', {minimumFractionDigits:2})}</span>
        </div>
        <div class="notes-box"><b>Declaration:</b> I acknowledge receipt of the above advance amount, which will be deducted from my upcoming monthly salary (${dedM}).</div>
        <div class="footer-sig-row"><div class="sig-block">Receiver / Staff Signature</div><div class="sig-block">Authorized Manager Sign</div></div>
      `;
    }
  }

  function downloadA4PDF() {
    const clone = document.getElementById('a4DocSheet').cloneNode(true);
    clone.style.cssText = 'width:700px;margin:0 auto;padding:18px;background:#fff;border:none;box-shadow:none;';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;top:0;left:0;width:740px;z-index:999999;background:#fff;';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);
    html2pdf().set({
      margin: [6, 6, 6, 6],
      filename: `${mode === 'ROSTER' ? 'DutyRoster' : 'StaffAdvance'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, width: 740, windowWidth: 740 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(clone).save().then(() => wrap.remove()).catch(() => wrap.remove());
  }

  function printDocDirect() {
    const w = window.open('', '_blank', 'width=850,height=900');
    w.document.write(`<!DOCTYPE html><html><head><title>Print</title><style>
      *{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;padding:8mm}
      .slip-box{border:1.5px solid #0f172a;border-radius:8px;padding:16px}
      .doc-header{display:flex;justify-content:space-between;border-bottom:2px solid #1e3a8a;padding-bottom:8px;margin-bottom:10px}
      .doc-biz h2{margin:0;font-size:17px;text-transform:uppercase}.doc-biz p{margin:2px 0 0;font-size:10.5px;color:#475569}
      .doc-type-badge{background:#1e3a8a;color:#fff;padding:4px 10px;font-size:10.5px;font-weight:800;border-radius:4px}
      .meta-table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px}
      .meta-table td{padding:4px 6px;border:1px solid #cbd5e1}.meta-table td.lbl{background:#f8fafc;font-weight:700;width:22%}
      .doc-items-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
      .doc-items-table th{background:#dbeafe;color:#1e3a8a;padding:5px;text-align:left;border:1px solid #93c5fd}
      .doc-items-table td{padding:5px;border:1px solid #cbd5e1}.t-center{text-align:center}
      .adv-highlight{background:#eff6ff;border:1.5px solid #93c5fd;padding:8px 12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;margin:10px 0}

    </style></head><body>${document.getElementById('a4DocSheet').innerHTML}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 400);
  }

  function shareWhatsApp() {
    const biz = document.getElementById('in_biz').value.trim() || 'Security Agency';
    if (mode === 'ROSTER') {
      const site = document.getElementById('in_site').value.trim() || 'Site';
      const lines = guards.map((g, i) => `${i+1}. *${g.name}* - ${g.post} (${g.shift})`).join('\n');
      const msg = `*🛡️ DUTY ROSTER (${document.getElementById('in_ros_date').value})*\n*Agency:* ${biz}\n*Site:* ${site}\n\n${lines}\n\n_Generated via KaamKaj Bills._`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    } else {
      const staff = document.getElementById('in_staff_name').value.trim() || 'Staff';
      const amt = document.getElementById('in_adv_amt').value || 0;
      const ph = document.getElementById('in_staff_ph').value.trim().replace(/[^0-9]/g, '');
      const msg = `*💵 STAFF ADVANCE VOUCHER (${document.getElementById('in_adv_no').value})*\n*Firm:* ${biz}\n*Staff:* ${staff}\n*Advance Paid:* ₹${amt}\n\n_Generated via KaamKaj Bills._`;
      window.open(ph ? `https://wa.me/91${ph}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }
  }

  window.onload = () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('in_ros_date').value = today;
    document.getElementById('in_adv_date').value = today;
    document.getElementById('in_ros_no').value = 'RST-' + Math.floor(100000 + Math.random() * 899990);
    document.getElementById('in_adv_no').value = 'ADV-' + Math.floor(100000 + Math.random() * 899990);
    renderGuardRows();
    renderDoc();
  };
</script>
