  .btn-max-fill{background:#16a34a;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:11.5px;font-weight:800;cursor:pointer}

        <div class="slider-row"><div class="slider-row-head"><span data-i18n="moveHorizontal">↔️ Left / Right Position</span><b id="lblX">0%</b></div><div class="slider-ctrl"><button type="button" class="btn-step" title="Move Left" data-i18n-title="moveLeft" onclick="nudgeSlider('rngX',-3)">−</button><input type="range" id="rngX" min="-100" max="100" value="0" oninput="updateCrop()"><button type="button" class="btn-step" title="Move Right" data-i18n-title="moveRight" onclick="nudgeSlider('rngX',3)">+</button></div></div>

        <div class="crop-btn-row"><button type="button" class="btn-reset-crop" onclick="fitWholeImage()" data-i18n="fitPhoto">🖼️ Fit Full Photo (Zoom Out)</button><button type="button" class="btn-reset-crop" onclick="resetCrop()" data-i18n="resetCrop">↺ Reset 100%</button></div>
      </div>
    </div>

    <div class="section-badge" data-i18n="paperSection">2. Paper Size, Photo Size & Copies</div>
    <div class="grid-3">
      <div class="field"><label data-i18n="paperSize">Paper Size (पेपर)</label><select id="selPaper" onchange="onPaperOrSizeChange()"><option value="A4" data-i18n="paperA4">A4 Sheet (210 × 297 mm)</option><option value="4X6" data-i18n="paper4x6">4 × 6 Inch (101.6 × 152.4 mm)</option><option value="5X7" data-i18n="paper5x7">5 × 7 Inch (127 × 177.8 mm)</option></select></div>

    <div class="grid-2">
      <div class="field"><label data-i18n="cutBorder">Cut Border Style</label><select id="selBorder" onchange="renderSheet()"><option value="1px solid #0f172a" data-i18n="thinBorder">Thin Black Border (Cut Line)</option><option value="1px dashed #64748b" data-i18n="dashedBorder">Dashed Cut Line</option><option value="none" data-i18n="noBorder">No Border</option></select></div>

    </div>
    <div class="actions"><button type="button" class="btn btn-pdf" id="btnPdf" onclick="downloadSheetPDF()" data-i18n="downloadPdf">📥 Download Print-Ready PDF</button><button type="button" class="btn btn-print" onclick="printSheetDirect()" data-i18n="directPrint">🖨️ Direct Photo Print</button></div>
  </div>

  <div class="preview-panel"><div class="preview-label" id="sheetTitle">Live Print Sheet Preview</div><div class="preview-viewport"><div id="printSheetWrap"><div class="photo-sheet" id="photoSheet"></div></div></div></div>
</div>

function changeLanguage(lang){currentLang=LANGS[lang]?lang:'hi';applyLanguage();try{localStorage.setItem('kkb_photo_lang',currentLang)}catch(e){}}
function applyLanguage(){
  const dict=LANGS[currentLang]||LANGS.hi;
  document.documentElement.lang=currentLang;document.documentElement.dir=currentLang==='ur'?'rtl':'ltr';document.body.dir=currentLang==='ur'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.getAttribute('data-i18n');if(dict[key]!==undefined)el.textContent=dict[key];});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{const key=el.getAttribute('data-i18n-title');if(dict[key]!==undefined)el.title=dict[key];});
  document.getElementById('btnDark').textContent=document.body.classList.contains('dark-mode')?t('lightMode'):t('darkMode');
  document.getElementById('selLanguage').value=currentLang;
  populateCopyOptions(true);renderSheet();
}
const DEFAULT_SVG='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="350" height="450" viewBox="0 0 350 450"><rect width="350" height="450" fill="#e2e8f0"/><circle cx="175" cy="155" r="68" fill="#64748b"/><path d="M62 420 C62 325 288 325 288 420 Z" fill="#64748b"/></svg>');
let sourceImg=new Image();sourceImg.crossOrigin='anonymous';let croppedDataUrl='';let fillBg='#ffffff';let zoom=1,offX=0,offY=0;
function toggleDarkMode(){const isDark=document.body.classList.toggle('dark-mode');document.getElementById('btnDark').textContent=isDark?t('lightMode'):t('darkMode');try{localStorage.setItem('kkb_photo_theme',isDark?'dark':'light')}catch(e){}}
function nudgeSlider(id,delta){const el=document.getElementById(id);const min=parseInt(el.min,10),max=parseInt(el.max,10);el.value=Math.min(max,Math.max(min,(parseInt(el.value,10)||0)+delta));updateCrop();}
function getLayoutMetrics(){const pKey=document.getElementById('selPaper').value,sKey=document.getElementById('selSize').value,paper=PAPERS[pKey],pSize=PHOTO_SIZES[sKey];const usableW=paper.w-paper.margin*2,usableH=paper.h-paper.margin*2;const cols=Math.max(1,Math.floor((usableW+paper.gap)/(pSize.w+paper.gap)));const rows=Math.max(1,Math.floor((usableH+paper.gap)/(pSize.h+paper.gap)));return{pKey,sKey,paper,pSize,cols,rows,maxFit:cols*rows};}
function paperLabel(key){return t(key==='A4'?'paperA4':key==='4X6'?'paper4x6':'paper5x7').split(' (')[0];}
function photoLabel(key){return t(key==='PASSPORT'?'passport':key==='VISA'?'visa':'stamp').split(' (')[0];}
function populateCopyOptions(preserveCurrent=false){const{pKey,paper,pSize,cols,rows,maxFit}=getLayoutMetrics();const sel=document.getElementById('selCount'),prev=parseInt(sel.value,10);sel.innerHTML='';for(let i=1;i<=maxFit;i++){const option=document.createElement('option');option.value=String(i);option.textContent=`${i} ${i===1?t('photoOne'):t('photoMany')}${i===maxFit?' '+t('maxFull'):''}`;sel.appendChild(option);}sel.value=String(preserveCurrent&&prev>=1&&prev<=maxFit?prev:maxFit);document.getElementById('capText').textContent=`${t('maxOn')} ${paperLabel(pKey)}: ${maxFit} ${photoLabel(document.getElementById('selSize').value)} ${t('photoMany')} (${cols} ${t('cols')} × ${rows} ${t('rows')})`;}
function fillMaxCopies(){document.getElementById('selCount').value=String(getLayoutMetrics().maxFit);renderSheet();}
function bakeCroppedImage(){if(!sourceImg.complete||!sourceImg.naturalWidth)return;const{pSize}=getLayoutMetrics(),targetAspect=pSize.w/pSize.h,outW=Math.round(pSize.w/25.4*300),outH=Math.round(pSize.h/25.4*300);const canvas=document.createElement('canvas');canvas.width=outW;canvas.height=outH;const ctx=canvas.getContext('2d');ctx.fillStyle=fillBg;ctx.fillRect(0,0,outW,outH);const srcW=sourceImg.naturalWidth,srcH=sourceImg.naturalHeight,srcAspect=srcW/srcH;let drawW,drawH;if(srcAspect>targetAspect){drawH=outH;drawW=outH*srcAspect}else{drawW=outW;drawH=outW/srcAspect}drawW*=zoom;drawH*=zoom;const dx=(outW-drawW)/2+(offX/100)*outW,dy=(outH-drawH)/2+(offY/100)*outH;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(sourceImg,dx,dy,drawW,drawH);croppedDataUrl=canvas.toDataURL('image/jpeg',.96);const cropBox=document.getElementById('cropBox');cropBox.style.width='112px';cropBox.style.height=Math.round(112/targetAspect)+'px';cropBox.style.backgroundColor=fillBg;document.getElementById('cropPreviewImg').src=croppedDataUrl;}
function handlePhoto(e){const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert(t('selectPhoto'));e.target.value='';return;}const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{sourceImg=img;resetCrop();};img.onerror=()=>alert(t('noImage'));img.src=ev.target.result;};reader.onerror=()=>alert(t('noImage'));reader.readAsDataURL(file);}
function setBg(color,btn){fillBg=color;document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));btn.classList.add('active');bakeCroppedImage();renderSheet();}
function fitWholeImage(){if(!sourceImg.complete||!sourceImg.naturalWidth)return;const{pSize}=getLayoutMetrics(),targetAspect=pSize.w/pSize.h,srcAspect=sourceImg.naturalWidth/sourceImg.naturalHeight;let pct=100;if(srcAspect>targetAspect)pct=Math.round(targetAspect/srcAspect*100);else pct=Math.round(srcAspect/targetAspect*100);document.getElementById('rngZoom').value=Math.max(30,Math.min(100,pct));document.getElementById('rngX').value=0;document.getElementById('rngY').value=0;updateCrop();}
function resetCrop(){document.getElementById('rngZoom').value=100;document.getElementById('rngX').value=0;document.getElementById('rngY').value=0;updateCrop();}
function updateCrop(){const raw=parseInt(document.getElementById('rngZoom').value,10)||100;zoom=raw/100;offX=parseInt(document.getElementById('rngX').value,10)||0;offY=parseInt(document.getElementById('rngY').value,10)||0;const diff=raw-100;document.getElementById('lblZoom').textContent=`${raw}% (${diff>0?'+':''}${diff}%)`;document.getElementById('lblX').textContent=`${offX>0?'+':''}${offX}%`;document.getElementById('lblY').textContent=`${offY>0?'+':''}${offY}%`;bakeCroppedImage();renderSheet();}
function onPaperOrSizeChange(){populateCopyOptions(false);bakeCroppedImage();renderSheet();}
function renderSheet(){const{pKey,paper,pSize,cols,maxFit}=getLayoutMetrics();let count=parseInt(document.getElementById('selCount').value,10)||maxFit;if(count>maxFit)count=maxFit;const border=document.getElementById('selBorder').value,PX_PER_MM=2.45,sheetW=Math.round(paper.w*PX_PER_MM),sheetH=Math.round(paper.h*PX_PER_MM),padPx=Math.round(paper.margin*PX_PER_MM),gapPx=Math.round(paper.gap*PX_PER_MM),tileW=Math.round(pSize.w*PX_PER_MM),tileH=Math.round(pSize.h*PX_PER_MM);const sheet=document.getElementById('photoSheet');sheet.style.width=sheetW+'px';sheet.style.minHeight=sheetH+'px';sheet.style.padding=padPx+'px';sheet.style.gap=gapPx+'px';sheet.style.gridTemplateColumns=`repeat(${cols}, ${tileW}px)`;document.getElementById('sheetTitle').textContent=`${t('preview')} (${paperLabel(pKey)} • ${count} / ${maxFit} ${photoLabel(document.getElementById('selSize').value)})`;const src=croppedDataUrl||DEFAULT_SVG;let html='';for(let i=0;i<count;i++)html+=`<div class="p-tile" style="width:${tileW}px;height:${tileH}px;border:${border};background-color:${fillBg};"><img src="${src}" alt="${t('photoAlt')} ${i+1}"></div>`;sheet.innerHTML=html;}
function mmToCssPx(mm){return mm*(96/25.4);}
function makePhotoSheetForExport(){
  const {pKey,paper,pSize,cols,maxFit}=getLayoutMetrics();
  let count=parseInt(document.getElementById('selCount').value,10)||maxFit;
  if(count>maxFit)count=maxFit;

  const pxPerMm=96/25.4;
  const pageW=Math.round(paper.w*pxPerMm);
  const pageH=Math.round(paper.h*pxPerMm);
  const pad=Math.round(paper.margin*pxPerMm);
  const gap=Math.round(paper.gap*pxPerMm);
  const tileW=Math.round(pSize.w*pxPerMm);
  const tileH=Math.round(pSize.h*pxPerMm);
  const border=document.getElementById('selBorder').value;
  const src=croppedDataUrl||DEFAULT_SVG;

  const pdfSheet=document.createElement('div');
  pdfSheet.style.cssText=[
    `width:${pageW}px`,
    `height:${pageH}px`,
    `min-width:${pageW}px`,
    `max-width:${pageW}px`,
    `padding:${pad}px`,
    'margin:0',
    'border:0',
    'background:#ffffff',
    'display:grid',
    `grid-template-columns:repeat(${cols},${tileW}px)`,
    `grid-auto-rows:${tileH}px`,
    `gap:${gap}px`,
    'justify-content:start',
    'align-content:start',
    'box-sizing:border-box',
    'overflow:hidden'
  ].join(';');

  for(let i=0;i<count;i++){
    const tile=document.createElement('div');
    tile.style.cssText=[
      `width:${tileW}px`,
      `height:${tileH}px`,
      `border:${border}`,
      `background:${fillBg}`,
      'overflow:hidden',
      'box-sizing:border-box',
      'margin:0',
      'padding:0'
    ].join(';');
    const img=document.createElement('img');
    img.src=src;
    img.alt='';
    img.style.cssText='width:100%;height:100%;display:block;object-fit:fill;margin:0;padding:0;';
    tile.appendChild(img);
    pdfSheet.appendChild(tile);
  }
  return {pdfSheet,pKey,paper,pSize,count,pageW,pageH};
}

function loadPdfFallback(src){
  return new Promise(resolve=>{
    const script=document.createElement('script');
    let settled=false;
    const finish=ok=>{if(settled)return;settled=true;script.onload=null;script.onerror=null;resolve(ok);};
    script.src=src;
    script.onload=()=>finish(typeof html2pdf==='function');
    script.onerror=()=>finish(false);
    document.head.appendChild(script);
    setTimeout(()=>finish(typeof html2pdf==='function'),12000);
  });
}

async function ensurePdfLibrary(){
  if(typeof html2pdf==='function')return true;
  const fallbacks=[
    'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js',
    'https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'
  ];
  for(const src of fallbacks){
    if(await loadPdfFallback(src))return true;
  }
  return typeof html2pdf==='function';
}

async function downloadSheetPDF(){
  const btn=document.getElementById('btnPdf');
  const originalText=t('downloadPdf');
  const savedX=window.scrollX||0;
  const savedY=window.scrollY||0;
  let overlay=null;
  let objectUrl=null;

  btn.disabled=true;
  btn.textContent=t('generating');

  try{
    const libraryReady=await ensurePdfLibrary();
    if(!libraryReady)throw new Error('PDF library could not be loaded from the available CDNs.');

    const {pdfSheet,pKey,paper,count,pageW,pageH}=makePhotoSheetForExport();
    const paperKey=pKey==='A4'?'A4':pKey==='4X6'?'4x6':'5x7';
    const formatSpec=pKey==='A4'?'a4':[paper.w,paper.h];
    const filename=`PhotoSheet_${paperKey}_${count}Photos.pdf`;

    // Use the proven visible overlay + relative staging export pattern.
    // The export canvas dimensions are fixed in CSS pixels, derived from the
    // selected paper's physical millimetre dimensions (96 CSS px per inch).
    overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;background:#ffffff;z-index:2147483647;overflow:auto;margin:0;padding:0;';

    const staging=document.createElement('div');
    staging.style.cssText=`position:relative;top:0;left:0;width:${pageW}px;height:${pageH}px;min-width:${pageW}px;margin:0;padding:0;background:#ffffff;overflow:hidden;box-sizing:border-box;`;
    staging.appendChild(pdfSheet);
    overlay.appendChild(staging);
    document.body.appendChild(overlay);

    // Wait until the browser has laid out the export surface and decoded every photo.
    await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,180)));
    const images=[...staging.querySelectorAll('img')];
    await Promise.all(images.map(img=>{
      if(img.complete&&img.naturalWidth>0)return Promise.resolve();
      if(typeof img.decode==='function')return img.decode();
      return new Promise((resolve,reject)=>{
        img.onload=resolve;
        img.onerror=()=>reject(new Error('A photo could not be decoded for the PDF.'));
      });
    }));

    const options={
      margin:[0,0,0,0],
      filename,
      image:{type:'png',quality:1.0},
      html2canvas:{
        scale:3,
        useCORS:true,
        allowTaint:false,
        backgroundColor:'#ffffff',
        letterRendering:true,
        scrollX:0,
        scrollY:0,
        x:0,
        y:0,
        width:pageW,
        height:pageH,
        windowWidth:pageW,
        windowHeight:pageH
      },
      jsPDF:{unit:'mm',format:formatSpec,orientation:'portrait',compress:true}
    };

    // Build the PDF first, then trigger a normal Blob download. This is more
    // reliable than relying on the html2pdf worker's built-in save wrapper.
    const pdf=await html2pdf().set(options).from(staging).toPdf().get('pdf');
    const blob=pdf.output('blob');
    if(!(blob instanceof Blob)||blob.size<1000)throw new Error('The generated PDF is empty.');

    objectUrl=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=objectUrl;
    link.download=filename;
    link.style.display='none';
    document.body.appendChild(link);
    link.click();
    link.remove();

    // Keep the Blob URL alive briefly while the browser starts the download.
    setTimeout(()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);},60000);
    objectUrl=null;
  }catch(err){
    console.error('Photo sheet PDF download failed:',err);
    alert('PDF डाउनलोड नहीं हो पाया। कृपया इंटरनेट कनेक्शन जाँचें और दोबारा प्रयास करें। यदि समस्या बनी रहे, तो Direct Photo Print बटन से Print → Save as PDF चुनें।');
  }finally{
    if(overlay)overlay.remove();
    if(objectUrl)URL.revokeObjectURL(objectUrl);
    window.scrollTo(savedX,savedY);
    btn.disabled=false;
    btn.textContent=originalText;
  }
}
function printSheetDirect(){const{paper,pSize,cols,maxFit,pKey}=getLayoutMetrics();let count=parseInt(document.getElementById('selCount').value,10)||maxFit;if(count>maxFit)count=maxFit;const border=document.getElementById('selBorder').value,src=croppedDataUrl||DEFAULT_SVG;let tiles='';for(let i=0;i<count;i++)tiles+=`<div class="tile"><img src="${src}" alt=""></div>`;const w=window.open('','_blank','width=850,height=900');if(!w){alert('Please allow pop-ups to print the photo sheet.');return;}w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${t('printTitle')} (${paperLabel(pKey)})</title><style>@page{size:${paper.w}mm ${paper.h}mm;margin:0mm}*{box-sizing:border-box}html,body{margin:0;padding:0}body{width:${paper.w}mm;height:${paper.h}mm;padding:${paper.margin}mm;background:#fff;display:grid;grid-template-columns:repeat(${cols},${pSize.w}mm);gap:${paper.gap}mm;justify-content:start;align-content:start;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.tile{width:${pSize.w}mm;height:${pSize.h}mm;border:${border};background:${fillBg};overflow:hidden}.tile img{width:100%;height:100%;display:block}</style></head><body>${tiles}</body></html>`);w.document.close();w.focus();setTimeout(()=>{w.print();w.close();},450);}
window.onload=()=>{try{if(localStorage.getItem('kkb_photo_theme')==='dark')document.body.classList.add('dark-mode');const savedLang=localStorage.getItem('kkb_photo_lang');if(savedLang&&LANGS[savedLang])currentLang=savedLang;}catch(e){}document.getElementById('selLanguage').value=currentLang;applyLanguage();sourceImg.onload=()=>{bakeCroppedImage();renderSheet();};sourceImg.onerror=()=>renderSheet();sourceImg.src=DEFAULT_SVG;};
</script>
