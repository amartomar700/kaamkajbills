<script>
  let docMode = 'RECEIPT';
  let copyCount = 1;

  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('btnTheme').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    try { localStorage.setItem('kkb_rent_theme', isDark ? 'dark' : 'light'); } catch (e) {}
  }

  function setDocMode(mode) {
    docMode = mode;
    document.getElementById('btnModeReceipt').className = mode === 'RECEIPT' ? 'toggle-btn active' : 'toggle-btn';
    document.getElementById('btnModeAgreement').className = mode === 'AGREEMENT' ? 'toggle-btn active-gold' : 'toggle-btn';

    document.getElementById('receiptCopyOption').style.display = mode === 'RECEIPT' ? 'block' : 'none';
    document.getElementById('receiptPayFields').style.display = mode === 'RECEIPT' ? 'grid' : 'none';
    document.getElementById('boxElec').style.display = mode === 'RECEIPT' ? 'flex' : 'none';
    document.getElementById('agreementFields').style.display = mode === 'AGREEMENT' ? 'block' : 'none';

    document.getElementById('lblDocNo').innerText = mode === 'RECEIPT' ? 'Receipt No.' : 'Agreement No.';
    document.getElementById('lblMonthOrStart').innerText = mode === 'RECEIPT' ? 'Rent Month / Period' : 'Start Date (कब से लागू)';
    document.getElementById('previewTitleLabel').innerText = mode === 'RECEIPT' ? 'Live A4 Rent Receipt Preview' : 'Live A4 Rent / Shop Agreement Preview';
    renderDoc();
  }

  function setCopies(n) {
    copyCount = n;
    document.getElementById('btnOne').classList.toggle('active', n === 1);
    document.getElementById('btnTwo').classList.toggle('active', n === 2);
    renderDoc();
  }

  function downloadA4PDF() {
    const clone = document.getElementById('a4DocSheet').cloneNode(true);
    clone.style.cssText = 'width:700px;margin:0 auto;padding:14px;background:#fff;border:none;box-shadow:none;';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;top:0;left:0;width:730px;z-index:999999;background:#fff;';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);
    const prefix = docMode === 'AGREEMENT' ? 'RentAgreement' : 'RentReceipt';
    html2pdf().set({
      margin: [8, 8, 8, 8],
      filename: `${prefix}_${document.getElementById('in_rec_no').value || 'Doc'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, width: 730, windowWidth: 730 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(clone).save().then(() => wrap.remove()).catch(() => wrap.remove());
  }

      .cut-divider{display:flex;align-items:center;justify-content:center;position:relative;margin:14px 0;border-top:2px dashed #94a3b8}
      .cut-tag{position:absolute;top:-10px;background:#fff;padding:0 8px;font-size:10px;font-weight:700;color:#64748b}
      .agr-doc{border:2px solid #0f172a;padding:18px 20px}
      .agr-stamp-space{border:1px dashed #94a3b8;background:#f8fafc;text-align:center;padding:8px;font-size:10px;font-weight:700;color:#64748b;margin-bottom:12px}
      .agr-title{text-align:center;font-size:17px;font-weight:900;text-transform:uppercase;text-decoration:underline;margin:0 0 10px 0}
      .agr-intro{font-size:11.5px;line-height:1.65;margin-bottom:10px}
      .agr-clauses{margin:8px 0 14px 18px;padding:0;font-size:11.2px;line-height:1.6}
      .agr-clauses li{margin-bottom:5px;page-break-inside:avoid}
      .agr-sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:26px;font-size:11px;page-break-inside:avoid}
      .agr-sig-box{border-top:1.5px solid #0f172a;padding-top:5px;text-align:center;font-weight:800}
    </style></head><body class="${document.getElementById('a4DocSheet').className}">${document.getElementById('a4DocSheet').innerHTML}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 500);
  }

  function shareWhatsApp() {
    const tenant = document.getElementById('in_tenant').value.trim() || 'Tenant';
    const month = document.getElementById('in_month').value.trim() || 'Current Month';
    const rent = (parseFloat(document.getElementById('in_rent').value)||0) + (parseFloat(document.getElementById('in_elec').value)||0) + (parseFloat(document.getElementById('in_maint').value)||0);
    const ph = document.getElementById('in_tenant_ph').value.trim().replace(/[^0-9]/g, '');
    const title = docMode === 'AGREEMENT' ? 'RENT / SHOP AGREEMENT' : 'RENT RECEIPT';
    const msg = `*🏠 ${title} (${document.getElementById('in_rec_no').value})*\n*Tenant:* ${tenant}\n*Period/Start:* ${month}\n*Monthly Rent:* ₹${rent.toLocaleString('en-IN')}\n\n_Generated via KaamKaj Bills._`;
    window.open(ph ? `https://wa.me/91${ph}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }

  window.onload = () => {
    try {
      if (localStorage.getItem('kkb_rent_theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('btnTheme').innerText = '☀️ Light Mode';
      }
    } catch (e) {}
    document.getElementById('in_date').value = new Date().toISOString().split('T')[0];
    document.getElementById('in_rec_no').value = 'RNT-' + Math.floor(100000 + Math.random() * 899990);
    renderDoc();
  };
</script>
