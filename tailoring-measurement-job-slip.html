<!DOCTYPE html>
<html lang="hi" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Tailoring & Boutique Measurement Job Slip - KaamKaj Bills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  color-scheme: light;
  --primary:#7c3aed; --primary-dark:#5b21b6; --primary-soft:#ede9fe;
  --ink:#0f172a; --ink-muted:#475569; --border:#cbd5e1;
  --page:#f1f5f9; --card:#ffffff; --field:#f8fafc; --field-focus:#ffffff;
  --nav:#111827; --soft:#f1f5f9; --shadow:0 8px 28px rgba(15,23,42,.07);
  --danger:#dc2626;
}
html[data-theme="dark"] {
  color-scheme:dark;
  --ink:#e5e7eb; --ink-muted:#aab6c7; --border:#334155;
  --page:#0b1120; --card:#151f31; --field:#0f172a; --field-focus:#111c2f;
  --nav:#080e1a; --soft:#1e293b; --shadow:0 8px 28px rgba(0,0,0,.24);
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
html,body{margin:0!important;padding:0!important;width:100%;min-height:100%;background:var(--page);color:var(--ink);overflow-x:hidden}
body{min-height:100vh}
button,input,select{font:inherit}
.top-nav{position:sticky;top:0;z-index:50;background:var(--nav);color:#fff;border-bottom:3px solid #f59e0b;padding:10px clamp(12px,2vw,28px);box-shadow:0 5px 18px rgba(0,0,0,.12)}
.nav-inner{width:100%;display:grid;grid-template-columns:auto minmax(180px,1fr) auto;align-items:center;gap:16px}
.btn-home{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font-size:13px;font-weight:750;white-space:nowrap}
.btn-home:hover{background:var(--primary)}
.nav-title{font-size:clamp(14px,1.35vw,18px);font-weight:850;letter-spacing:.2px;text-align:center;line-height:1.3}
.nav-controls{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.lang-control{display:flex;align-items:center;gap:7px;color:#e5e7eb;font-size:12px;font-weight:750;white-space:nowrap}
.lang-control select{width:auto;min-width:138px;max-width:180px;min-height:40px;padding:7px 30px 7px 10px;border:1px solid rgba(255,255,255,.25);border-radius:9px;background:#1f2937;color:#fff;font-size:13px;outline:none}
.theme-control{display:flex;align-items:center;gap:8px;color:#f8fafc;font-size:12px;font-weight:700}
.theme-hint{max-width:150px;line-height:1.25;color:#cbd5e1}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 12px;border:1px solid rgba(255,255,255,.26);border-radius:9px;background:#293548;color:#fff;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.theme-btn:hover{background:#394a63}
.kb-wrapper{width:100%;max-width:none;margin:0;padding:clamp(12px,1.8vw,26px);display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:clamp(14px,1.8vw,26px);align-items:start}
.control-box{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(15px,1.7vw,24px);box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-width:0}
label{font-size:11px;font-weight:800;color:var(--ink-muted);letter-spacing:.25px;line-height:1.35}
input,select,textarea{width:100%;min-width:0;min-height:43px;padding:10px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;outline:none;color:var(--ink);background:var(--field);transition:border-color .18s,box-shadow .18s,background .18s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:var(--field-focus);box-shadow:0 0 0 3px rgba(124,58,237,.16)}
input[readonly]{background:var(--soft)!important;color:var(--danger)!important;font-weight:850}
.section-badge{display:flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary-dark);font-size:12px;font-weight:850;padding:9px 12px;border-radius:9px;margin:18px 0 13px;border-left:4px solid var(--primary);line-height:1.35}
html[dir="rtl"] .section-badge{border-left:0;border-right:4px solid var(--primary)}
.section-badge:first-of-type{margin-top:0}
.form-intro{margin:0 0 10px;color:var(--ink-muted);font-size:13px;font-weight:700}
.toggle-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 15px;background:var(--soft);border:1px solid var(--border);padding:5px;border-radius:11px}
.toggle-btn{min-height:44px;padding:10px;border:0;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;background:transparent;color:var(--ink-muted);transition:.2s}
.toggle-btn.active{background:var(--primary);color:#fff;box-shadow:0 3px 9px rgba(124,58,237,.24)}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.btn{min-width:0;min-height:48px;padding:12px 10px;border:0;border-radius:10px;font-size:13px;font-weight:850;color:#fff;cursor:pointer;text-align:center;box-shadow:0 4px 11px rgba(0,0,0,.1);transition:transform .18s,filter .18s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-pdf{background:linear-gradient(135deg,#7c3aed,#5b21b6)}
.btn-print{background:linear-gradient(135deg,#334155,#0f172a)}
.btn-wa{background:linear-gradient(135deg,#16a34a,#15803d)}
.preview-panel{position:sticky;top:86px;width:100%;min-width:0}
.preview-label{text-align:center;font-size:12px;font-weight:850;color:var(--ink-muted);letter-spacing:.5px;margin:2px 0 11px}
#a4DocSheet{background:#fff;color:#0f172a;width:100%;max-width:100%;padding:clamp(10px,1.4vw,20px);border:1px solid #cbd5e1;box-shadow:0 10px 30px rgba(15,23,42,.1);border-radius:10px;box-sizing:border-box;overflow:hidden}
.slip-box{border:1.5px solid #0f172a;border-radius:8px;padding:clamp(8px,1.1vw,14px);background:#fff;color:#0f172a}
.slip-header{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid #0f172a;padding-bottom:7px;margin-bottom:9px}
.slip-header h2{margin:0;font-size:clamp(12px,1.2vw,16px);font-weight:850;color:#0f172a;text-transform:uppercase;overflow-wrap:anywhere}
.slip-header p{margin:3px 0 0;font-size:clamp(8px,.8vw,10px);color:#64748b;overflow-wrap:anywhere}
.slip-badge{background:#7c3aed;color:#fff;padding:4px 8px;font-size:clamp(7px,.78vw,10px);font-weight:850;border-radius:4px;text-transform:uppercase;text-align:center;flex-shrink:0}
.slip-table{width:100%;table-layout:fixed;border-collapse:collapse;margin-bottom:8px;font-size:clamp(7px,.88vw,11px);color:#0f172a}
.slip-table td{padding:3.5px 3px;vertical-align:top;overflow-wrap:anywhere}
.slip-table td.lbl{font-weight:800;color:#475569;width:18%}
.slip-table td.val{border-bottom:1px dotted #94a3b8;font-weight:650}
.meas-grid{width:100%;table-layout:fixed;border-collapse:collapse;margin:8px 0;font-size:clamp(6px,.82vw,10.5px);border:1px solid #cbd5e1;color:#0f172a}
.meas-grid th{background:#ede9fe;color:#5b21b6;padding:clamp(2px,.35vw,4px) 1px;border:1px solid #cbd5e1;font-weight:850;text-align:center;overflow-wrap:anywhere}
.meas-grid td{padding:clamp(3px,.4vw,5px) 1px;border:1px solid #cbd5e1;text-align:center;font-weight:750;overflow-wrap:anywhere}
.amount-highlight{background:#f0fdf4;border:1.2px solid #86efac;padding:6px 9px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;font-size:clamp(8px,.9vw,11px);color:#14532d}
.amount-highlight .balance-value{color:#dc2626;font-weight:850;font-size:clamp(9px,1vw,13px);text-align:right}
.master-ticket{font-size:10.5px;font-weight:850;color:#5b21b6;margin:4px 0}
.notes-box{background:#f8fafc;border-left:3px solid #7c3aed;padding:6px 8px;font-size:clamp(8px,.86vw,10.5px);color:#334155;margin:6px 0;overflow-wrap:anywhere}
html[dir="rtl"] .notes-box{border-left:0;border-right:3px solid #7c3aed}
.footer-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:14px;font-size:clamp(8px,.82vw,10px);color:#64748b}
.sig-card{width:45%;text-align:center;border-top:1.5px dashed #475569;padding-top:4px;font-weight:750;color:#334155}
.cut-divider{display:flex;align-items:center;justify-content:center;position:relative;margin:17px 0;border-top:2px dashed #94a3b8}
.cut-tag{position:absolute;top:-10px;background:#fff;padding:0 8px;font-size:9px;font-weight:800;color:#64748b;white-space:nowrap}
@media(max-width:1050px){.kb-wrapper{grid-template-columns:minmax(0,1fr);padding:14px}.preview-panel{position:static;max-width:900px;margin:0 auto}.control-box{width:100%}#a4DocSheet{padding:14px}.slip-table{font-size:10px}.meas-grid{font-size:9px}}
@media(max-width:720px){.nav-inner{grid-template-columns:auto 1fr;gap:8px}.nav-title{grid-column:1/-1;grid-row:1;text-align:center;order:0}.btn-home{grid-column:1;grid-row:2}.nav-controls{grid-column:2;grid-row:2;justify-content:flex-end;gap:7px}.lang-control{font-size:11px}.lang-control select{min-width:112px;max-width:145px;min-height:38px;font-size:12px}.theme-control{gap:3px;flex-direction:column;align-items:flex-end}.theme-hint{display:block;max-width:112px;font-size:9px;text-align:right;line-height:1.1}.theme-btn{min-height:38px;padding:7px 9px;font-size:12px}.kb-wrapper{padding:10px;gap:12px}.control-box{padding:14px;border-radius:13px}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{grid-template-columns:1fr}.btn{min-height:46px}.preview-panel{width:100%}#a4DocSheet{padding:8px;border-radius:8px}.slip-box{padding:7px}.slip-table{font-size:8px}.meas-grid{font-size:7px}.amount-highlight{font-size:8px}.amount-highlight .balance-value{font-size:9px}}
@media(max-width:420px){.nav-inner{grid-template-columns:auto 1fr}.nav-title{font-size:13px}.btn-home{font-size:11px;padding:7px 9px}.nav-controls{gap:5px}.lang-control{gap:4px}.lang-control select{min-width:104px;max-width:118px;padding-left:7px;padding-right:20px}.theme-btn{font-size:11px;padding:6px 7px}.theme-hint{max-width:94px;font-size:8px}.grid-2,.grid-3{grid-template-columns:1fr}.toggle-bar{grid-template-columns:1fr}.slip-header h2{font-size:11px}.slip-badge{font-size:7px;padding:3px 5px}}
@media print{html,body{background:#fff!important}.top-nav,.control-box,.preview-label{display:none!important}.kb-wrapper{display:block;padding:0!important}.preview-panel{position:static!important}#a4DocSheet{border:0;box-shadow:none;border-radius:0;padding:0;width:100%}}
</style>
</head>
<body>
<header class="top-nav">
  <div class="nav-inner">
    <a href="index.html" target="_self" class="btn-home" data-i18n="allTools">← All Tools</a>
    <div class="nav-title" data-i18n="pageTitle">KaamKaj Bills • Tailoring & Boutique Slip</div>
    <div class="nav-controls">
      <label class="lang-control"><span data-i18n="languageLabel">Language</span>
        <select id="languageSelect" aria-label="Select language">
          <option value="hi">हिन्दी</option><option value="en">English</option><option value="bn">বাংলা</option>
          <option value="te">తెలుగు</option><option value="mr">मराठी</option><option value="ta">தமிழ்</option>
          <option value="gu">ગુજરાતી</option><option value="kn">ಕನ್ನಡ</option><option value="ml">മലയാളം</option>
          <option value="or">ଓଡ଼ିଆ</option><option value="pa">ਪੰਜਾਬੀ</option><option value="ur">اردو</option>
        </select>
      </label>
      <div class="theme-control">
        <span class="theme-hint" data-i18n="themeHint">मोड बदलने के लिए यहाँ क्लिक करें</span>
        <button type="button" class="theme-btn" id="themeToggle" aria-label="Change appearance"><span id="themeIcon">☀️</span><span id="themeText">Dark Mode</span></button>
      </div>
    </div>
  </div>
</header>

<main class="kb-wrapper">
  <section class="control-box">
    <p class="form-intro" data-i18n="layoutHeading">A4 Print Layout – Choose Slip Format</p>
    <div class="toggle-bar">
      <button type="button" class="toggle-btn active" id="btnOne" onclick="setCopies(1)" data-i18n="oneSlip">📄 1 Slip (Customer Receipt)</button>
      <button type="button" class="toggle-btn" id="btnTwo" onclick="setCopies(2)" data-i18n="twoSlips">✂️ 2 Slips (Customer + Master Cutting)</button>
    </div>

    <div class="section-badge" data-i18n="sectionShop">1. Tailor Shop / Boutique Details</div>
    <div class="grid-2">
      <div class="field"><label for="in_shop" data-i18n="shopName">Tailor / Boutique Name</label><input type="text" id="in_shop" placeholder="उदा. Royal Mens & Ladies Tailor / Boutique" data-i18n-placeholder="shopPlaceholder" oninput="renderDoc()"></div>
      <div class="field"><label for="in_addr" data-i18n="address">Address & Mobile No.</label><input type="text" id="in_addr" placeholder="उदा. Main Market, City | Mob: 98XXXXXXXX" data-i18n-placeholder="addressPlaceholder" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge" data-i18n="sectionCustomer">2. Customer & Delivery Details</div>
    <div class="grid-3">
      <div class="field"><label for="in_ord_no" data-i18n="orderNoAuto">Order / Bill No. (Auto)</label><input type="text" id="in_ord_no" oninput="renderDoc()"></div>
      <div class="field"><label for="in_date" data-i18n="orderDate">Order Date</label><input type="date" id="in_date" oninput="renderDoc()"></div>
      <div class="field"><label for="in_deliv" data-i18n="deliveryDate">Delivery Date</label><input type="date" id="in_deliv" oninput="renderDoc()"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label for="in_cust" data-i18n="customerName">Customer Name</label><input type="text" id="in_cust" placeholder="उदा. Anand Joshi" data-i18n-placeholder="customerPlaceholder" oninput="renderDoc()"></div>
      <div class="field"><label for="in_phone" data-i18n="mobileWhatsapp">Mobile / WhatsApp No.</label><input type="tel" id="in_phone" inputmode="tel" placeholder="उदा. 9876543210" data-i18n-placeholder="mobilePlaceholder" oninput="renderDoc()"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label for="in_outfit" data-i18n="garmentDetails">Garment / Outfit Details</label><input type="text" id="in_outfit" placeholder="उदा. 2 Shirt + 2 Pant / Bridal Blouse & Lehenga" data-i18n-placeholder="garmentPlaceholder" oninput="renderDoc()"></div>
      <div class="field"><label for="in_style" data-i18n="fittingStyle">Fitting Style / Pattern</label><input type="text" id="in_style" placeholder="उदा. Slim Fit / Collar Cut / Back Zip" data-i18n-placeholder="fittingPlaceholder" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge" data-i18n="sectionMeasurements">3. Measurements in Inches</div>
    <div class="grid-4">
      <div class="field"><label for="m_len" data-i18n="length">Length</label><input type="text" id="m_len" placeholder="28.5" oninput="renderDoc()"></div>
      <div class="field"><label for="m_chest" data-i18n="chest">Chest / Bust</label><input type="text" id="m_chest" placeholder="38" oninput="renderDoc()"></div>
      <div class="field"><label for="m_waist" data-i18n="waist">Waist</label><input type="text" id="m_waist" placeholder="32" oninput="renderDoc()"></div>
      <div class="field"><label for="m_hip" data-i18n="hip">Hip / Seat</label><input type="text" id="m_hip" placeholder="39" oninput="renderDoc()"></div>
      <div class="field"><label for="m_shld" data-i18n="shoulder">Shoulder</label><input type="text" id="m_shld" placeholder="17.5" oninput="renderDoc()"></div>
      <div class="field"><label for="m_slv" data-i18n="sleeve">Sleeve</label><input type="text" id="m_slv" placeholder="24" oninput="renderDoc()"></div>
      <div class="field"><label for="m_neck" data-i18n="neck">Neck / Collar</label><input type="text" id="m_neck" placeholder="15.5" oninput="renderDoc()"></div>
      <div class="field"><label for="m_bot" data-i18n="bottom">Bottom / Hem</label><input type="text" id="m_bot" placeholder="14" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge" data-i18n="sectionCharges">4. Stitching Charges & Instructions</div>
    <div class="grid-3">
      <div class="field"><label for="in_tot" data-i18n="totalCharge">Total Stitching Charge (₹)</label><input type="number" id="in_tot" min="0" step="0.01" placeholder="1600" oninput="calcBal()"></div>
      <div class="field"><label for="in_adv" data-i18n="advancePaid">Advance Paid (₹)</label><input type="number" id="in_adv" min="0" step="0.01" placeholder="600" oninput="calcBal()"></div>
      <div class="field"><label for="in_bal" data-i18n="balanceDue">Balance Due (₹)</label><input type="number" id="in_bal" readonly style="font-weight:850;"></div>
    </div>
    <div class="field"><label for="in_notes" data-i18n="specialNotes">Special Tailor / Master Notes</label><input type="text" id="in_notes" placeholder="उदा. डिलीवरी लेते समय यह पर्ची लाना अनिवार्य है। कपड़ा अंदर से मार्जिन रखें।" data-i18n-placeholder="notesPlaceholder" oninput="renderDoc()"></div>

    <div class="actions">
      <button type="button" class="btn btn-pdf" onclick="downloadA4PDF()" data-i18n="downloadPdf">📥 Download A4 PDF</button>
      <button type="button" class="btn btn-print" onclick="printDocDirect()" data-i18n="directPrint">🖨️ Direct Print</button>
      <button type="button" class="btn btn-wa" onclick="shareWhatsApp()" data-i18n="whatsappSlip">📲 WhatsApp Slip</button>
    </div>
  </section>

  <section class="preview-panel">
    <div class="preview-label" data-i18n="livePreview">LIVE TAILORING SLIP PREVIEW</div>
    <div id="a4DocSheet"><div id="slipsContainer"></div></div>
  </section>
</main>

$('languageSelect').addEventListener('change',e=>applyLanguage(e.target.value));
$('themeToggle').addEventListener('click',()=>applyTheme(currentTheme === 'dark' ? 'light' : 'dark'));

function setCopies(n){
  copyCount = n;
  $('btnOne').classList.toggle('active',n===1);
  $('btnTwo').classList.toggle('active',n===2);
  $('btnOne').setAttribute('aria-pressed',String(n===1));
  $('btnTwo').setAttribute('aria-pressed',String(n===2));
  renderDoc();
}
function calcBal(){
  const total = parseFloat($('in_tot').value)||0;
  const advance = parseFloat($('in_adv').value)||0;
  $('in_bal').value = Math.max(0,total-advance).toFixed(2).replace(/\.00$/,'');
  renderDoc();
}
function renderDoc(){
  const shop = escapeHTML($('in_shop').value.trim()||t('defaultShop'));
  const addr = escapeHTML($('in_addr').value.trim()||t('defaultAddress'));
  const ord = escapeHTML($('in_ord_no').value.trim()||'-');
  const dt = escapeHTML($('in_date').value||'-');
  const dlv = escapeHTML($('in_deliv').value||'-');
  const cust = escapeHTML($('in_cust').value.trim()||'-');
  const ph = escapeHTML($('in_phone').value.trim());
  const outfit = escapeHTML($('in_outfit').value.trim()||'-');
  const style = escapeHTML($('in_style').value.trim()||t('standardFit'));
  const notes = escapeHTML($('in_notes').value.trim()||t('defaultNotes'));
  const total = parseFloat($('in_tot').value)||0;
  const advance = parseFloat($('in_adv').value)||0;
  const balance = Math.max(0,total-advance);
  const money = value => Number(value).toLocaleString('en-IN',{maximumFractionDigits:2});
  const measurements = {
    len:escapeHTML($('m_len').value||'-'),chest:escapeHTML($('m_chest').value||'-'),
    waist:escapeHTML($('m_waist').value||'-'),hip:escapeHTML($('m_hip').value||'-'),
    shoulder:escapeHTML($('m_shld').value||'-'),sleeve:escapeHTML($('m_slv').value||'-'),
    neck:escapeHTML($('m_neck').value||'-'),bottom:escapeHTML($('m_bot').value||'-')
  };
  const buildSlip = (badge,isMaster) => `
    <div class="slip-box">
      <div class="slip-header"><div><h2>${shop}</h2><p>${addr}</p></div><div class="slip-badge">${badge}</div></div>
      <table class="slip-table">
        <tr><td class="lbl">${t('order')}</td><td class="val"><b>${ord}</b></td><td class="lbl" style="width:20%;">${t('delivery')}</td><td class="val" style="color:#dc2626;font-weight:850;">${dlv}</td></tr>
        <tr><td class="lbl">${t('customer')}</td><td class="val">${ph?`${cust} (${ph})`:cust}</td><td class="lbl" style="width:20%;">${t('orderDateLabel')}</td><td class="val">${dt}</td></tr>
        <tr><td class="lbl">${t('garments')}</td><td class="val" colspan="3"><b>${outfit}</b> (${style})</td></tr>
      </table>
      <table class="meas-grid"><thead><tr><th>${t('length')}</th><th>${t('chest')}</th><th>${t('waist')}</th><th>${t('hip')}</th><th>${t('shoulder')}</th><th>${t('sleeve')}</th><th>${t('neck')}</th><th>${t('bottom')}</th></tr></thead>
      <tbody><tr><td>${measurements.len}</td><td>${measurements.chest}</td><td>${measurements.waist}</td><td>${measurements.hip}</td><td>${measurements.shoulder}</td><td>${measurements.sleeve}</td><td>${measurements.neck}</td><td>${measurements.bottom}</td></tr></tbody></table>
      ${!isMaster?`<div class="amount-highlight"><div><b>${t('total')}</b> ₹${money(total)} | <b>${t('advance')}</b> ₹${money(advance)}</div><div class="balance-value">${t('balance')} ₹${money(balance)}</div></div>`:`<div class="master-ticket">${t('masterTicket')} ₹${money(balance)})</div>`}
      <div class="notes-box"><b>${t('instructions')}</b> ${notes}</div>
      <div class="footer-row"><div>${t('customerSign')}</div><div class="sig-card">${isMaster?t('masterSign'):t('shopSign')}</div></div>
    </div>`;
  let html = buildSlip(t('customerJobBadge'),false);
  if(copyCount===2)html += `<div class="cut-divider"><span class="cut-tag">${t('cutHere')}</span></div>`+buildSlip(t('masterBadge'),true);
  $('slipsContainer').innerHTML = html;
}

async function downloadA4PDF(){
  const btn = document.querySelector('.actions .btn-pdf');
  const originalButtonText = btn ? btn.textContent : '';
  const source = $('a4DocSheet');

  if (!source || !$('slipsContainer').innerHTML.trim()) {
    alert(t('enterSlipDetails') || 'Please enter the slip details before downloading the PDF.');
    return;
  }

  if (typeof html2pdf === 'undefined') {
    alert('PDF library is unavailable. Please check your internet connection and try again.');
    return;
  }

  if (btn) {
    btn.disabled = true;
    btn.textContent = '⏳ Generating PDF...';
  }

  // Use the same proven visible-overlay + relative-staging export method
  // as the working Stationery/Xerox billing page.
  const PDF_WIDTH = 680;
  const clone = source.cloneNode(true);
  clone.removeAttribute('id');
  clone.dir = document.documentElement.dir || 'ltr';
  const copiedContainer = clone.querySelector('#slipsContainer');
  if (copiedContainer) copiedContainer.removeAttribute('id');

  clone.style.cssText = [
    `width:${PDF_WIDTH}px`,
    `max-width:${PDF_WIDTH}px`,
    `min-width:${PDF_WIDTH}px`,
    'margin:0',
    'padding:26px 28px',
    'background:#ffffff',
    'color:#0f172a',
    'border:1.5px solid #cbd5e1',
    'border-radius:6px',
    'box-shadow:none',
    'box-sizing:border-box',
    'overflow:visible'
  ].join(';');

  // Make export type look like a desktop/A4 document even on mobile screens.
  const exportStyle = document.createElement('style');
  exportStyle.textContent = `
    .pdf-export-sheet, .pdf-export-sheet * { box-sizing:border-box !important; }
    .pdf-export-sheet .slip-box {
      width:100% !important; max-width:100% !important; height:auto !important;
      margin:0 !important; padding:14px !important; overflow:visible !important;
      border:1.5px solid #0f172a !important; border-radius:8px !important;
      background:#fff !important; color:#0f172a !important;
      break-inside:avoid !important; page-break-inside:avoid !important;
    }
    .pdf-export-sheet .slip-header { display:flex !important; justify-content:space-between !important; align-items:center !important; gap:8px !important; }
    .pdf-export-sheet .slip-header h2 { margin:0 !important; font-size:16px !important; line-height:1.25 !important; color:#0f172a !important; }
    .pdf-export-sheet .slip-header p { margin:3px 0 0 !important; font-size:10px !important; color:#64748b !important; }
    .pdf-export-sheet .slip-badge { font-size:10px !important; padding:4px 8px !important; }
    .pdf-export-sheet .slip-table { width:100% !important; table-layout:fixed !important; font-size:10px !important; border-collapse:collapse !important; }
    .pdf-export-sheet .slip-table td { padding:4px 3px !important; font-size:10px !important; }
    .pdf-export-sheet .meas-grid { width:100% !important; table-layout:fixed !important; font-size:9px !important; border-collapse:collapse !important; }
    .pdf-export-sheet .meas-grid th, .pdf-export-sheet .meas-grid td { padding:5px 2px !important; font-size:9px !important; }
    .pdf-export-sheet .amount-highlight { display:flex !important; justify-content:space-between !important; align-items:center !important; gap:8px !important; font-size:11px !important; padding:7px 10px !important; }
    .pdf-export-sheet .amount-highlight .balance-value { font-size:12px !important; }
    .pdf-export-sheet .master-ticket { font-size:10.5px !important; }
    .pdf-export-sheet .notes-box { font-size:10px !important; padding:6px 8px !important; }
    .pdf-export-sheet .footer-row { display:flex !important; font-size:10px !important; }
    .pdf-export-sheet .sig-card { font-size:10px !important; }
    .pdf-export-sheet .cut-divider { margin:17px 0 !important; }
    .pdf-export-sheet .cut-tag { font-size:9px !important; }
  `;
  clone.classList.add('pdf-export-sheet');

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#ffffff;z-index:999999;overflow:auto;margin:0;padding:0;';

  const staging = document.createElement('div');
  staging.style.cssText = `position:relative;top:0;left:0;width:${PDF_WIDTH}px;min-width:${PDF_WIDTH}px;margin:0;padding:0;background:#ffffff;color:#0f172a;`;
  staging.appendChild(clone);
  overlay.appendChild(staging);
  document.head.appendChild(exportStyle);
  document.body.appendChild(overlay);

  const orderNumber = ($('in_ord_no').value.trim() || 'Order').replace(/[^a-zA-Z0-9-_]/g, '_');
  const filename = `TailorSlip_${orderNumber}.pdf`;

  try {
    // Allow the browser to lay out the staging element before html2canvas captures it.
    await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 150)));

    await html2pdf().set({
      margin: [10, 12, 12, 12],
      filename,
      image: { type: 'png', quality: 1.0 },
      html2canvas: {
        scale: 3,
        useCORS: true,
        letterRendering: true,
        scrollX: 0,
        scrollY: 0,
        x: 0,
        y: 0,
        width: PDF_WIDTH,
        windowWidth: PDF_WIDTH,
        backgroundColor: '#ffffff'
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
    }).from(staging).save();
  } catch (error) {
    console.error('Tailoring PDF export failed:', error);
    alert('PDF generate नहीं हो पाया। कृपया दोबारा प्रयास करें या Direct Print में Save as PDF चुनें।');
  } finally {
    overlay.remove();
    exportStyle.remove();
    if (btn) {
      btn.disabled = false;
      btn.textContent = originalButtonText || t('downloadPdf');
    }
  }
}

  const w=window.open('','_blank','width=850,height=900');
  if(!w){alert('Please allow pop-ups to print this slip.');return;}
  w.document.write(`<!DOCTYPE html><html lang="${currentLanguage}" dir="${currentLanguage==='ur'?'rtl':'ltr'}"><head><meta charset="UTF-8"><title>${t('printTitle')}</title><style>
    *{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:8mm;background:#fff;color:#0f172a}
    .slip-box{border:1.5px solid #0f172a;border-radius:8px;padding:14px;margin-bottom:8px;background:#fff;page-break-inside:avoid}
    .slip-header{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid #0f172a;padding-bottom:6px;margin-bottom:8px}
    .slip-header h2{margin:0;font-size:15px}.slip-header p{margin:2px 0 0;font-size:10px;color:#64748b}.slip-badge{background:#7c3aed;color:#fff;padding:3px 8px;font-size:10px;font-weight:800;border-radius:4px}
    .slip-table{width:100%;table-layout:fixed;border-collapse:collapse;margin-bottom:6px;font-size:11px}.slip-table td{padding:3px;overflow-wrap:anywhere}.slip-table td.lbl{font-weight:700;color:#475569;width:20%}.slip-table td.val{border-bottom:1px dotted #94a3b8}
    .meas-grid{width:100%;table-layout:fixed;border-collapse:collapse;margin:6px 0;font-size:10px;border:1px solid #cbd5e1}.meas-grid th{background:#ede9fe;color:#5b21b6;padding:4px 2px;border:1px solid #cbd5e1}.meas-grid td{padding:4px 2px;border:1px solid #cbd5e1;text-align:center;font-weight:700}
    .amount-highlight{background:#f0fdf4;border:1.2px solid #86efac;padding:6px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;margin:6px 0;font-size:11px;color:#14532d}.balance-value{color:#dc2626;font-weight:800}
    .master-ticket{font-size:10.5px;font-weight:800;color:#5b21b6;margin:4px 0}.notes-box{background:#f8fafc;border-left:3px solid #7c3aed;padding:5px 8px;font-size:10px;margin:6px 0;color:#334155}.footer-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;font-size:10px;color:#64748b}.sig-card{width:44%;text-align:center;border-top:1.5px dashed #475569;padding-top:4px;font-weight:700;color:#334155}.cut-divider{display:flex;align-items:center;justify-content:center;position:relative;margin:14px 0;border-top:2px dashed #94a3b8}.cut-tag{position:absolute;top:-10px;background:#fff;padding:0 8px;font-size:10px;font-weight:700;color:#64748b}
    @page{size:A4 portrait;margin:8mm}@media print{body{padding:0}.slip-box{break-inside:avoid}}
    </style></head><body>${$('a4DocSheet').innerHTML}</body></html>`);
  w.document.close();w.focus();setTimeout(()=>{w.print();w.close();},500);
}
function shareWhatsApp(){
  const shop=$('in_shop').value.trim()||t('defaultShop');
  const customer=$('in_cust').value.trim()||t('customer');
  const delivery=$('in_deliv').value||'-';
  const balance=$('in_bal').value||0;
  const phone=$('in_phone').value.trim().replace(/[^0-9]/g,'');
  const message=`*✂️ ${t('whatsappTitle')} (${ $('in_ord_no').value })*\n*${t('shop')}* ${shop}\n*${t('customer')}* ${customer}\n*${t('deliveryDateLabel')}* ${delivery}\n*${t('balance')}* ₹${balance}\n\n_${t('generated')}_`;
  const url=phone?`https://wa.me/91${phone}?text=${encodeURIComponent(message)}`:`https://wa.me/?text=${encodeURIComponent(message)}`;
  window.open(url,'_blank');
}

window.addEventListener('DOMContentLoaded',()=>{
  let savedLanguage='hi',savedTheme='light';
  try{savedLanguage=localStorage.getItem('kk_tailor_language')||'hi';savedTheme=localStorage.getItem('kk_tailor_theme')||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');}catch(e){}
  applyTheme(savedTheme);
  const d=new Date();
  const localDate=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().split('T')[0];
  $('in_date').value=localDate;
  d.setDate(d.getDate()+5);
  const deliveryLocal=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().split('T')[0];
  $('in_deliv').value=deliveryLocal;
  $('in_ord_no').value='TLR-'+Math.floor(100000+Math.random()*899990);
  applyLanguage(savedLanguage);
  calcBal();
});
