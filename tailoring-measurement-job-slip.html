<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tailoring & Boutique Measurement Job Slip - KaamKaj Bills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --primary: #7c3aed;
    --primary-dark: #5b21b6;
    --primary-soft: #ede9fe;
    --ink: #0f172a;
    --ink-muted: #475569;
    --border: #cbd5e1;
    --bg: #f1f5f9;
    --danger: #dc2626;
  }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }

  /* Top Navigation Bar */
  .top-nav {
    background: var(--ink);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #f59e0b;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .btn-home {
    background: rgba(255,255,255,0.12);
    color: #fff;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.2s;
  }
  .btn-home:hover { background: var(--primary); border-color: var(--primary); }
  .nav-title { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }

  /* PC Full-Wide Split Grid Layout */
  .kb-wrapper {
    width: 100%;
    max-width: 100%;
    padding: 18px 24px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 24px;
    align-items: start;
  }

  /* Left Control Box */
  .control-box {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  label { font-size: 11px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.4px; }

  input, select, textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13.5px;
    outline: none;
    color: var(--ink);
    background: #f8fafc;
    transition: all 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.14);
  }

  .section-badge {
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 11.5px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 16px 0 12px 0;
    text-transform: uppercase;
    border-left: 4px solid var(--primary);
  }
  .section-badge:first-of-type { margin-top: 0; }

  .toggle-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
    background: #f1f5f9;
    border: 1px solid var(--border);
    padding: 5px;
    border-radius: 10px;
  }
  .toggle-btn {
    padding: 10px;
    border: none;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--ink-muted);
    transition: 0.2s;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 3px 8px rgba(124, 58, 237, 0.25);
  }

  /* Actions */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
  .btn {
    flex: 1;
    min-width: 140px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    transition: 0.2s;
  }
  .btn:hover { opacity: 0.93; transform: translateY(-1px); }
  .btn-pdf { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
  .btn-print { background: linear-gradient(135deg, #1e293b, #0f172a); }
  .btn-wa { background: linear-gradient(135deg, #16a34a, #15803d); }

  /* Right Sticky Preview Panel */
  .preview-panel {
    position: sticky;
    top: 72px;
    width: 100%;
  }
  .preview-label {
    text-align: center;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  #a4DocSheet {
    background: #ffffff;
    width: 100%;
    padding: 20px 18px;
    border: 1.5px solid #cbd5e1;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    border-radius: 8px;
    box-sizing: border-box;
  }

  .slip-box {
    border: 1.5px solid #0f172a;
    border-radius: 8px;
    padding: 14px;
    background: #ffffff;
  }

  .slip-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #0f172a;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .slip-header h2 { margin: 0; font-size: 16px; font-weight: 800; color: #0f172a; text-transform: uppercase; }
  .slip-header p { margin: 2px 0 0; font-size: 10px; color: #64748b; }
  .slip-badge {
    background: var(--primary);
    color: #ffffff;
    padding: 3px 9px;
    font-size: 10px;
    font-weight: 800;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .slip-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 11px; }
  .slip-table td { padding: 3.5px 3px; vertical-align: top; }
  .slip-table td.lbl { font-weight: 700; color: #475569; width: 28%; }
  .slip-table td.val { border-bottom: 1px dotted #94a3b8; font-weight: 600; color: #0f172a; }

  .meas-grid {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 10.5px;
    border: 1px solid #cbd5e1;
  }
  .meas-grid th {
    background: var(--primary-soft);
    color: var(--primary-dark);
    padding: 4px;
    border: 1px solid #cbd5e1;
    font-weight: 800;
    text-align: center;
  }
  .meas-grid td {
    padding: 5px 4px;
    border: 1px solid #cbd5e1;
    text-align: center;
    font-weight: 700;
    color: #0f172a;
  }

  .amount-highlight {
    background: #f0fdf4;
    border: 1.2px solid #86efac;
    padding: 6px 10px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
    font-size: 11px;
  }
  .notes-box { background: #f8fafc; border-left: 3px solid var(--primary); padding: 6px 8px; font-size: 10.5px; color: #334155; margin: 6px 0; }
  .footer-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; font-size: 10px; }
  .sig-card { width: 45%; text-align: center; border-top: 1.5px dashed #475569; padding-top: 4px; font-weight: 700; color: #334155; }

  .cut-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin: 16px 0;
    border-top: 2px dashed #94a3b8;
  }
  .cut-tag { position: absolute; top: -10px; background: #fff; padding: 0 8px; font-size: 10px; font-weight: 700; color: #64748b; }

  @media (max-width: 960px) {
    .kb-wrapper { grid-template-columns: 1fr; padding: 12px 8px; gap: 16px; }
    .preview-panel { position: static; }
    .top-nav { padding: 10px 12px; }
  }
  @media (max-width: 600px) {
    .toggle-bar, .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html" target="_self" class="btn-home">← All Tools</a>
  <span class="nav-title">KaamKaj Bills • Tailoring & Boutique Slip</span>
  <span style="width: 60px;"></span>
</div>

<div class="kb-wrapper">
  <!-- LEFT: FORM CONTROLS -->
  <div class="control-box">
    <div style="margin-bottom: 10px;">
      <label>1. A4 Print Layout (पर्ची लेआउट चुनें):</label>
      <div class="toggle-bar">
        <button type="button" class="toggle-btn active" id="btnOne" onclick="setCopies(1)">📄 1 Slip (Customer Receipt)</button>
        <button type="button" class="toggle-btn" id="btnTwo" onclick="setCopies(2)">✂️ 2 Slips (Customer + Master Cutting)</button>
      </div>
    </div>

    <div class="section-badge">1. Tailor Shop / Boutique Details</div>
    <div class="grid-2">
      <div class="field"><label>Tailor / Boutique Name</label><input type="text" id="in_shop" placeholder="उदा. Royal Mens & Ladies Tailor / Boutique" oninput="renderDoc()"></div>
      <div class="field"><label>Address & Mobile No.</label><input type="text" id="in_addr" placeholder="उदा. Main Market, City | Mob: 98XXXXXXXX" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge">2. Customer & Delivery Details</div>
    <div class="grid-3">
      <div class="field"><label>Order / Bill No. (Auto)</label><input type="text" id="in_ord_no" oninput="renderDoc()"></div>
      <div class="field"><label>Order Date (तारीख)</label><input type="date" id="in_date" oninput="renderDoc()"></div>
      <div class="field"><label>Delivery Date (डिलीवरी)</label><input type="date" id="in_deliv" oninput="renderDoc()"></div>
    </div>

    <div class="grid-2">
      <div class="field"><label>Customer Name (ग्राहक का नाम)</label><input type="text" id="in_cust" placeholder="उदा. Anand Joshi" oninput="renderDoc()"></div>
      <div class="field"><label>Mobile / WhatsApp No.</label><input type="text" id="in_phone" placeholder="उदा. 9876543210" oninput="renderDoc()"></div>
    </div>

    <div class="grid-2">
      <div class="field"><label>Garment / Outfit Details (कपड़े का विवरण)</label><input type="text" id="in_outfit" placeholder="उदा. 2 Shirt + 2 Pant / Bridal Blouse & Lehenga" oninput="renderDoc()"></div>
      <div class="field"><label>Fitting Style / Pattern</label><input type="text" id="in_style" placeholder="उदा. Slim Fit / Collar Cut / Back Zip" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge">3. Measurements in Inches (नाप इंच में)</div>
    <div class="grid-4">
      <div class="field"><label>Length (लंबाई)</label><input type="text" id="m_len" placeholder="28.5" oninput="renderDoc()"></div>
      <div class="field"><label>Chest / Bust (छाती)</label><input type="text" id="m_chest" placeholder="38" oninput="renderDoc()"></div>
      <div class="field"><label>Waist (कमर)</label><input type="text" id="m_waist" placeholder="32" oninput="renderDoc()"></div>
      <div class="field"><label>Hip / Seat (हिप)</label><input type="text" id="m_hip" placeholder="39" oninput="renderDoc()"></div>
      <div class="field"><label>Shoulder (तीरा)</label><input type="text" id="m_shld" placeholder="17.5" oninput="renderDoc()"></div>
      <div class="field"><label>Sleeve (आस्तीन)</label><input type="text" id="m_slv" placeholder="24" oninput="renderDoc()"></div>
      <div class="field"><label>Neck / Collar (गला)</label><input type="text" id="m_neck" placeholder="15.5" oninput="renderDoc()"></div>
      <div class="field"><label>Bottom / Mohri (मोहरी)</label><input type="text" id="m_bot" placeholder="14" oninput="renderDoc()"></div>
    </div>

    <div class="section-badge">4. Stitching Charges & Instructions</div>
    <div class="grid-3">
      <div class="field"><label>Total Stitching Charge (₹)</label><input type="number" id="in_tot" placeholder="1600" oninput="calcBal()"></div>
      <div class="field"><label>Advance Paid (₹)</label><input type="number" id="in_adv" placeholder="600" oninput="calcBal()"></div>
      <div class="field"><label>Balance Due (₹)</label><input type="number" id="in_bal" readonly style="background:#f1f5f9;font-weight:800;color:#dc2626;"></div>
    </div>
    <div class="field"><label>Special Tailor / Master Notes</label><input type="text" id="in_notes" placeholder="उदा. डिलीवरी लेते समय यह पर्ची लाना अनिवार्य है। कपड़ा अंदर से मार्जिन रखें।" oninput="renderDoc()"></div>

    <div class="actions">
      <button type="button" class="btn btn-pdf" onclick="downloadA4PDF()">📥 Download A4 PDF</button>
      <button type="button" class="btn btn-print" onclick="printDocDirect()">🖨️ Direct Print</button>
      <button type="button" class="btn btn-wa" onclick="shareWhatsApp()">📲 WhatsApp Slip</button>
    </div>
  </div>

  <!-- RIGHT: LIVE PREVIEW -->
  <div class="preview-panel">
    <div class="preview-label">Live Tailoring Slip Preview</div>
    <div id="a4DocSheet">
      <div id="slipsContainer"></div>
    </div>
  </div>
</div>

<script>
  let copyCount = 1;

  function setCopies(n) {
    copyCount = n;
    document.getElementById('btnOne').classList.toggle('active', n === 1);
    document.getElementById('btnTwo').classList.toggle('active', n === 2);
    renderDoc();
  }

  function calcBal() {
    const tot = parseFloat(document.getElementById('in_tot').value) || 0;
    const adv = parseFloat(document.getElementById('in_adv').value) || 0;
    document.getElementById('in_bal').value = Math.max(0, tot - adv);
    renderDoc();
  }

  function renderDoc() {
    const shop = document.getElementById('in_shop').value.trim() || 'ROYAL TAILORS & BOUTIQUE';
    const addr = document.getElementById('in_addr').value.trim() || 'Main Market, City | Mob: 98XXXXXXXX';
    const ord = document.getElementById('in_ord_no').value.trim() || '-';
    const dt = document.getElementById('in_date').value || '-';
    const dlv = document.getElementById('in_deliv').value || '-';
    const cust = document.getElementById('in_cust').value.trim() || '-';
    const ph = document.getElementById('in_phone').value.trim();
    const outfit = document.getElementById('in_outfit').value.trim() || '-';
    const style = document.getElementById('in_style').value.trim() || 'Standard Fitting';
    const notes = document.getElementById('in_notes').value.trim() || 'डिलीवरी लेते समय यह पर्ची लाना अनिवार्य है।';

    const tot = parseFloat(document.getElementById('in_tot').value) || 0;
    const adv = parseFloat(document.getElementById('in_adv').value) || 0;
    const bal = Math.max(0, tot - adv);

    const m = {
      len: document.getElementById('m_len').value || '-',
      chest: document.getElementById('m_chest').value || '-',
      waist: document.getElementById('m_waist').value || '-',
      hip: document.getElementById('m_hip').value || '-',
      shld: document.getElementById('m_shld').value || '-',
      slv: document.getElementById('m_slv').value || '-',
      neck: document.getElementById('m_neck').value || '-',
      bot: document.getElementById('m_bot').value || '-'
    };

    const buildSlip = (badge, isMaster) => `
      <div class="slip-box">
        <div class="slip-header">
          <div>
            <h2>${shop}</h2>
            <p>${addr}</p>
          </div>
          <div class="slip-badge">${badge}</div>
        </div>

        <table class="slip-table">
          <tr>
            <td class="lbl">Order No:</td><td class="val"><b>${ord}</b></td>
            <td class="lbl" style="width:22%;">Delivery:</td><td class="val" style="color:#dc2626;font-weight:800;">${dlv}</td>
          </tr>
          <tr>
            <td class="lbl">Customer:</td><td class="val">${ph ? `${cust} (${ph})` : cust}</td>
            <td class="lbl" style="width:22%;">Order Date:</td><td class="val">${dt}</td>
          </tr>
          <tr>
            <td class="lbl">Garments:</td><td class="val" colspan="3"><b>${outfit}</b> (${style})</td>
          </tr>
        </table>

        <table class="meas-grid">
          <thead>
            <tr>
              <th>Length</th><th>Chest</th><th>Waist</th><th>Hip</th>
              <th>Shoulder</th><th>Sleeve</th><th>Neck</th><th>Bottom</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>${m.len}</td><td>${m.chest}</td><td>${m.waist}</td><td>${m.hip}</td>
              <td>${m.shld}</td><td>${m.slv}</td><td>${m.neck}</td><td>${m.bot}</td>
            </tr>
          </tbody>
        </table>

        ${!isMaster ? `
        <div class="amount-highlight">
          <div><b>TOTAL:</b> ₹${tot.toLocaleString('en-IN')} | <b>ADV:</b> ₹${adv.toLocaleString('en-IN')}</div>
          <div style="color:#dc2626;font-weight:800;font-size:13px;">BALANCE DUE: ₹${bal.toLocaleString('en-IN')}</div>
        </div>` : `<div style="font-size:10.5px;font-weight:800;color:#5b21b6;margin:4px 0;">MASTER CUTTING & KARIGAR WORK TICKET (BAL DUE: ₹${bal})</div>`}

        <div class="notes-box"><b>Instructions:</b> ${notes}</div>

        <div class="footer-row">
          <div style="font-size:9.5px;color:#64748b;">Customer Sign</div>
          <div class="sig-card">${isMaster ? 'Master Cutter Sign' : 'Authorized Shop Sign'}</div>
        </div>
      </div>
    `;

    let html = buildSlip('CUSTOMER JOB SLIP', false);
    if (copyCount === 2) {
      html += `<div class="cut-divider"><span class="cut-tag">✂️ CUT HERE (MASTER COPY)</span></div>` + buildSlip('MASTER CUTTING SLIP', true);
    }
    document.getElementById('slipsContainer').innerHTML = html;
  }

  function downloadA4PDF() {
    const clone = document.getElementById('a4DocSheet').cloneNode(true);
    clone.style.cssText = 'width:700px;margin:0 auto;padding:16px;background:#fff;border:none;box-shadow:none;';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;top:0;left:0;width:740px;z-index:999999;background:#fff;';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);
    html2pdf().set({
      margin: [6, 6, 6, 6],
      filename: `TailorSlip_${document.getElementById('in_ord_no').value || 'Order'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, width: 740, windowWidth: 740 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(clone).save().then(() => wrap.remove()).catch(() => wrap.remove());
  }

  function printDocDirect() {
    const w = window.open('', '_blank', 'width=850,height=900');
    w.document.write(`<!DOCTYPE html><html><head><title>Print Tailoring Slip</title><style>
      *{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;padding:8mm}
      .slip-box{border:1.5px solid #0f172a;border-radius:8px;padding:14px;margin-bottom:8px}
      .slip-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0f172a;padding-bottom:6px;margin-bottom:8px}
      .slip-header h2{margin:0;font-size:15px}.slip-header p{margin:2px 0 0;font-size:10px;color:#64748b}
      .slip-badge{background:#7c3aed;color:#fff;padding:3px 8px;font-size:10px;font-weight:800;border-radius:4px}
      .slip-table{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:11px}
      .slip-table td{padding:3px}.slip-table td.lbl{font-weight:700;color:#475569;width:24%}.slip-table td.val{border-bottom:1px dotted #94a3b8}
      .meas-grid{width:100%;border-collapse:collapse;margin:6px 0;font-size:10.5px;border:1px solid #cbd5e1}
      .meas-grid th{background:#ede9fe;color:#5b21b6;padding:4px;border:1px solid #cbd5e1}.meas-grid td{padding:4px;border:1px solid #cbd5e1;text-align:center;font-weight:700}
      .amount-highlight{background:#f0fdf4;border:1.2px solid #86efac;padding:6px 10px;border-radius:6px;display:flex;justify-content:space-between;margin:6px 0;font-size:11px}
      .notes-box{background:#f8fafc;border-left:3px solid #7c3aed;padding:5px 8px;font-size:10px;margin:6px 0}
      .footer-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;font-size:10px}
      .sig-card{width:44%;text-align:center;border-top:1.5px dashed #475569;padding-top:4px;font-weight:700}
      .cut-divider{display:flex;align-items:center;justify-content:center;position:relative;margin:14px 0;border-top:2px dashed #94a3b8}
      .cut-tag{position:absolute;top:-10px;background:#fff;padding:0 8px;font-size:10px;font-weight:700;color:#64748b}
    </style></head><body>${document.getElementById('a4DocSheet').innerHTML}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 400);
  }

  function shareWhatsApp() {
    const shop = document.getElementById('in_shop').value.trim() || 'Tailor Shop';
    const cust = document.getElementById('in_cust').value.trim() || 'Customer';
    const dlv = document.getElementById('in_deliv').value || '-';
    const bal = document.getElementById('in_bal').value || 0;
    const ph = document.getElementById('in_phone').value.trim().replace(/[^0-9]/g, '');
    const msg = `*✂️ TAILORING ORDER SLIP (${document.getElementById('in_ord_no').value})*\n*Shop:* ${shop}\n*Customer:* ${cust}\n*Delivery Date:* ${dlv}\n*Balance Due:* ₹${bal}\n\n_Generated via KaamKaj Bills._`;
    window.open(ph ? `https://wa.me/91${ph}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }

  window.onload = () => {
    const d = new Date();
    document.getElementById('in_date').value = d.toISOString().split('T')[0];
    d.setDate(d.getDate() + 5);
    document.getElementById('in_deliv').value = d.toISOString().split('T')[0];
    document.getElementById('in_ord_no').value = 'TLR-' + Math.floor(100000 + Math.random() * 899990);
    calcBal();
  };
</script>
</body>
</html>
